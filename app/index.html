     <h4 style="margin:12px 0 4px">Q2. Latest PO release date</h4>${inp("po","date")}
     <h4 style="margin:12px 0 4px">Q3. Latest indent approval date</h4>${inp("ind","date")}
     <h4 style="margin:12px 0 4px">Q4. Calendar days from today to that indent date (negative if already late)</h4>${inp("margin")}`;
  if(q.type==="float") return `<p><b>${esc(q.act)}</b>: total float (working days) at four monthly updates:</p>
     <div class="md"><div class="tw"><table><thead><tr><th>Update</th><th>Jun</th><th>Jul</th><th>Aug</th><th>Sep</th></tr></thead><tbody><tr><td>TF</td>${q.series.map(x=>`<td>${x}</td>`).join("")}</tr></tbody></table></div></div>
     <h4 style="margin:12px 0 4px">Q1. Float lost in the last update</h4>${inp("last")}
     <h4 style="margin:12px 0 4px">Q2. Average float lost per update (1 decimal)</h4>${inp("avg")}
     <h4 style="margin:12px 0 4px">Q3. At the last update's rate, how many more monthly updates until TF ≤ 0? (round up)</h4>${inp("left")}
     <h4 style="margin:12px 0 4px">Q4. Is the erosion accelerating?</h4><div class="filter" id="yn"><button aria-pressed="false" data-y="yes">Yes</button><button aria-pressed="false" data-y="no">No</button></div>`;
  if(q.type==="weighted") return `<p>Hospital block, physical progress by package:</p>
     <div class="md"><div class="tw"><table><thead><tr><th>Package</th><th>Weight</th><th>Progress</th></tr></thead><tbody>${q.names.map((n,i)=>`<tr><td>${n}</td><td>${q.w[i]}%</td><td>${q.p[i]}%</td></tr>`).join("")}</tbody></table></div></div>
     <h4 style="margin:12px 0 4px">Q1. Overall weighted progress, % (1 decimal)</h4>${inp("overall")}
     <h4 style="margin:12px 0 4px">Q2. Ten more points of progress in which package moves the overall figure most?</h4><div class="filter" id="bestpick">${q.names.map(n=>`<button aria-pressed="false" data-b="${esc(n)}">${esc(n)}</button>`).join("")}</div>`;
  if(q.type==="qty") return `<p>The contractor claims progress on <b>${esc(q.sys)}</b>. BOQ quantity: <b>${q.boq} rm</b>.</p>
     <ul><li>Issued from store: <b>${q.iss} rm</b></li><li>Installed in position: <b>${q.ins} rm</b></li><li>Installed and pressure-tested: <b>${q.tst} rm</b></li></ul>
     <h4 style="margin:12px 0 4px">Q1. The contractor's bill shows a round figure. Which % did he use? (issued ÷ BOQ, 1 decimal)</h4>${inp("claim")}
     <h4 style="margin:12px 0 4px">Q2. Physical progress you'd certify on installed quantity, %</h4>${inp("inst")}
     <h4 style="margin:12px 0 4px">Q3. Progress on tested quantity, %</h4>${inp("tested")}
     <h4 style="margin:12px 0 4px">Q4. Over-claim in percentage points (claim − installed)</h4>${inp("over")}`;
}
function grade(q, vals){
  const out=[]; const num=(k,exp,tol=0)=>{ const v=parseFloat(vals[k]); out.push({k,ok:!isNaN(v)&&Math.abs(v-exp)<=tol+1e-9,exp,got:vals[k]??""}); };
  const str=(k,exp)=>out.push({k,ok:String(vals[k]||"")===String(exp),exp,got:vals[k]??""});
  if(q.type==="cpm"){ num("pf",q.sol.pf); const by={}; q.acts.forEach(a=>by[a.id]=a);
    q.ask.forEach(id=>["es","ef","ls","lf","tf","ff"].forEach(f=>num(id+"."+f,by[id][f])));
    const pickd=(vals.crit||[]).slice().sort().join(","), exp=q.sol.crit.slice().sort().join(","); out.push({k:"crit",ok:pickd===exp,exp,got:pickd}); }
  if(q.type==="proc"){ str("ex",q.ans.ex); str("po",q.ans.po); str("ind",q.ans.ind); num("margin",q.ans.margin); }
  if(q.type==="float"){ num("last",q.ans.last); num("avg",q.ans.avg,0.05); num("left",q.ans.left); str("acc",q.ans.acc); }
  if(q.type==="weighted"){ num("overall",q.ans.overall,0.1); str("best",q.ans.best); }
  if(q.type==="qty"){ num("claim",q.ans.claim,0.1); num("inst",q.ans.inst,0.1); num("tested",q.ans.tested,0.1); num("over",q.ans.over,0.15); }
  return out;
}
function solution(q){
  if(q.type==="cpm") return `**Forward pass** (earliest dates):\n\n${q.sol.fwd.map(x=>"- "+x).join("\n")}\n\nProject duration = **${q.sol.pf}** working days.\n\n**Backward pass** (latest dates, take the MIN at merges):\n\n${q.sol.bwd.map(x=>"- "+x).join("\n")}\n\n**Free float** = min over successors of (successor's constraint − own date):\n\n${q.acts.map(a=>`- ${a.id}: FF **${a.ff}**${a.tf>a.ff?` (TF ${a.tf}: shared with the activities after it)`:""}`).join("\n")}\n\n**Critical path:** ${q.sol.crit.join(" – ")} (TF = 0).`;
  if(q.type==="proc"){ const a=q.ans, d=x=>fmtD(new Date(x));
    return `Work backwards from the date it is needed:\n\n- Delivered to site **${d(q.need)}** − ${q.T} calendar days transit = ex-works **${d(a.ex)}**\n- − ${q.M} calendar days manufacture = PO by **${d(a.po)}**\n- − ${q.N} **working** days (Mon–Sat) of TAT = indent approval by **${d(a.ind)}**\n- From today ${d(q.today)} to ${d(a.ind)} = **${a.margin}** calendar days${a.margin<0?". The indent is already late: escalate now.":a.margin<15?". Very tight: the indent must move this week.":"."}\n\nCheck: working days skip Sundays, so ${q.N} working days spans more than ${q.N} calendar days.`; }
  if(q.type==="float"){ const s=q.series, a=q.ans;
    return `- Losses per update: ${s[0]}→${s[1]} = ${s[0]-s[1]}, ${s[1]}→${s[2]} = ${s[1]-s[2]}, ${s[2]}→${s[3]} = **${a.last}**\n- Average = (${s[0]} − ${s[3]}) ÷ 3 = **${a.avg}**\n- At ${a.last} per update: ${s[3]} ÷ ${a.last} → **${a.left}** more update${a.left>1?"s":""} to reach zero\n- Accelerating? **${a.acc==="yes"?"Yes, each loss is bigger than the last":"No, the losses are not growing every update"}**\n\nWhat goes in the report: "${q.act}: TF ${s[3]} WD, falling ${a.last}/month${a.acc==="yes"?" and accelerating":""}; critical in about ${a.left} month${a.left>1?"s":""} if the trend holds."`; }
  if(q.type==="weighted"){ const t=q.names.map((n,i)=>`${q.w[i]}% × ${q.p[i]}% = ${(q.w[i]*q.p[i]/100).toFixed(1)}`);
    return `- ${t.join("\n- ")}\n- Sum = **${q.ans.overall}%**\n\n+10 points in a package adds weight × 10%, so the biggest weight wins: **${q.ans.best}** (+${(Math.max(...q.w)/10).toFixed(1)} points overall).`; }
  if(q.type==="qty"){ const a=q.ans;
    return `- Claim: ${q.iss} ÷ ${q.boq} = **${a.claim}%**. He billed material issued from store, not work installed.\n- Installed: ${q.ins} ÷ ${q.boq} = **${a.inst}%**: the figure you certify\n- Tested: ${q.tst} ÷ ${q.boq} = **${a.tested}%**: what is genuinely complete\n- Over-claim: ${a.claim} − ${a.inst} = **${a.over} points**\n\nYour line to the contractor: "Certifying ${a.inst}% on installed quantity; ${(a.inst-a.tested).toFixed(1)} points remain subject to pressure testing."`; }
}
const LABELS={pf:"Project duration",crit:"Critical path",ex:"Ex-works date",po:"PO date",ind:"Indent date",margin:"Days of margin",last:"Last loss",avg:"Average loss",left:"Updates left",acc:"Accelerating",overall:"Overall %",best:"Biggest-weight package",claim:"Claim %",inst:"Installed %",tested:"Tested %",over:"Over-claim"};
function renderDrill(w){
  const d=DRILLS.find(x=>x.id===pr.drill), q=pr.q;
  if(drillTimerInterval) clearInterval(drillTimerInterval);
  drillTimerSec = 0;
  drillTimerInterval = setInterval(()=>{
    drillTimerSec++;
    const el = $("pr-timer");
    if(el) el.textContent = `⏱ ${drillTimerSec}s`;
  }, 1000);
  w.innerHTML=`<div class="btnrow" style="margin:0 0 10px"><button class="btn" id="pr-back">← Practice</button><span id="pr-timer" style="padding:6px 12px;background:var(--barSoft);border-radius:8px;font-size:.84rem;font-weight:700">⏱ 0s</span>${d.lesson?`<button class="btn" id="pr-les">Lesson</button>`:""}</div>
    <h2 class="sec">${esc(d.title)}</h2><div class="card" style="padding:4px 14px 14px" id="pr-q">${drillBody(q)}</div>
    <div class="btnrow"><button class="send" id="pr-check">Check my answers</button><button class="btn" id="pr-new">New problem</button></div><div id="pr-res"></div>`;
  $("pr-back").onclick=()=>{ if(drillTimerInterval) clearInterval(drillTimerInterval); pr={view:"home"}; renderPractice(); };
  d.lesson&&($("pr-les").onclick=()=>{ if(drillTimerInterval) clearInterval(drillTimerInterval); pr={view:"lesson",lesson:d.lesson}; renderPractice(); });
  $("pr-new").onclick=()=>startPractice(d.id);
  w.querySelectorAll("[data-choice] button").forEach(b=>b.onclick=()=>{ b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); });
  w.querySelectorAll("#critpick [data-c],#yn [data-y],#bestpick [data-b]").forEach(b=>b.onclick=()=>{
    const grp=b.parentElement; if(grp.id!=="critpick") grp.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"&&grp.id==="critpick"?"false":"true"); });
  $("pr-check").onclick=async()=>{
    const vals={}; w.querySelectorAll("#pr-q [data-k]").forEach(i=>vals[i.dataset.k]=i.value.trim());
    vals.crit=[...w.querySelectorAll("#critpick [aria-pressed=true]")].map(b=>b.dataset.c);
    const y=w.querySelector("#yn [aria-pressed=true]"); if(y) vals.acc=y.dataset.y;
    const bp=w.querySelector("#bestpick [aria-pressed=true]"); if(bp) vals.best=bp.dataset.b;
    w.querySelectorAll("[data-choice]").forEach(g=>{ const s=g.querySelector("[aria-pressed=true]"); if(s) vals[g.dataset.choice]=s.dataset.v; });
    const filled=Object.entries(vals).filter(([k,v])=>Array.isArray(v)?v.length:v!=="").length;
    if(filled<1){ $("pr-res").innerHTML=`<p class="status">Fill in your answers first. Write what you'd say, even if unsure.</p>`; return; }
    if(drillTimerInterval) clearInterval(drillTimerInterval);
    const durationSec = drillTimerSec;
    const g=grade(q,vals), score=Math.round(g.filter(x=>x.ok).length/g.length*100);
    haptic(score >= 80);
    if(score >= 80) playTone("correct"); else playTone("miss");
    w.querySelectorAll("#pr-q [data-k]").forEach(i=>{ const r=g.find(x=>x.k===i.dataset.k); if(r){ i.style.borderColor=r.ok?"var(--ok)":"var(--crit)"; i.style.borderWidth="2px"; } });
    const wrong=g.filter(x=>!x.ok);
    const weak=[...new Set(wrong.map(x=>x.k.includes(".")?x.k.split(".")[1].toUpperCase():LABELS[x.k]||x.k))];
    $("pr-res").innerHTML=`<div class="card" style="padding:4px 14px 12px;margin-top:12px"><h2 class="sec" style="margin-top:10px">Score ${score}/100 <small style="color:var(--muted);font-size:.85rem">(completed in ${durationSec}s)</small></h2>
      ${wrong.length?`<p><b>Wrong:</b> ${wrong.map(x=>`${x.k.includes(".")?x.k.replace(".", " ").toUpperCase():LABELS[x.k]||x.k} (you: ${esc(Array.isArray(x.got)?x.got.join(","):x.got||"blank")}, correct: <b>${esc(x.exp)}</b>)`).join(" · ")}</p>`:"<p>All correct.</p>"}
      <div class="md">${md(solution(q))}</div></div>`;
    state.practice=(state.practice||[]); state.practice.push({t:Date.now(),type:d.id,score,weak,reported:false}); state.practice=state.practice.slice(-300);
    await save();
  };
}
function practiceReport(){
  const p=(state.practice||[]).filter(x=>!x.reported); if(!p.length) return null;
  const by={}; p.forEach(x=>{ (by[x.type]=by[x.type]||[]).push(x); });
  return "OFFLINE PRACTICE since last session (auto-graded by exact calculation; objective application evidence, but still verify understanding with explanation/judgment before moving status): "+
    Object.entries(by).map(([t,xs])=>{ const wk={}; xs.forEach(x=>x.weak.forEach(k=>wk[k]=(wk[k]||0)+1));
      return `${DRILLS.find(d=>d.id===t)?.title||t}: ${xs.length} done, avg ${Math.round(xs.reduce((a,x)=>a+x.score,0)/xs.length)}, latest ${xs[xs.length-1].score}${Object.keys(wk).length?`, most-missed: ${Object.entries(wk).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${k}×${n}`).join(", ")}`:""}`; }).join(" | ");
}

const LESSONS2 = [
 {id:"L9", week:3, drill:null, title:"P6 essentials and the update cycle",
  card:{rule:"Update = set the data date, enter actual start/finish, set remaining duration, reschedule. Retained logic respects the original logic; progress override lets started work ignore it.", example:"Ceiling boarding started before above-ceiling MEP finished. Retained logic: the remaining boarding waits for MEP to finish. Progress override: it continues independently and can hide a real constraint.", trap:"Editing planned dates by hand instead of entering actuals and remaining durations."},
  body:`**Structure in P6:** EPS (enterprise portfolio: Oneevolve › Healthcare › Project) → project → WBS → activities. OBS holds the responsible people. Calendars set the working days per activity (6-day site week, holidays).

**Baseline:** take a copy of the approved schedule and assign it as the project baseline. Compare with baseline bars and variance columns (BL finish vs finish).

**Monthly update, in order:**
1. Set the **data date** to the cut-off, e.g. 30 Sep.
2. For finished work, enter **actual start and finish**.
3. For work in progress, enter the **actual start** plus a **remaining duration** (what site says is left, not what the plan says).
4. **Reschedule.** P6 pushes all remaining work to the right of the data date.
5. Check: no forecast dates before the data date, no actuals after it (DCMA check 9).

**Out-of-sequence progress** (work starts before its predecessor is done):
- **Retained logic**: the remaining part still waits for the predecessor. Conservative, and usually the right choice.
- **Progress override**: the started activity ignores the predecessor. It can hide a real constraint.
- **Actual dates**: uses actuals only (rare).

**% complete types:** duration % (time-based), physical % (measured on site; use this for construction), units % (from resources). Never let "duration %" stand in for physical progress.

**Hospital example:** OT-2 ceiling boarding started on 20 Sep, but above-ceiling medical gas testing isn't done. Under retained logic, the remaining 6 days of boarding wait for the gas test, and the OT handover slips. That's the honest forecast.`},
 {id:"L10", week:4, drill:"credit", title:"Physical progress: rules of credit and S-curves",
  card:{rule:"Rule of credit = fixed weights for measurable steps; progress = Σ weight × step quantity ÷ BOQ. An S-curve shows the gap in % and in time.", example:"Piping: supports 10, installed 50, tested 20, insulated 10, commissioned 10. 2,000 of 2,500 rm with supports, 1,600 installed, 900 tested → 8 + 32 + 7.2 = 47.2%, not 64%.", trap:"Giving 100% credit for installed pipe that isn't tested."},
  body:`**Rule of credit:** split each trade into measurable steps with fixed weights agreed **before** work starts. Example for MEP piping:

| Step | Weight |
|---|---|
| Supports & hangers | 10% |
| Pipe installed | 50% |
| Pressure tested | 20% |
| Insulated | 10% |
| Flushed / commissioned | 10% |

**Progress** = Σ (weight × quantity done at that step ÷ BOQ quantity).

**Worked example:** BOQ 2,500 rm. Supports 2,000, installed 1,600, tested 900, insulated and commissioned 0.
- 10% × 2,000/2,500 = 8.0
- 50% × 1,600/2,500 = 32.0
- 20% × 900/2,500 = 7.2

**Total = 47.2%.** The contractor's "installed ÷ BOQ" figure is 64%, an over-claim of 16.8 points.

**S-curve:** cumulative planned % against cumulative actual %, month by month. Read it two ways:
- **Vertical gap** = variance in % points (planned 46, actual 41 → −5).
- **Horizontal gap** = variance in **time**: "41% is where the plan was in mid-August, so we're about 1.5 months behind." Management understands time; give them both.

**Physical vs financial progress:** billing runs ahead of physical progress when material advances or secured-material payments are made, and lags behind when certification is slow. Never report billing as progress.`},
 {id:"L11", week:5, drill:"cost", title:"Cost control: budget, commitment, actual, EAC",
  card:{rule:"EAC = committed + uncommitted forecast + likely variations. VAC = budget − EAC. Cost incurred = certified actual + accrual. ETC = EAC − incurred.", example:"Budget 800, committed 620, still to buy 150, likely variations 45 → EAC 815, VAC −15 (overrun). Incurred 410 certified + 35 accrued = 445; ETC 370.", trap:"Treating invoices as cost. Ignoring work done but not yet certified (accrual)."},
  body:`A cost report line has these columns (₹ lakh):
- **Budget**: the approved control budget for the control account.
- **Committed**: POs and subcontracts placed. These are a legal obligation, whether or not anything has been invoiced.
- **Uncommitted forecast**: the estimate for scope not yet bought.
- **Likely variations**: changes probable but not yet approved.
- **EAC** (estimate at completion) = committed + uncommitted + likely variations.
- **VAC** (variance at completion) = budget − EAC. Negative = overrun.
- **Actual (certified)**: work certified for payment.
- **Accrual**: work done but not yet certified or invoiced.
- **Cost incurred** = actual + accrual.
- **ETC** (estimate to complete) = EAC − incurred.

**Worked example, HVAC control account:** budget 800, committed 620, uncommitted 150, likely variations 45.
- EAC = 620 + 150 + 45 = **815**
- VAC = 800 − 815 = **−15** (overrun)
- Certified 410 + accrued 35 = **445** incurred
- ETC = 815 − 445 = **370**

**Contingency** is held separately with an owner and drawn down only against a risk in the register. It's not a buffer to hide overruns.

**What you say:** "HVAC forecasts ₹15 L over budget, driven by ₹45 L of likely variations; without them it's ₹30 L under."`},
 {id:"L12", week:6, drill:"evm", title:"Earned Value: PV, EV, AC and the forecasts",
  card:{rule:"SV = EV − PV, CV = EV − AC, SPI = EV/PV, CPI = EV/AC, EAC = BAC/CPI, ETC = EAC − AC, VAC = BAC − EAC, TCPI = (BAC − EV)/(BAC − AC).", example:"BAC 1,200; plan 40% → PV 480; earned 34% → EV 408; AC 450. SPI 0.85, CPI 0.91, EAC 1,324, VAC −124, TCPI 1.06.", trap:"Using billing as EV. Reading SPI near the end of a late project (it drifts back to 1.0)."},
  body:`- **BAC**: budget at completion.
- **PV** (planned value) = BAC × planned % at the data date.
- **EV** (earned value) = BAC × **physical** % complete.
- **AC** (actual cost) = cost incurred to date.

**Variances and indices:**
- SV = EV − PV (negative = behind)
- CV = EV − AC (negative = over cost)
- SPI = EV ÷ PV
- CPI = EV ÷ AC

**Forecasts:**
- EAC = BAC ÷ CPI (the typical assumption: current cost efficiency continues)
- ETC = EAC − AC
- VAC = BAC − EAC
- TCPI = (BAC − EV) ÷ (BAC − AC): the efficiency needed on the remaining work to finish on budget. Above about 1.10 is rarely achieved.

**Worked example** (₹ lakh): BAC 1,200, planned 40%, earned 34%, AC 450.
- PV 480, EV 408
- SV −72, CV −42
- SPI 0.85, CPI 0.91 (0.9067)
- EAC 1,200 ÷ 0.9067 = **1,324**, ETC 874, VAC **−124**
- TCPI = 792 ÷ 750 = **1.06**

**Say it:** "We've earned ₹408 L of work for ₹450 L spent. At this efficiency we finish ₹124 L over. Recovering would need 6% better efficiency on everything left, which is unlikely without a scope or method change."

**Limits:** EV is only as good as the physical progress measure. SPI says nothing about the critical path; use the schedule for that.`},
 {id:"L13", week:7, drill:"proc", title:"Procurement controls and schedule integration",
  card:{rule:"Each long-lead item has a required-on-site (ROS) date from the schedule; back-calculate the PO-by and indent-by dates; float = ROS − forecast delivery.", example:"Chiller ROS 15 Mar. Forecast delivery 2 Mar → procurement float 13 days. If the vendor slips 20 days, delivery is 22 Mar → 7 days late against ROS → check the TF of chiller installation.", trap:"Tracking procurement by PO dates only, not against the date it is needed on site."},
  body:`**Procurement chain** for each long-lead item: indent → RFQ → technical evaluation → commercial evaluation → comparison and approval → PO → drawings submitted and approved → manufacture → inspection / FAT → dispatch → transit → delivery (GRN) → install → test.

**Integration:** link the delivery milestone into the schedule as the predecessor of installation. The schedule then gives you the **ROS (required on site) date** from installation's late start.

**Procurement float** = ROS − forecast delivery.
- Positive: buffer.
- Negative: delivery will drive the installation late. Then check installation's TF to see whether **handover** moves.

**Two numbers per item, every month:** forecast delivery vs ROS, and internal TAT trend.

**Hospital example:**
- Chiller ROS 15 Mar (from installation late start), forecast delivery 2 Mar → float +13.
- The vendor reports a 20-day slip → delivery 22 Mar → −7 against ROS.
- Installation has TF 4 → handover moves 3 days unless recovered.
- Options: expedite (air-freight the compressor), re-sequence (start chilled-water piping first), absorb (a second crew on installation), accept.

**Vendor performance:** track promised vs actual dates per vendor. Use it in the next comparative statement, not just in complaints.`},
 {id:"L14", week:8, drill:"cash", title:"Cash flow: billing, retention, advances, timing",
  card:{rule:"Net receivable = gross certified − retention − advance recovery (− other deductions). Cash arrives on certification date + payment terms.", example:"₹120 L certified, 5% retention, 10% advance recovery → net 102 L, paid 45 days after the 10 Nov certification = 25 Dec.", trap:"Forecasting cash in the month the work is done instead of the month it is paid."},
  body:`**Inflow for one bill:**
- Gross work certified (G)
- − Retention (r% × G), held until handover or defects liability
- − Mobilisation advance recovery (a% × G until the advance is fully recovered)
- = **Net receivable**, paid **certification date + payment terms** (30 / 45 / 60 days)

**Worked example:** G = ₹120 L, retention 5% = 6, advance recovery 10% = 12.
- Net = 120 − 6 − 12 = **₹102 L**
- Certified 10 Nov, terms 45 days → cash on **25 Dec**

**Cash-flow forecast:** take the schedule's monthly earned value, shift it by the measurement and certification cycle (often 15–30 days) and by the payment terms, then apply the deductions. Outflows to vendors follow their own credit terms. The gap between the two curves is the working capital requirement.

**PMC angle:** the client asks "how much do I need to fund each month?" The answer comes from the schedule, not from last month's bill. If the schedule slips, the cash curve moves right too, and so does the funding request.

**Variance:** compare forecast vs actual cash monthly. Explain it as timing (the work happened but payment was late) or volume (the work didn't happen).`},
 {id:"L15", week:8, drill:"risk", title:"Risk: risk vs issue, scoring, EMV, owners",
  card:{rule:"Risk = uncertain future event; issue = already happened. EMV = probability × impact. Every risk needs an owner, a trigger and a response.", example:"Chiller vendor insolvency: 20% × ₹60 L = EMV ₹12 L; trigger = missed drawing submittal; owner = procurement lead; response = qualify a second vendor now.", trap:"Putting issues in the risk register. Risks with no owner or trigger."},
  body:`- **Risk**: may happen (probability < 100%). **Issue**: has happened. It goes to the issue log and action tracker, not the risk register.
- **Score**: probability × impact (1–5 scales gives 1–25). Thresholds decide action, e.g. 15+ escalates to the Director monthly.
- **EMV** (expected monetary value) = probability × cost impact. The sum of EMVs is a sanity check on the size of the contingency.
- **Owner**: one named person who watches it and acts.
- **Trigger**: the early sign that it's starting.
- **Response**: avoid, reduce, transfer (insurance, contract) or accept (with contingency).

**Hospital example:**

| Risk | P | Impact | EMV |
|---|---|---|---|
| Chiller vendor insolvency | 20% | ₹60 L, 45 days | ₹12 L |
| NABH inspection rework on OT | 30% | ₹25 L | ₹7.5 L |
| Monsoon delays excavation | 50% | ₹10 L | ₹5 L |

The register also shows the owner, trigger and response for each risk.

**Integration:** link the top risks to schedule activities so that if a risk fires you can see the impact on the critical path immediately.`},
 {id:"L16", week:9, drill:"tia", title:"Delay analysis and Time Impact Analysis",
  card:{rule:"TIA: insert a fragnet for the delay event into the current schedule; delay to completion = new finish − old finish. Float absorbs part or all of it.", example:"Late MEP drawings: fragnet 12 days before ceiling closure (TF 5) → finish moves 12 − 5 = 7 days → EOT claim 7 days, not 12.", trap:"Claiming the full event duration as delay when float absorbed part of it."},
  body:`**Classify every delay:**
- **Critical or not?** Does it move the completion date? Check its float.
- **Who owns it?**
  - Employer risk (late drawings, client changes, late access) → **excusable**, often **compensable** (time + money).
  - Neutral (force majeure, exceptional weather) → excusable, usually time only.
  - Contractor risk (late mobilisation, poor productivity) → **non-excusable**: LDs may apply.
- **Concurrent delay:** both parties delay the critical path at the same time. Contracts and protocols treat this differently; record it carefully.

**Time Impact Analysis (prospective, AACE 52R-06):**
1. Take the latest accepted schedule update, before the event.
2. Build a **fragnet**: the small chain of activities representing the event (e.g. "revised MEP drawings, 12 days").
3. Insert it with logic into the affected activity.
4. Reschedule. The **delay to completion** = new finish − old finish.

**Worked example:** ceiling closure has TF 5. The client's late drawings add a 12-day fragnet before it.
- 12 − 5 = **7 days** delay to completion
- EOT entitlement = 7 days, not 12

**Records win claims:** dated letters, minutes, drawing transmittals, and daily reports showing who was waiting for what (see the SCL Protocol).`},
 {id:"L17", week:10, drill:"ld", title:"Change control, LDs and EOT arithmetic",
  card:{rule:"Culpable delay = actual delay − EOT granted. LD = rate × weeks (or part) × contract value, capped at the contract limit.", example:"Contract ₹80 Cr, 0.5%/week, cap 5%, delay 52 days, EOT 20 → culpable 32 days → 5 weeks → 2.5% = ₹2 Cr (under the ₹4 Cr cap).", trap:"Applying LDs to the full delay without deducting EOT. Forgetting the cap."},
  body:`**Change control flow:** identify → change request (scope, cost, time) → valuation → approval → change order → update the budget, the baseline (if approved) and the change log. Track **cumulative** change impact: ten small variations can move handover as much as one big one.

**Valuation of a variation:**
1. Use the BOQ rate where the work is similar.
2. Use a pro-rata of the BOQ rate where it's partly similar.
3. Build a new rate (rate analysis; CPWD DSR as a benchmark).

**LD arithmetic** (check your contract clause, these vary):
- Culpable delay = actual delay − EOT granted
- Weeks counted = culpable days ÷ 7, **rounded up** if the clause says "per week or part thereof"
- LD = rate × weeks × contract value, capped at the maximum (often 5–10%)

**Worked example:** contract ₹80 Cr, 0.5% per week or part, cap 5%. Actual delay 52 days, EOT 20.
- Culpable = 32 days → 5 weeks (4.57, rounded up)
- 5 × 0.5% = 2.5% → **₹2 Cr** (cap ₹4 Cr not reached)

**India:** under s.74 of the Contract Act, the LD sum is the ceiling of reasonable compensation. Recovery depends on the delay records. Context only; take legal advice on live disputes.`},
 {id:"L18", week:11, drill:null, title:"Integrated project controls: the monthly cycle",
  card:{rule:"One data date, one cycle: progress → schedule update → cost/EVM → procurement → cash flow → risk → one integrated narrative with decisions.", example:"Chiller slip (procurement) → installation late (schedule) → acceleration ₹18 L (cost) → payment milestone moves a month (cash) → handover risk score up (risk) → Director chooses expedite vs accept.", trap:"Five separate reports with five different data dates and no single story."},
  body:`**The monthly control cycle, all on the same data date:**
1. **Progress** measured (rules of credit, verified on site).
2. **Schedule** updated: critical path, float trend, forecast finish.
3. **Cost**: commitments, actuals, accruals, EAC; EVM from the same progress.
4. **Procurement**: forecast delivery vs ROS for long-lead items.
5. **Cash flow**: re-forecast from the updated schedule.
6. **Risk**: the register re-scored; new risks from the above.
7. **Narrative**: one story, one set of decisions.

**Integration means one event appears consistently everywhere.** Chiller slips 20 days:
- schedule: installation late, TF consumed
- cost: acceleration option ₹18 L
- cash: commissioning payment milestone moves a month
- risk: handover risk re-scored up
- decision: expedite vs accept, by a date

**Data governance:** one owner per data source, a fixed cut-off, a check before publishing (do the progress %, EV and billing reconcile?), and version control on the schedule.

**Control account manager:** the person who owns one control account's scope, schedule and budget, and explains its variance every month.`},
 {id:"L19", week:12, drill:null, title:"Management reporting and the executive narrative",
  card:{rule:"Every report answers: where are we, where should we be, why the gap, impact (days first, then ₹), forecast, risks, recovery options, decision needed by when.", example:"\"Handover forecast 12 Apr vs baseline 31 Mar (+12 days), driven by the chiller slip. Options: air-freight compressor ₹9 L (recovers 8 days) or accept (LD exposure ₹1.6 Cr). Decision needed by 20 Nov.\"", trap:"Activity lists and percentages with no decision request. Calling the Director 'Dear Director' in a report line."},
  body:`**The executive one-pager:**
1. **Status line**: forecast handover vs baseline, in days; overall progress, planned vs actual.
2. **Why**: the 1–3 drivers (critical path items), each with an owner.
3. **Impact**: schedule first, then cost, then cash.
4. **Forecast**: completion date and EAC, with the basis stated.
5. **Top risks**: score, owner, trigger.
6. **Recovery options**: each costed (expedite / substitute / re-sequence / absorb / accept).
7. **Decision required**: who, between which options, by when.

**Register:** third person, no salutation, one fact per sentence, numbers with units.

**Dashboard:** KPIs that point to a decision, such as SPI and CPI trends, float erosion on near-critical paths, procurement float for long-lead items, and cash variance. Not decoration.

**Example status line:**
> "Handover forecast 12 Apr vs baseline 31 Mar (+12 days), driven by the chiller slip. Options: air-freight the compressor ₹9 L (recovers 8 days), or accept (LD exposure ₹1.6 Cr). Director's decision needed by 20 Nov."`},
];

const r2=x=>Math.round(x*100)/100, r1=x=>Math.round(x*10)/10;
function genCredit(){
  const boq=rnd(18,40)*100, sup=Math.round(boq*rnd(70,95)/100/10)*10, ins=Math.round(sup*rnd(70,95)/100/10)*10, tst=Math.round(ins*rnd(30,80)/100/10)*10, insu=Math.round(tst*rnd(0,70)/100/10)*10;
  const W=[10,50,20,10,10], Q=[sup,ins,tst,insu,0];
  const parts=W.map((w,i)=>w*Q[i]/boq), tot=r1(parts.reduce((a,b)=>a+b,0)), claim=r1(ins/boq*100);
  return {type:"credit", sys:pick(["chilled-water piping","fire sprinkler piping","medical gas copper pipeline","domestic water piping"]), boq, Q, W, parts, ans:{tot, claim, over:r1(claim-tot)}};
}
function genScurve(){
  const plan=[]; let c=0; const inc=[2,4,6,9,11,12,12,11,10,9,8,6]; inc.forEach(x=>{ c+=x; plan.push(Math.min(100,c)); });
  const k=rnd(5,9), lag=rnd(5,15)/10; // months behind
  const f=k-lag, lo=Math.floor(f), act=r1(lo<1?plan[0]*f:plan[lo-1]+(plan[lo]-plan[lo-1])*(f-lo));
  const pv=plan[k-1], sv=r1(act-pv);
  let m=0; for(let i=0;i<plan.length;i++){ if(plan[i]>=act){ const prev=i?plan[i-1]:0; m=i+(act-prev)/(plan[i]-prev); break; } }
  return {type:"scurve", plan, k, act, ans:{sv, when:r1(m), behind:r1(k-m)}};
}
function genCost(){
  const B=rnd(40,120)*10, C=Math.round(B*rnd(60,80)/100), U=Math.round(B*rnd(10,25)/100), V=rnd(0,8)*5, A=Math.round(C*rnd(40,70)/100), R=rnd(2,8)*5;
  const eac=C+U+V; return {type:"cost", ca:pick(["HVAC","Electrical","Plumbing & fire","Interiors","Medical gas & OT"]), B,C,U,V,A,R, ans:{eac, vac:B-eac, inc:A+R, etc:eac-(A+R)}};
}
function genEVM(){
  const BAC=rnd(60,200)*10, p=rnd(25,70), e=Math.max(5,p-rnd(-3,12)), PV=BAC*p/100, EV=BAC*e/100, AC=Math.round(EV*rnd(95,120)/100);
  const cpi=EV/AC, spi=EV/PV, eac=BAC/cpi;
  return {type:"evm", BAC,p,e,AC, ans:{pv:r1(PV),ev:r1(EV),sv:r1(EV-PV),cv:r1(EV-AC),spi:r2(spi),cpi:r2(cpi),eac:Math.round(eac),etc:Math.round(eac-AC),vac:Math.round(BAC-eac),tcpi:r2((BAC-EV)/(BAC-AC))}};
}
function genCash(){
  const G=rnd(40,250), r=pick([5,10]), a=pick([0,10,10,15]), terms=pick([30,45,60]);
  const cert=addC(D0(new Date()),rnd(5,40)), prevRet=rnd(0,40);
  const net=r1(G-G*r/100-G*a/100);
  return {type:"cash", G,r,a,terms, cert:iso(cert), prevRet, ans:{ret:r1(G*r/100), adv:r1(G*a/100), net, pay:iso(addC(cert,terms)), cum:r1(prevRet+G*r/100)}};
}
function genRisk(){
  const pool=[["Chiller vendor insolvency",[60,90]],["NABH inspection rework on OT",[15,35]],["Monsoon flooding of excavation",[8,20]],["Late client sign-off on OT layouts",[20,45]],["Medical gas manifold import delay",[25,50]],["Fire NOC delayed by authority",[30,70]],["Labour shortage during festival season",[10,25]]];
  const ch=[...pool].sort(()=>Math.random()-.5).slice(0,4).map(([n,[lo,hi]])=>({n, p:pick([10,20,25,30,40,50,60]), imp:rnd(lo,hi)}));
  const issue=rnd(0,3); ch[issue].p=100; ch[issue].n+=" (already happened: approval refused last week)";
  ch.forEach(x=>x.emv=r1(x.p*x.imp/100));
  const risks=ch.filter(x=>x.p<100), top=risks.reduce((a,b)=>b.emv>a.emv?b:a);
  return {type:"risk", ch, issue:ch[issue].n, ans:{issue:String(issue), top:ch.indexOf(top)+"", topemv:top.emv, total:r1(risks.reduce((a,x)=>a+x.emv,0))}};
}
function genTIA(){
  for(let tries=0;tries<50;tries++){
    const q=genCPM(1), acts=q.acts.map(a=>({...a,pred:a.pred.map(p=>({...p}))}));
    const cand=acts.filter(a=>a.pred.length&&a.id!==acts[acts.length-1].id); if(!cand.length) continue;
    const X=pick(cand); const before=JSON.parse(JSON.stringify(acts)); const sb=cpm(before); const Xb=before.find(a=>a.id===X.id);
    const k=Xb.es+rnd(2,14);
    const frag={id:"Z",name:"Client-revised drawings (fragnet)",dur:k,pred:[]};
    const after=JSON.parse(JSON.stringify(acts)).map(a=>{ delete a.succ; return a; });
    after.forEach(a=>{ if(a.id===X.id) a.pred.push({id:"Z",type:"FS",lag:0}); });
    const sa=cpm([frag,...after]);
    return {type:"tia", acts:before, X:X.id, k, ans:{tf:Xb.tf, es:Xb.es, nf:sa.pf, delay:sa.pf-sb.pf, of:sb.pf}};
  }
  return genTIA();
}
function genLD(){
  const CV=rnd(30,150), rate=pick([0.5,0.5,1]), cap=pick([5,10]), D=rnd(20,110), E=rnd(0,Math.floor(D*.6));
  const cul=D-E, wk=Math.ceil(cul/7), raw=rate*wk, pct=Math.min(raw,cap);
  return {type:"ld", CV,rate,cap,D,E, ans:{cul, wk, pct:r2(pct), amt:r2(CV*pct/100*100)/1, capped:raw>=cap?"yes":"no"}};
}

Object.assign(LABELS,{tot:"Earned %",sv:"SV",when:"Plan month",behind:"Months behind",eac:"EAC",vac:"VAC",inc:"Cost incurred",etc:"ETC",pv:"PV",ev:"EV",cv:"CV",spi:"SPI",cpi:"CPI",tcpi:"TCPI",ret:"Retention",adv:"Advance recovery",net:"Net receivable",pay:"Payment date",cum:"Cumulative retention",issue:"Issue",top:"Top risk",topemv:"Top EMV",total:"Total EMV",tf:"TF before",es:"ES before",nf:"New finish",delay:"Delay to completion",cul:"Culpable days",wk:"Weeks counted",pct:"LD %",amt:"LD ₹ lakh",capped:"Cap reached"});
const tbl=(head,rows)=>`<div class="md"><div class="tw"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;

const _drillBody=drillBody;
drillBody=function(q){
  if(q.type==="credit") return `<p><b>${esc(q.sys)}</b>, BOQ <b>${q.boq} rm</b>. Agreed rule of credit and quantities done:</p>${tbl(["Step","Weight","Qty done (rm)"],[["Supports & hangers","10%",q.Q[0]],["Pipe installed","50%",q.Q[1]],["Pressure tested","20%",q.Q[2]],["Insulated","10%",q.Q[3]],["Flushed / commissioned","10%",q.Q[4]]])}
    ${Q("Q1. Earned physical progress, % (1 decimal)",inp("tot"))}${Q("Q2. The contractor's claim on installed ÷ BOQ, %",inp("claim"))}${Q("Q3. Over-claim in points",inp("over"))}`;
  if(q.type==="scurve") return `<p>Planned cumulative progress by month (month 1 = first month):</p>${tbl(["Month",...q.plan.map((_,i)=>i+1)],[["Plan %",...q.plan]])}<p>At the end of <b>month ${q.k}</b>, actual cumulative progress is <b>${q.act}%</b>.</p>
    ${Q("Q1. Variance in % points (actual − planned)",inp("sv"))}${Q("Q2. At which month did the plan reach "+q.act+"%? (1 decimal, interpolate)",inp("when"))}${Q("Q3. So how many months behind are you? (1 decimal)",inp("behind"))}`;
  if(q.type==="cost") return `<p>Control account <b>${esc(q.ca)}</b> (₹ lakh):</p>${tbl(["Budget","Committed","Uncommitted forecast","Likely variations","Certified actual","Accrual (done, not certified)"],[[q.B,q.C,q.U,q.V,q.A,q.R]])}
    ${Q("Q1. EAC",inp("eac"))}${Q("Q2. VAC (negative = overrun)",inp("vac"))}${Q("Q3. Cost incurred to date",inp("inc"))}${Q("Q4. ETC",inp("etc"))}`;
  if(q.type==="evm") return `<p>Hospital project (₹ lakh): BAC <b>${q.BAC}</b>. At the data date the plan was <b>${q.p}%</b>, physical progress is <b>${q.e}%</b>, actual cost is <b>${q.AC}</b>.</p>
    <div class="md"><div class="tw"><table><tbody>${[["pv","PV"],["ev","EV"],["sv","SV"],["cv","CV"],["spi","SPI (2 dp)"],["cpi","CPI (2 dp)"],["eac","EAC = BAC ÷ CPI"],["etc","ETC"],["vac","VAC"],["tcpi","TCPI (2 dp)"]].map(([k,l])=>`<tr><td>${l}</td><td>${inp(k,"number","6em")}</td></tr>`).join("")}</tbody></table></div></div>`;
  if(q.type==="cash") return `<p>Running bill certified on <b>${fmtD(new Date(q.cert))}</b>: gross <b>₹${q.G} L</b>. Retention <b>${q.r}%</b>, mobilisation advance recovery <b>${q.a}%</b> of gross, payment terms <b>${q.terms} days</b> from certification. Retention held before this bill: <b>₹${q.prevRet} L</b>.</p>
    ${Q("Q1. Retention on this bill, ₹ L",inp("ret"))}${Q("Q2. Advance recovered, ₹ L",inp("adv"))}${Q("Q3. Net receivable, ₹ L",inp("net"))}${Q("Q4. Date the cash should arrive",inp("pay","date"))}${Q("Q5. Cumulative retention held after this bill, ₹ L",inp("cum"))}`;
  if(q.type==="risk") return `<p>Draft risk register (impact ₹ lakh):</p>${tbl(["#","Item","P","Impact"],q.ch.map((x,i)=>[i+1,esc(x.n),x.p+"%",x.imp]))}
    ${Q("Q1. Which item doesn't belong in the risk register?",choice("issue",q.ch.map((x,i)=>[String(i),"#"+(i+1)])))}${Q("Q2. Which genuine risk has the highest EMV?",choice("top",q.ch.map((x,i)=>[String(i),"#"+(i+1)])))}${Q("Q3. Its EMV, ₹ L",inp("topemv"))}${Q("Q4. Total EMV of the genuine risks, ₹ L",inp("total"))}`;
  if(q.type==="tia") return `<p>Accepted schedule update (working days, day numbers from 0):</p>${tbl(["ID","Activity","Dur","Pred"],q.acts.map(a=>[a.id,esc(a.name),a.dur,a.pred.length?a.pred.map(relTxt).join(", "):"—"]))}
    <p><b>Delay event:</b> the client issues revised drawings. Fragnet <b>Z, "Client-revised drawings", ${q.k} days</b>, starting at day 0, must finish before <b>${q.X}</b> can start (Z FS ${q.X}).</p>
    ${Q("Q1. TF of "+q.X+" before the event",inp("tf"))}${Q("Q2. New project finish (day number)",inp("nf"))}${Q("Q3. Delay to completion = EOT entitlement, days",inp("delay"))}`;
  if(q.type==="ld") return `<p>Contract value <b>₹${q.CV} Cr</b>. LD clause: <b>${q.rate}% of contract value per week or part thereof</b>, capped at <b>${q.cap}%</b>. Actual delay to completion <b>${q.D} days</b>; EOT granted <b>${q.E} days</b>.</p>
    ${Q("Q1. Culpable delay, days",inp("cul"))}${Q("Q2. Weeks counted",inp("wk"))}${Q("Q3. LD as % of contract value (after the cap)",inp("pct"))}${Q("Q4. LD amount, ₹ lakh",inp("amt","number","6em"))}${Q("Q5. Is the cap reached?",choice("capped",[["yes","Yes"],["no","No"]]))}`;
  return _drillBody(q);
};
const _grade=grade;
grade=function(q,vals){
  const out=[]; const num=(k,exp,tol=0)=>{ const v=parseFloat(vals[k]); out.push({k,ok:!isNaN(v)&&Math.abs(v-exp)<=tol+1e-9,exp,got:vals[k]??""}); };
  const str=(k,exp)=>out.push({k,ok:String(vals[k]||"")===String(exp),exp,got:vals[k]??""});
  const a=q.ans;
  if(q.type==="credit"){ num("tot",a.tot,.15); num("claim",a.claim,.15); num("over",a.over,.25); return out; }
  if(q.type==="scurve"){ num("sv",a.sv,.15); num("when",a.when,.15); num("behind",a.behind,.15); return out; }
  if(q.type==="cost"){ num("eac",a.eac); num("vac",a.vac); num("inc",a.inc); num("etc",a.etc); return out; }
  if(q.type==="evm"){ ["pv","ev","sv","cv"].forEach(k=>num(k,a[k],.6)); ["spi","cpi","tcpi"].forEach(k=>num(k,a[k],.011)); ["eac","etc","vac"].forEach(k=>num(k,a[k],Math.max(2,Math.abs(a.eac)*.006))); return out; }
  if(q.type==="cash"){ num("ret",a.ret,.15); num("adv",a.adv,.15); num("net",a.net,.15); str("pay",a.pay); num("cum",a.cum,.15); return out; }
  if(q.type==="risk"){ str("issue",a.issue); str("top",a.top); num("topemv",a.topemv,.15); num("total",a.total,.25); return out; }
  if(q.type==="tia"){ num("tf",a.tf); num("nf",a.nf); num("delay",a.delay); return out; }
  if(q.type==="ld"){ num("cul",a.cul); num("wk",a.wk); num("pct",a.pct,.01); num("amt",a.amt,.6); str("capped",a.capped); return out; }
  return _grade(q,vals);
};
const _solution=solution;
solution=function(q){
  const a=q.ans;
  if(q.type==="credit"){ const n=["Supports","Installed","Tested","Insulated","Commissioned"];
    return q.W.map((w,i)=>`- ${n[i]}: ${w}% × ${q.Q[i]} ÷ ${q.boq} = ${q.parts[i].toFixed(1)}`).join("\n")+`\n- **Earned = ${a.tot}%**\n\nThe contractor's claim: ${q.Q[1]} ÷ ${q.boq} = **${a.claim}%**, giving full credit for untested pipe. Over-claim **${a.over} points**.`; }
  if(q.type==="scurve") return `- Planned at month ${q.k} = ${q.plan[q.k-1]}%. SV = ${q.act} − ${q.plan[q.k-1]} = **${a.sv} points**\n- Find where the plan reached ${q.act}%: between the months whose plan values bracket it, interpolate → **month ${a.when}**\n- Behind = ${q.k} − ${a.when} = **${a.behind} months**\n\nSay it: "Physical progress ${q.act}% vs ${q.plan[q.k-1]}% planned: ${Math.abs(a.sv)} points, about ${a.behind} months behind."`;
  if(q.type==="cost") return `- EAC = committed ${q.C} + uncommitted ${q.U} + likely variations ${q.V} = **${a.eac}**\n- VAC = ${q.B} − ${a.eac} = **${a.vac}**${a.vac<0?" (overrun)":""}\n- Incurred = certified ${q.A} + accrual ${q.R} = **${a.inc}**\n- ETC = ${a.eac} − ${a.inc} = **${a.etc}**\n\nNote that invoices or certified amounts alone (${q.A}) understate cost: the accrual is real cost already incurred.`;
  if(q.type==="evm") return `- PV = ${q.BAC} × ${q.p}% = **${a.pv}**; EV = ${q.BAC} × ${q.e}% = **${a.ev}**; AC = ${q.AC}\n- SV = EV − PV = **${a.sv}**; CV = EV − AC = **${a.cv}**\n- SPI = ${a.ev} ÷ ${a.pv} = **${a.spi}**; CPI = ${a.ev} ÷ ${q.AC} = **${a.cpi}**\n- EAC = ${q.BAC} ÷ ${(a.ev/q.AC).toFixed(4)} = **${a.eac}**; ETC = EAC − AC = **${a.etc}**; VAC = BAC − EAC = **${a.vac}**\n- TCPI = (${q.BAC} − ${a.ev}) ÷ (${q.BAC} − ${q.AC}) = **${a.tcpi}**${a.tcpi>1.1?". Above 1.10: recovery to budget is unrealistic without a change of scope or method.":""}`;
  if(q.type==="cash") return `- Retention = ${q.r}% × ${q.G} = **${a.ret}**\n- Advance recovery = ${q.a}% × ${q.G} = **${a.adv}**\n- Net = ${q.G} − ${a.ret} − ${a.adv} = **₹${a.net} L**\n- Cash arrives ${fmtD(new Date(q.cert))} + ${q.terms} days = **${fmtD(new Date(a.pay))}**\n- Cumulative retention = ${q.prevRet} + ${a.ret} = **₹${a.cum} L**, released at handover or end of defects liability`;
  if(q.type==="risk"){ return q.ch.map((x,i)=>`- #${i+1}: ${x.p===100?"**ISSUE**, it has already happened → issue log and action tracker":`${x.p}% × ${x.imp} = EMV ${x.emv}`}`).join("\n")+`\n- Highest-EMV risk: **#${+a.top+1}** (${a.topemv})\n- Total EMV of genuine risks = **${a.total}**: a sanity check on the size of the contingency`; }
  if(q.type==="tia") return `- Before the event: ${q.X} has ES ${a.es}, TF **${a.tf}**; project finish ${a.of}\n- Z runs 0 → ${q.k}, so ${q.X} can't start before day ${q.k}: a push of ${Math.max(0,q.k-a.es)} days against its ES\n- Float absorbs up to ${a.tf} of that → reschedule gives new finish **${a.nf}**\n- Delay to completion = ${a.nf} − ${a.of} = **${a.delay} days**${a.delay===0?" (fully absorbed by float: no EOT, but the float is gone)":""}\n\nClaim ${a.delay} days of EOT, not ${q.k}.`;
  if(q.type==="ld") return `- Culpable = ${q.D} − ${q.E} = **${a.cul} days**\n- Weeks or part = ⌈${a.cul} ÷ 7⌉ = **${a.wk}**\n- ${q.rate}% × ${a.wk} = ${r2(q.rate*a.wk)}% → after the ${q.cap}% cap = **${a.pct}%**${a.capped==="yes"?" (cap reached)":""}\n- LD = ${a.pct}% × ₹${q.CV} Cr = **₹${a.amt} L**\n\nUnder s.74 of the Indian Contract Act this is a ceiling of reasonable compensation; delay records decide recovery.`;
  return _solution(q);
};

const LESSONS_P = [
 {id:"P1", week:2, drill:null, title:"Planning before scheduling: basis, method, assumptions",
  card:{rule:"Plan first, schedule second. Planning basis = scope, phasing and zoning, construction method, key constraints, assumptions, durations basis, approvals path, procurement strategy.", example:"300-bed hospital: phase 1 tower and OT block; post-tensioned slabs at a 10-day floor cycle; MEP prefabricated risers; fire NOC before OC; assumption: client-procured medical equipment delivered 8 weeks before opening.", trap:"Opening P6 and typing activities before deciding the method and sequence."},
  body:`A schedule is the **output** of planning. The planning basis is the document you build it from, and the one you defend in a review.

**Planning basis, one page per project:**
1. **Scope and phasing**: blocks, floors, zones; what opens first (e.g. OPD and diagnostics before IPD).
2. **Construction method**: structure system and floor cycle, MEP approach (prefab risers, modular OT), façade method.
3. **Key constraints**: access, crane positions, live-hospital interfaces, monsoon window, authority approvals.
4. **Durations basis**: quantities × productivity norms, not guesses. State the source.
5. **Procurement strategy**: long-lead list, client-procured vs contractor-procured.
6. **Approvals path**: authority sign-offs that gate occupation and opening.
7. **Assumptions register**: each with an owner and a date to confirm it.

**Why it matters:** when the schedule slips, the first question is "which assumption broke?" Without a planning basis, nobody can answer that, and the schedule becomes negotiable.

**Hospital example:** "Floor cycle 10 working days assumes the PT slab with 2 sets of shuttering and a tower crane at grid C-4. If the crane is delayed, the cycle becomes 14 days and the structure finishes 6 weeks later." That is a plan. A bar chart on its own isn't.`},
 {id:"P2", week:2, drill:"duration", title:"Duration estimation from quantities and productivity",
  card:{rule:"Duration = quantity ÷ (productivity per crew-day × crews), rounded up to whole working days, then converted on the activity's calendar.", example:"Blockwork 1,800 m², 10 m²/crew-day → 180 crew-days; 3 crews → 60 working days; Mon–Sat from Mon 2 Nov 2026 → finishes Sat 9 Jan 2027 (before holidays).", trap:"Taking the contractor's duration without the quantity × norm check. Forgetting the calendar conversion."},
  body:`**Formula:** duration (working days) = quantity ÷ (output per crew per day × number of crews). Round **up**.

**Worked example:** blockwork 1,800 m² on one floor. Norm 10 m² per crew-day (one mason and two helpers). 3 crews.
- Effort = 1,800 ÷ 10 = **180 crew-days**
- Output of 3 crews = 10 × 3 = 30 m² per day → 1,800 ÷ 30 = **60 working days**
- To finish in 40 working days instead: 1,800 ÷ (10 × 40) = 4.5 → **5 crews** (round up)

**Then convert to dates** on the calendar: 60 working days on a Mon–Sat week is 10 weeks, so about 70 calendar days. Starting Mon 2 Nov 2026, the last working day is Sat 9 Jan 2027, before any holidays.

**Check it from both sides:** is there **workface** for 5 crews at once? Crowding drops productivity (Day 3: acceleration cost). Are materials and supervision there for 5 crews?

**Where the norms come from:** your own past projects' actuals (best), the contractor's method statement, then published norms. Record the source in the planning basis.`},
 {id:"P3", week:2, drill:"flowline", title:"Hospital sequencing, zoning and flow-line planning",
  card:{rule:"Repetitive floors run as a flow line: each trade moves floor by floor; the slowest trade sets the pace; buffers stop trades colliding.", example:"5 floors: blockwork 6 d/floor, MEP first fix 8, ceiling 5, buffer 1. MEP is the bottleneck. Ceiling can't run at its own 5-day pace; it waits on MEP floor by floor.", trap:"Planning floors as independent lumps, so three trades crowd the same floor at the same time."},
  body:`**A typical hospital floor sequence:** structure → blockwork → MEP first fix (ducts, sprinklers, medical gas, cable trays, plumbing) → **above-ceiling testing** (duct leakage, pressure tests) → ceiling closure inspection → ceiling and partitions → finishes → MEP second fix (diffusers, lights, outlets, bed-head units) → T&C → validation (OT and ICU) → handover.

**Zoning:** split large floors into zones so trades can follow each other within a floor, not just floor by floor. Critical areas (OT, ICU, CSSD, imaging) are their own zones with their own sequence; they're MEP-dense and gate the opening.

**Flow-line (line of balance):** each trade is a line climbing the building. Rule for trade *j* on floor *f*:
- start = max(the same trade finishing the floor below, the previous trade finishing this floor + buffer)

The **slowest trade** controls the pace. Faster trades behind it end up waiting. Either slow them down (smaller crews, so less idle time) or add crews to the bottleneck.

**Live hospital interface** (extensions, refurbishment): plan infection-control barriers, shutdowns of medical gas and power with the client's clinical team, and night or weekend windows. These are planning constraints, not site details.`},
 {id:"P4", week:3, drill:null, title:"Approvals and statutory planning (India, hospitals)",
  card:{rule:"Approvals are long-lead activities with an authority as the vendor: plan them backward from the occupancy / opening date, each with an owner and the documents it needs.", example:"Opening needs the OC; OC needs final fire NOC; fire NOC needs fire systems tested and witnessed; the AERB licence is needed before the CT/X-ray goes live; PESO approval before the liquid oxygen tank is commissioned.", trap:"Leaving approvals to the end because they aren't 'construction'."},
  body:`A hospital can be physically complete and still unable to open. Approvals usually sit on the **critical path to opening**.

**Typical chain to check for each project** (the exact list and sequence vary by state and city; confirm locally):
- **Building plan sanction** (before construction), and the **occupancy / completion certificate** (before use)
- **Fire NOC**: provisional at design stage, final after fire systems are installed, tested and witnessed
- **Pollution control board**: consent to establish / consent to operate; **biomedical waste authorisation**
- **Electrical inspectorate** approval for HT installations, DG sets and substations
- **Lift licences** from the state lift inspector
- **AERB** (Atomic Energy Regulatory Board) licences for X-ray, CT and cath lab equipment, with room shielding verified
- **PESO** approval for liquid oxygen and other pressure vessel storage
- **NABH**: accreditation readiness (not a legal precondition for opening, but usually a client target)

**How to plan them:** each approval is an activity chain: prepare documents → submit → authority review → inspection → approval. Give each a named owner and link it to the physical work it depends on (e.g. fire NOC after the fire pump test). Track it like a long-lead item, with a required-by date from the opening milestone.`},
 {id:"P5", week:4, drill:"ppc", title:"Look-ahead, constraint log and Last Planner (PPC)",
  card:{rule:"Weekly plan = only constraint-free tasks; PPC = commitments completed ÷ commitments made. Track the reasons for misses and fix the top one.", example:"24 commitments, 15 done → PPC 62.5%. Top reason: drawings not approved (5) → a design constraint, so the look-ahead should have caught it two weeks earlier.", trap:"Putting tasks into the weekly plan without checking drawings, material, manpower, access and permits first."},
  body:`**Last Planner System** (Lean Construction Institute) closes the gap between the master schedule and what actually happens each week.
1. **Master / phase plan**: the milestones (L2–L3).
2. **Look-ahead (3–6 weeks)**: break the work down and **screen for constraints**: drawings, material, manpower, equipment, access, permits, predecessor work.
3. **Constraint log**: each constraint has an owner and a removal date. Work enters the weekly plan only when its constraints are removed.
4. **Weekly work plan**: the trade foremen commit to what **will** be done.
5. **PPC (percent plan complete)** = completed commitments ÷ commitments made × 100.
6. **Reasons for non-completion**: count them and fix the top one at its source.

**Worked example:** 24 commitments, 15 completed → PPC = 15 ÷ 24 = **62.5%**. Reasons: drawings not approved 5, material not on site 2, manpower short 1, rework 1. The top reason is drawings: that's a design-coordination problem upstream, not a site problem.

**Why a Planning Manager cares:** PPC above about 80% makes the master schedule believable. A PPC of 50–60% means the master schedule's dates are hope.`},
 {id:"P6", week:7, drill:"manpower", title:"Resource planning: manpower histograms and peaks",
  card:{rule:"Daily crew = man-days ÷ duration; add the crews of all overlapping activities day by day; the peak sets accommodation, supervision and safety load.", example:"Ducting 4/day on days 0–9, sprinklers 3/day on days 5–14, electrical 5/day on days 8–17 → peak 12 on days 8–9.", trap:"Planning each trade's manpower alone, without adding the overlaps."},
  body:`**Resource loading:** each activity has a quantity of effort (man-days). Spread over its duration, that gives a crew size per day.
- Daily crew = man-days ÷ duration
- **Histogram** = the sum of all crews working on each day
- **Peak** = the highest daily total, and the days it occurs

**Why the peak matters:** it drives labour camp size, supervisors (often 1 per 15–20 workers), safety staff, lifts and hoists, toilets, and the workface needed. A peak your site can't physically hold means the schedule's durations are fiction.

**Smoothing (levelling):** move non-critical activities within their **float** to flatten the peak. This is the legitimate use of float from Day 2: you shift *when* work happens, not how much time exists.

**Hospital example:** MEP first fix on the OT floor. Ducting (40 man-days over 10 days = 4/day), sprinklers (30 over 10 = 3/day, starting day 5), electrical (50 over 10 = 5/day, starting day 8). Days 8–9 carry all three: **12 workers** in one MEP-dense zone. Either split the zone or move sprinklers, which have float, to start after ducting.`},
 {id:"P7", week:11, drill:null, title:"Testing, commissioning and handover planning",
  card:{rule:"Plan T&C by system, backward from opening: pre-commissioning → commissioning → integrated systems test → validation → documents and training → handover.", example:"OT block opening 1 Apr: validation (particle counts, pressure cascade) needs the AHUs balanced; IST of fire/BMS/power needs every system commissioned; O&M manuals and training happen in parallel.", trap:"Treating T&C as one bar at the end of the schedule."},
  body:`**Commissioning is planned by system, not by floor:** HVAC, electrical (HT/LT, DG, UPS), fire, medical gas, plumbing, BMS, lifts, nurse call, IT and low-current.

**Stages per system:**
1. **Pre-commissioning**: installation checks, flushing, pressure tests
2. **Commissioning**: run, set up, balance (e.g. air and water balancing)
3. **Integrated systems test (IST)**: systems working together (fire alarm → AHU shutdown → smoke dampers → lift homing; power failure → DG → UPS)
4. **Validation** for critical areas: OT and ICU air quality, pressure cascades, medical gas purity
5. **Documentation and training**: O&M manuals, as-built drawings, warranties, client staff training
6. **Snagging and handover**: snag lists closed, area-by-area handover, then the approvals in P4

**Plan backward from the opening date**, and confirm the durations with the commissioning agent and the equipment vendors. Client-procured medical equipment needs the rooms ready (power, gases, shielding) before it can be installed and tested, so its installation is a planning interface you own.

**Progress:** each stage is a measurable milestone per system, which gives a weighted T&C progress you can actually verify (Week 4 lessons).`},
 {id:"P8", week:12, drill:null, title:"Portfolio planning across multiple hospitals",

  body:`You run planning across several hospital projects at once, so the job is also a **system**, not just individual schedules.

**Standards to set:**
- **WBS template** and **activity library** for hospitals (structure, MEP by system, critical zones, T&C by system, approvals)
- **Calendars**: a 6-day site week, holidays by state, monsoon assumptions
- **Coding**: project, phase, zone, trade, responsible party, so filters and rollups work across sites
- **Update cycle**: the same cut-off date for every project, the same report format

**Portfolio view:**
- Key milestones per site on one page (structure top-out, MEP first-fix complete, approvals, T&C, opening)
- **Shared resources**: specialist vendors (OT panels, medical gas, modular cleanrooms) and your own planners. A vendor committed to three sites in the same month is a portfolio risk.
- **Planning team capacity**: how many schedules each planner can maintain at the update quality you need

**What it gives management:** a comparable view of every site, and early sight of clashes across projects. This is also where your digital tools (Apps Script, dashboards) earn their place, as Week 12's digital concept.`},

function addWorking(d,n){ let x=d, c=1; while(c<n){ x=addC(x,1); if(x.getUTCDay()!==0) c++; } return x; } // finish date of n working days starting on d (a working day)
function genDuration(){
  const items=[["Blockwork","m²",[8,12]],["Gypsum ceiling","m²",[25,40]],["Floor tiling","m²",[12,20]],["GI ducting","kg",[150,250]],["Medical gas copper pipe","rm",[18,30]],["Cable tray","rm",[25,45]]];
  const [name,u,[lo,hi]]=pick(items), p=rnd(lo,hi), c=rnd(2,5), Q=Math.round(p*c*rnd(10,30)*rnd(9,11)/10/10)*10;
  const T=rnd(10,25); let st=addC(D0(new Date()),rnd(7,30)); while(st.getUTCDay()!==1) st=addC(st,1);
  const dur=Math.ceil(Q/(p*c));
  return {type:"duration", name,u,p,c,Q,T, start:iso(st), ans:{cd:r1(Q/p), dur, crews:Math.ceil(Q/(p*T)), fin:iso(addWorking(st,dur))}};
}
function genFlow(){
  const n=rnd(4,7), trades=[["Blockwork",rnd(4,8)],["MEP first fix",rnd(5,10)],["Ceiling & partitions",rnd(3,7)]], b=rnd(0,2);
  const F=trades.map(()=>Array(n).fill(0)), S=trades.map(()=>Array(n).fill(0));
  trades.forEach(([,d],j)=>{ for(let f=0;f<n;f++){ const s=Math.max(f?F[j][f-1]:0, j?F[j-1][f]+b:0); S[j][f]=s; F[j][f]=s+d; } });
  const bott=trades.reduce((a,t)=>t[1]>a[1]?t:a)[0];
  return {type:"flowline", n, trades, b, S, F, ans:{s2:S[1][0], end:F[2][n-1], bott}};
}
function genPPC(){
  const N=rnd(16,32), C=rnd(Math.floor(N*.45),Math.floor(N*.9)), miss=N-C;
  const reasons=["Drawings not approved","Material not on site","Manpower short","Previous trade not finished","Access / permit not available","Rework"];
  const cnt={}; let left=miss; const order=[...reasons].sort(()=>Math.random()-.5);
  order.forEach((r,i)=>{ const v=i===order.length-1?left:Math.min(left,rnd(0,Math.ceil(left*.7))); cnt[r]=v; left-=v; });
  const max=Math.max(...Object.values(cnt)); const tops=Object.keys(cnt).filter(k=>cnt[k]===max);
  if(tops.length>1||miss===0) return genPPC();
  return {type:"ppc", N, C, cnt, ans:{ppc:r1(C/N*100), top:tops[0]}};
}
function genManpower(){
  const names=["GI ducting","Sprinkler piping","Cable tray & wiring","Medical gas piping","Plumbing rough-in"], acts=[];
  [...names].sort(()=>Math.random()-.5).slice(0,4).forEach((nm,i)=>{ const dur=rnd(6,14), crew=rnd(2,7), st=i===0?0:rnd(0,12); acts.push({nm,st,dur,crew,md:crew*dur}); });
  const end=Math.max(...acts.map(a=>a.st+a.dur)), daily=[]; for(let d=0;d<end;d++) daily.push(acts.reduce((s,a)=>s+(d>=a.st&&d<a.st+a.dur?a.crew:0),0));
  const peak=Math.max(...daily);
  return {type:"manpower", acts, daily, ans:{peak, first:daily.indexOf(peak), total:acts.reduce((s,a)=>s+a.md,0)}};
}

Object.assign(LABELS,{cd:"Crew-days",dur:"Duration",crews:"Crews for target",fin:"Finish date",s2:"Trade 2 start",end:"Overall finish",bott:"Bottleneck trade",ppc:"PPC",top:"Top reason",peak:"Peak headcount",first:"First peak day",total:"Total man-days"});
const _db2=drillBody;
drillBody=function(q){
  if(q.type==="duration") return `<p><b>${esc(q.name)}</b>: quantity <b>${q.Q} ${q.u}</b>. Productivity <b>${q.p} ${q.u} per crew per working day</b>. <b>${q.c} crews</b> available. Site calendar Mon–Sat (Sundays off). Work starts <b>${fmtD(new Date(q.start))}</b>.</p>
    ${Q("Q1. Effort in crew-days (1 decimal)",inp("cd"))}${Q("Q2. Duration with "+q.c+" crews, working days (round up)",inp("dur"))}${Q("Q3. Finish date (the last working day)",inp("fin","date"))}${Q("Q4. Crews needed to finish in "+q.T+" working days (round up)",inp("crews"))}`;
  if(q.type==="flowline") return `<p>Hospital tower, <b>${q.n} floors</b>, trades in sequence. Each trade does one floor at a time, moving up. Buffer between trades on the same floor: <b>${q.b} day${q.b===1?"":"s"}</b>. Start = day 0.</p>${tbl(["Trade","Days per floor"],q.trades.map(t=>[t[0],t[1]]))}
    <p style="color:var(--muted);font-size:.84rem">Rule: trade j on floor f starts at max(trade j finishing floor f−1, trade j−1 finishing floor f + buffer).</p>
    ${Q("Q1. Day MEP first fix starts floor 1",inp("s2"))}${Q("Q2. Day the ceiling trade finishes the top floor (overall finish)",inp("end"))}${Q("Q3. Which trade is the bottleneck?",choice("bott",q.trades.map(t=>[t[0],t[0]])))}`;
  if(q.type==="ppc") return `<p>Last week's work plan: <b>${q.N} commitments</b>, <b>${q.C} completed</b>. Reasons for the misses:</p>${tbl(["Reason","Count"],Object.entries(q.cnt).filter(([,v])=>v>0).map(([k,v])=>[k,v]))}
    ${Q("Q1. PPC, % (1 decimal)",inp("ppc"))}${Q("Q2. Which reason do you attack first?",choice("top",Object.keys(q.cnt).filter(k=>q.cnt[k]>0).map(k=>[k,k])))}`;
  if(q.type==="manpower") return `<p>MEP first fix on the OT floor (working days from day 0):</p>${tbl(["Activity","Start day","Duration","Man-days"],q.acts.map(a=>[a.nm,a.st,a.dur,a.md]))}
    ${Q("Q1. Peak daily headcount",inp("peak"))}${Q("Q2. First day the peak occurs",inp("first"))}${Q("Q3. Total man-days",inp("total"))}`;
  return _db2(q);
};
const _gr2=grade;
grade=function(q,vals){
  const out=[]; const num=(k,exp,tol=0)=>{ const v=parseFloat(vals[k]); out.push({k,ok:!isNaN(v)&&Math.abs(v-exp)<=tol+1e-9,exp,got:vals[k]??""}); };
  const str=(k,exp)=>out.push({k,ok:String(vals[k]||"")===String(exp),exp,got:vals[k]??""}); const a=q.ans;
  if(q.type==="duration"){ num("cd",a.cd,.06); num("dur",a.dur); str("fin",a.fin); num("crews",a.crews); return out; }
  if(q.type==="flowline"){ num("s2",a.s2); num("end",a.end); str("bott",a.bott); return out; }
  if(q.type==="ppc"){ num("ppc",a.ppc,.06); str("top",a.top); return out; }
  if(q.type==="manpower"){ num("peak",a.peak); num("first",a.first); num("total",a.total); return out; }
  return _gr2(q,vals);
};
const _so2=solution;
solution=function(q){
  const a=q.ans;
  if(q.type==="duration") return `- Effort = ${q.Q} ÷ ${q.p} = **${a.cd} crew-days**\n- Output per day = ${q.p} × ${q.c} = ${q.p*q.c} ${q.u} → ${q.Q} ÷ ${q.p*q.c} = ${(q.Q/(q.p*q.c)).toFixed(2)} → round up = **${a.dur} working days**\n- Day 1 is ${fmtD(new Date(q.start))}; count ${a.dur} working days, skipping Sundays → finishes **${fmtD(new Date(a.fin))}**\n- For ${q.T} days: ${q.Q} ÷ (${q.p} × ${q.T}) = ${(q.Q/(q.p*q.T)).toFixed(2)} → **${a.crews} crews**\n\nBefore committing ${a.crews} crews, check the workface: do they fit without crowding?`;
  if(q.type==="flowline"){ const rows=q.trades.map((t,j)=>`- ${t[0]}: `+Array.from({length:q.n},(_,f)=>`F${f+1} ${q.S[j][f]}→${q.F[j][f]}`).join(", ")).join("\n");
    return `${rows}\n\n- MEP first fix starts floor 1 when blockwork finishes it (${q.F[0][0]}) + buffer ${q.b} = **${a.s2}**\n- Overall finish = ceiling trade's top floor = **day ${a.end}**\n- Bottleneck = the slowest trade: **${a.bott}**. The trades behind it wait floor by floor, so cut their crews (less idle time) or add a crew to ${a.bott}.`; }
  if(q.type==="ppc") return `- PPC = ${q.C} ÷ ${q.N} = **${a.ppc}%**${a.ppc<80?". Below about 80%, the master schedule's near-term dates aren't believable.":""}\n- Attack the most frequent reason: **${a.top}** (${q.cnt[a.top]} of ${q.N-q.C} misses)${/Drawings|Material|Access/.test(a.top)?". This is a constraint the look-ahead should have removed 2–3 weeks earlier: fix the screening, not the site.":"."}`;
  if(q.type==="manpower"){ const crews=q.acts.map(a=>`${a.nm}: ${a.md} ÷ ${a.dur} = ${a.crew}/day on days ${a.st}–${a.st+a.dur-1}`).join("\n- ");
    return `- ${crews}\n- Add the crews day by day: ${q.daily.map((v,i)=>`d${i} ${v}`).join(", ")}\n- Peak = **${a.peak}**, first on **day ${a.first}**\n- Total = **${a.total} man-days**\n\nTo lower the peak, move an activity with float to start later: same man-days, flatter histogram.`; }
  return _so2(q);
};

function genGuided(level){
  for(let t=0;t<200;t++){
    const n=level===1?4:5, names=["Core drilling & sleeves","Pipe install","Insulation","Pressure test","Cable tray","Panel energisation","Ducting","Ceiling grid"];
    const nm=[...names].sort(()=>Math.random()-.5);
    const acts=Array.from({length:n},(_,i)=>({id:String.fromCharCode(65+i),name:nm[i],dur:rnd(2,7),pred:[]}));
    for(let j=1;j<n;j++){ const k=j>=2&&Math.random()<.55?2:1; const c=[...Array(j).keys()].sort(()=>Math.random()-.5).slice(0,k);
      c.forEach(i=>acts[j].pred.push({id:acts[i].id,type:level===3&&Math.random()<.35?"SS":"FS",lag:level>=2&&Math.random()<.4?rnd(1,3):0})); }
    const has=new Set(); acts.forEach(a=>a.pred.forEach(p=>has.add(p.id)));
    acts.slice(0,n-1).forEach(a=>{ if(!has.has(a.id)) acts[n-1].pred.push({id:a.id,type:"FS",lag:0}); });
    acts.forEach(a=>a.pred.forEach(p=>{ if(p.type==="SS"&&!p.lag) p.lag=rnd(1,3); }));
    const sol=cpm(acts);
    if(acts.some(a=>a.pred.length>1) && acts.some(a=>a.tf>0)) return {acts,sol};
  }
  return genGuided(level);
}

function guidedPrompt(s){

    return {q:`<b>${a.id}</b> (${a.dur}d) comes after ${a.pred.map(rel).join(" and ")}. What is its <b>ES</b>?`, help: gp.level===1||gp.tries>0 ? `Candidates: ${cands.join(" · ")}${cands.length>1?" → take the LARGEST":""}` : ""}; }

function classify(s,v){

    if(v===Math.min(...c)&&c.length>1) return ["took-smallest-forward","At a merge going FORWARD, take the LARGEST. The activity waits for the last one to finish."];
    if(v===a.es+a.dur) return ["double-add","You added the duration on the ES line. ES is READ from the predecessor; the duration gets added on the EF line."];
    if(a.pred.some(p=>p.type==="SS"&&v===by[p.id].ef+p.lag)) return ["ss-from-finish","SS counts from the predecessor's START, not its finish."];
    if(a.pred.some(p=>p.lag)&&a.pred.some(p=>v===by[p.id].ef)) return ["forgot-lag","There's a lag on that link: add it to the candidate."]; }
