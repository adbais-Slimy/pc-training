1. **Activities**: pieces of work with a clear finish you can check on site.
   *"Install chilled-water pipes, Zone 2 riser"* ✓ (you can walk up and see whether it's done)
   *"MEP work"* ✗ (when is it ever "done"?)

2. **Duration**: how many **working days** an activity takes. Not dates, just a count.

3. **Dependencies**: what must happen first. The pressure test can't start until the pipes are installed.
   - The activity that comes first is the **predecessor**.
   - The one that waits is the **successor**.`},
  {k:"ruler",acts:RISER,t:`**See it.** Three activities on a ruler (the numbers along the top are working days):

- **A** core drilling, 3 days
- **B** pipe install, 5 days, waits for A
- **D** pressure test, 2 days, waits for B

Each bar starts where the one before it ends. Read it left to right: the riser is done after **10 working days**. You've just read your first schedule.`},
  {k:"quiz",bank:[
   {q:"For an external road stretch, which is a good activity?",o:[["Road works",false,"Too vague to measure."],["Lay 200 mm GSB sub-base, Ch 0+000 to 0+200",true,"Clear scope, location (chainage) and a checkable finish."],["Coordinate with the municipality",false,"Admin, not a physical deliverable."],["Infrastructure",false,"That's a whole category."]]},
   {q:"Which of these is a good activity for a schedule?",o:[["MEP works",false,"Too vague: you can't walk on site and say it's 'done'."],["Install chilled-water pipes, Zone 2 riser",true,"Clear scope, clear location, clear finish you can check."],["Follow up with the HVAC vendor",false,"That's an admin action, not a piece of work with a physical finish."],["Hospital construction",false,"That's the whole project, not an activity."]]},
   {q:"Insulation can't start until the pipes are fixed. The pipe installation is the insulation's…",o:[["Successor",false,"The successor is the one that waits. Insulation waits, so insulation is the successor."],["Predecessor",true,"It comes first, so it's the predecessor."],["Duration",false,"Duration is how long something takes, not its order."],["Milestone",false,"A milestone is a zero-length event, like 'riser handed over'."]]},
   {q:"What unit is a duration counted in?",o:[["Calendar dates",false,"Dates come at the very end. A duration is a count of days."],["Working days",true,"Durations count working days. You convert to dates only at the end, using the calendar."],["Weeks always",false,"You can use weeks, but working days is standard for site work."],["Rupees",false,"That's cost, not time."]]},
   {q:"Why not show the whole MEP package as one bar, 'MEP: 90 days'?",o:[["It's fine for daily control",false,"With one bar you can't see which part is late or why."],["You can't see which part is late, or what each part waits for",true,"Breaking work into activities shows the real dependencies and where a delay sits."],["P6 doesn't allow it",false,"P6 allows it; it just tells you nothing useful."],["Bars can't be longer than 30 days",false,"There's no such rule."]]},
   {q:"A takes 3 days, B takes 5 days after A, D takes 2 days after B. How many working days in total?",o:[["8",false,"That's A + B only. D still has to happen after B."],["10",true,"3 + 5 + 2 = 10 working days, because each waits for the one before."],["5",false,"That's just B, the longest single activity."],["15",false,"Recount: 3 + 5 + 2."]]},
   {q:"In a schedule, a 'dependency' means…",o:[["How long an activity takes",false,"That's duration."],["What must happen before an activity can start or finish",true,"It's the logic linking activities."],["Who pays for the work",false,"That's commercial, not logic."],["The date the client wants",false,"That's a target or constraint, not a dependency."]]}]},
  {k:"explain",p:"In one or two sentences, in your own words: what three things does every schedule need, and why can't 'MEP work' be an activity?"},
  {k:"done"}]},

 {id:"U2",day:2,title:"Days, marks and calendars",mins:25,
  card:{id:"c-marks",title:"Marks on a ruler, then convert once",rule:"Calculate in marks (mark 0 = the start line; mark 3 = the end of day 3). Convert to dates once, at the end, using the working calendar. Always say what a date is the date OF.",example:"An activity ES 3, 5 days long: crews on site on working days 4–8, ending at mark 8. On a Mon–Sat calendar, 12 working days is about 14 calendar days.",trap:"Saying '5th day' when you mean mark 5; calling a delivery date a completion date."},
  screens:[
  {k:"read",t:`**Why it matters.** On Day 4 before, "mark 5" vs "5th day" caused confusion for weeks. It's a small thing that breaks every calculation, so we'll fix it once, properly.

Planners don't calculate with dates. Dates have Sundays, holidays and months of different lengths, and mistakes hide in all of them. We calculate on a **ruler** and convert to dates **once**, at the end.`},
  {k:"read",t:`**The ruler**

\`\`\`
mark: 0   1   2   3   4   5
      |---|---|---|---|---|
       d1  d2  d3  d4  d5
\`\`\`

- **Mark 0** = the start line: Monday morning, before anyone has worked.
- **Day 1** is the gap between mark 0 and mark 1.
- **Mark 3** = the **end** of working day 3.

So a 3-day activity starting at mark 0 **ends at mark 3**. The next activity starts at mark 3, which is physically the **start of day 4**.

Rule: **end mark = start mark + duration.** The crew works on the days *between* the marks.`},
  {k:"ruler",acts:RISER,t:`**See it.** B starts at mark 3 and lasts 5 days, so it ends at mark 8.

The crew is on site on **days 4, 5, 6, 7 and 8**: that's 5 days. ✓

When you say a number, say *"mark 8"* while calculating. Change it into a date only when you report.`},
  {k:"read",t:`**Calendars: working days vs calendar days**

Your sites work a **6-day week** (Mon–Sat). Sundays and holidays aren't working days.

- 6 working days = 1 calendar week
- 12 working days ≈ 2 calendar weeks ≈ **14 calendar days**
- 25 working days ≈ **29 calendar days**

Always say which you mean: *"12 working days"* or *"14 calendar days"*. Vendors usually quote **calendar** days; site durations are **working** days.`},
  {k:"cal"},
  {k:"read",t:`**What is the date OF?** This was your most expensive mistake before.

A date always belongs to an event. Say which one:
- *"AHU **delivered to site**: 5 Feb"*. Delivered, not installed.
- *"AHU **installation starts**: 6 Feb"*
- *"HVAC **commissioning complete**: 20 Mar"*

If you say *"HVAC 5 Feb"*, your COO will hear "HVAC done on 5 Feb". It isn't. Always name the event.`},
  {k:"quiz",bank:[
   {q:"'Mark 3' means…",o:[["The start of day 3",false,"Mark 3 is after day 3 is finished."],["The end of working day 3",true,"Marks are the lines between days. Mark 3 = after 3 full days."],["3 calendar days from today",false,"Marks count working days on the ruler, not calendar days."],["Wednesday",false,"It's a mark on the ruler. A date only comes after converting with the calendar."]]},
   {q:"An activity starts at mark 3 and lasts 5 days. On which working days is the crew physically on site?",o:[["Days 3 to 8",false,"That's 6 days. Mark 3 is the end of day 3, so work begins on day 4."],["Days 4 to 8",true,"Days 4, 5, 6, 7, 8 = 5 days, ending at mark 8."],["Days 3 to 7",false,"Mark 3 is the end of day 3, so the crew starts on day 4."],["Days 5 to 10",false,"Start from mark 3: the work runs between mark 3 and mark 8."]]},
   {q:"An activity starts at mark 6 and lasts 4 days. At which mark does it end?",o:[["9",false,"Don't subtract one. End = start + duration = 6 + 4."],["10",true,"6 + 4 = 10."],["11",false,"You've added one extra. End mark = start mark + duration."],["4",false,"That's the duration, not the end mark."]]},
   {q:"On a Mon–Sat site, roughly how many calendar days is 12 working days?",o:[["12",false,"That ignores the Sundays."],["14",true,"12 working days = 2 six-day weeks = 14 calendar days."],["17",false,"That's about 12 working days on a 5-day week."],["10",false,"Calendar days are never fewer than working days."]]},
   {q:"The vendor says 'AHU on site 5 Feb'. Which report line is correct?",o:[["HVAC complete 5 Feb",false,"That's the date-OF mistake: delivery isn't completion."],["AHU delivered to site 5 Feb; installation starts after that",true,"It names the event: delivery. Installation and commissioning come later."],["AHU installed 5 Feb",false,"Delivery isn't installation."],["HVAC 5 Feb",false,"It doesn't say what event the date belongs to, so the COO will assume 'done'."]]},
   {q:"Why do planners calculate in marks first and convert to dates last?",o:[["P6 can't show dates",false,"It can. Marks are about avoiding errors."],["So Sundays, holidays and month lengths don't cause mistakes mid-calculation",true,"Do the logic on a clean ruler, then convert once with the calendar."],["Because clients prefer marks",false,"Clients get dates. Marks are your working tool."],["Dates are always wrong",false,"Dates are fine. Converting them in the middle of a calculation is where errors creep in."]]}]},
  {k:"explain",p:"Explain in your own words: what is the difference between 'mark 5' and 'the 5th day', and why must a report line say what a date is the date OF?"},
  {k:"done"}]},

 {id:"U3",day:3,title:"How work depends on other work: FS, SS, FF and lags",mins:25,
  card:{id:"c-rel",title:"Four relationship types and lags",rule:"FS: start after the predecessor FINISHES (most logic). SS+n: start n days after the predecessor STARTS (overlap). FF+n: finish n days after the predecessor FINISHES. Lag = forced wait; avoid negative lags (leads).",example:"Pressure test FS after pipe install; insulation SS+2 after pipe install starts; painting FF+3 after ceiling finishes; slab curing FS+7.",trap:"Counting an SS lag from the predecessor's finish instead of its start."},
  screens:[
  {k:"read",t:`**Why it matters.** On site, trades don't always wait for each other to finish. Insulation follows the pipe fitters a couple of days behind, on the same riser. If your schedule says "wait until all the pipes are done", it shows the riser taking days longer than it really does.

The **relationship type** says *how* one activity depends on another.`},
  {k:"read",t:`**FS: Finish-to-Start** (the most common, about 90% of links)
B starts when A **finishes**.
*Pressure test starts after pipe install is finished.*

**SS: Start-to-Start**, usually with a lag
B starts *n* days after A **starts**. They run side by side.
*Insulation starts 2 days after pipe install starts: "SS+2".*

**FF: Finish-to-Finish**
B finishes *n* days after A **finishes**.
*Painting finishes 3 days after ceiling boarding finishes: "FF+3".*

**SF**: rare. You can ignore it for now.`},
  {k:"read",t:`**Lag = a forced wait between linked activities**

- *Slab casting → formwork removal: FS+7* (7 days of curing)
- *Pipe install → insulation: SS+2* (insulation stays 2 days behind)

**Count a lag from the end the type names:**
- FS+7: from the predecessor's **finish**
- SS+2: from the predecessor's **start** ← this is the one people get wrong

A **negative** lag (a "lead") is bad practice. Use SS with a positive lag instead.`},
  {k:"ruler",acts:[R("A","Core drilling & sleeves",3,[]),R("B","Pipe install",5,["A"]),R("C","Insulation (SS+2)",4,["BSS+2"])],t:`**See it.** B (pipe install) starts at mark 3. C (insulation) is **SS+2**, so it starts at 3 + 2 = **mark 5**, while the pipe fitters are still working.

C lasts 4 days → ends at mark 9. The two bars **overlap**: that's what SS looks like.`},
  {k:"quiz",bank:[
   {q:"Kerbs can be laid only after the base course is complete in that section. Which link?",o:[["FS",true,"Start after the predecessor finishes (in that section)."],["SS+2",false,"That would let kerbs start before the base is finished."],["FF",false,"It's about the start of kerbing."],["No link needed",false,"Kerbs need a finished base."]]},
   {q:"'The pressure test can only begin once the pipe installation is complete.' Which relationship?",o:[["FS",true,"Start after the predecessor FINISHES."],["SS",false,"SS would let the test start while the pipes are still being laid."],["FF",false,"FF links two finishes, not a start."],["SF",false,"Rare. This is a plain finish-then-start."]]},
   {q:"'Insulation crews start 2 days after the pipe fitters start, and follow them up the riser.' Which link?",o:[["FS+2",false,"FS+2 would wait for ALL the pipes to finish, then 2 more days."],["SS+2",true,"Start 2 days after the predecessor STARTS. The two run in parallel."],["FF+2",false,"That would tie the two finishes together, not the starts."],["FS-2",false,"That's a lead (negative lag), which is bad practice."]]},
   {q:"Pipe install starts at mark 3 and ends at mark 8. Insulation is SS+2 from it. When does insulation start?",o:[["Mark 10",false,"That's counting from the FINISH (8 + 2). SS counts from the START."],["Mark 5",true,"3 (pipe start) + 2 = 5."],["Mark 2",false,"Add the lag to the predecessor's start: 3 + 2."],["Mark 8",false,"That treats it as FS with no lag."]]},
   {q:"'Painting must finish 3 days after ceiling boarding finishes.' Which link?",o:[["FF+3",true,"It ties the two finishes, with a 3-day lag."],["SS+3",false,"That ties the starts."],["FS+3",false,"That would stop painting starting until boarding is finished, which is stricter than stated."],["SF+3",false,"Rare; doesn't fit."]]},
   {q:"Slab cast; formwork can't be struck for 7 days of curing. How do you model it?",o:[["FS+7",true,"Strike formwork 7 days after casting finishes."],["SS+7",false,"That counts from the casting START."],["A 7-day activity called 'waiting'",false,"Possible, but a lag is the standard way."],["FS-7",false,"A negative lag would let formwork come off before casting finishes."]]},
   {q:"Why is a negative lag (a 'lead') discouraged?",o:[["P6 crashes",false,"It doesn't. It's about clarity and honest logic."],["It hides the real logic; an SS link with a positive lag says the same thing clearly",true,"Schedule health checks expect zero leads."],["It makes the project longer",false,"A lead actually pulls the start earlier."],["Clients forbid it",false,"It's a scheduling best practice, not a client rule."]]}]},
  {k:"explain",p:"In your own words: what is the difference between FS+2 and SS+2? Use pipes and insulation as the example."},
  {k:"done"}]},

 {id:"U4",day:4,title:"Earliest dates: the forward pass",mins:30,
  card:{id:"c-fwd",title:"Forward pass: read, take the largest, add once",rule:"ES = read the predecessor's end (or start + lag for SS); at a merge take the LARGEST; EF = ES + duration, added once. The last EF is the project finish.",example:"D needs B (ends 8) and C (ends 9) → ES 9 → EF 9 + 2 = 11.",trap:"Adding the duration on the ES line as well (double-add); taking the smaller candidate at a merge."},
  screens:[
  {k:"read",t:`**Why it matters.** *"What's the earliest the riser can be finished?"* The **forward pass** answers it. You walk left to right through the activities and work out when each one can start and finish at the earliest.

Two names to learn, both plain:
- **ES (early start)**: the earliest mark an activity can start
- **EF (early finish)**: the earliest mark it can finish

**EF = ES + duration.** That's the only addition you ever do.`},
  {k:"explainer",from:0,to:6},
  {k:"read",t:`**The three moves, every time:**
1. **Read**: look up where each predecessor ends (for SS, its start + lag). Don't add anything yet. These are the *candidates*.
2. **Pick**: if there are several candidates, take the **largest**. The activity waits for the slowest one.
3. **Add once**: EF = ES + duration.

The mistake you made before was adding the duration on step 1 **and** step 3. Read first. Add once.`},
  {k:"guided",level:1,fwd:true,t:"Now you. One number at a time; the ruler fills in as you go. The candidates are shown for you."},
  {k:"guided",level:3,fwd:true,t:"Same moves, now with SS links. Remember: SS counts from the predecessor's START."},
  {k:"quiz",bank:[
   {q:"B comes after A (FS). A ends at mark 6. What is B's ES?",o:[["6",true,"Read A's end: 6. Nothing is added on the ES line."],["7",false,"No +1. Mark 6 is the end of day 6, which is where B begins."],["6 + B's duration",false,"That's the double-add. The duration goes on the EF line."],["0",false,"Only activities with no predecessor start at 0."]]},
   {q:"D needs both B (ends at 8) and C (ends at 9). What is D's ES?",o:[["8",false,"That would start D before C is finished."],["9",true,"Take the LARGEST: D waits for the last predecessor to finish."],["17",false,"Don't add candidates together."],["8.5",false,"No averages. Take the largest."]]},
   {q:"An activity has ES 9 and a duration of 2. What is its EF?",o:[["11",true,"9 + 2 = 11."],["10",false,"Don't subtract one: EF = ES + duration."],["13",false,"That's 9 + 2 + 2, the duration added twice."],["2",false,"That's the duration, not the finish mark."]]},
   {q:"C is SS+2 from B. B has ES 3, EF 8. What is C's ES?",o:[["5",true,"SS counts from B's START: 3 + 2 = 5."],["10",false,"That's counting from B's finish (8 + 2)."],["8",false,"That treats it as FS with no lag."],["2",false,"Add the lag to B's start."]]},
   {q:"In the forward pass, where exactly do you add an activity's own duration?",o:[["On the ES line",false,"ES is read from the predecessors. Adding here is the double-add mistake."],["On the EF line only",true,"EF = ES + duration, once."],["On both lines",false,"That adds it twice and pushes everything late."],["Nowhere",false,"EF needs the duration."]]},
   {q:"How do you get the project's finish from a forward pass?",o:[["Add up all the durations",false,"Parallel activities overlap, so adding all of them overstates the finish."],["It's the largest EF (normally the last activity's EF)",true,"The project ends when the last work ends."],["It's the smallest EF",false,"That's when the first activity ends."],["Count the activities",false,"The count says nothing about time."]]}]},
  {k:"explain",p:"Explain the three moves of the forward pass in your own words, and say where your old 'double-add' mistake happened."},
  {k:"done"}]},

 {id:"U5",day:5,title:"Latest dates: the backward pass",mins:30,
  card:{id:"c-bwd",title:"Backward pass: start at the finish, take the smallest, subtract",rule:"The last activity's LF = project finish; LF = the successor's LS (for SS: successor LS − lag + own duration); at a burst take the SMALLEST; LS = LF − duration.",example:"A must finish before B (LS 3) and E (LS 5) → LF 3 → LS 0.",trap:"Taking the largest at a burst; adding instead of subtracting."},
  screens:[
  {k:"read",t:`**Why it matters.** The forward pass says when work *can* happen. Your COO also needs to know: *"How late can the cable tray start before handover moves?"*

The **backward pass** answers it by walking **right to left** from the finish.
- **LF (late finish)**: the latest an activity can finish without moving the project finish
- **LS (late start)**: the latest it can start; **LS = LF − duration**

Going backward you **subtract**.`},
  {k:"explainer",from:7,to:10},
  {k:"read",t:`**The three backward moves:**
1. **Start at the end**: the last activity's LF = the project finish.
2. **Read**: an activity's LF = the latest start of what comes after it. If several things come after it, take the **smallest**, because it must be ready in time for the earliest of them.
3. **Subtract once**: LS = LF − duration.

Mirror image of the forward pass: forward = **largest** + add; backward = **smallest** + subtract.`},
  {k:"guided",level:1,fwd:false,t:"Full pass now: forward, then backward. One number at a time."},
  {k:"quiz",bank:[
   {q:"F is the last activity. The project finishes at mark 14. F lasts 3 days. What is F's LS?",o:[["11",true,"LF = 14; LS = 14 − 3 = 11."],["17",false,"Going backward you subtract, you don't add."],["14",false,"That's LF. LS = LF − duration."],["3",false,"That's the duration."]]},
   {q:"A must finish before B (LS 3) and before E (LS 5). What is A's LF?",o:[["5",false,"If A finished at 5, B (which must start by 3) would be late."],["3",true,"Take the SMALLEST: A must be ready for the earliest successor."],["8",false,"Don't add the successors' starts."],["4",false,"No averages."]]},
   {q:"Going backward, how do you get LS from LF?",o:[["LS = LF + duration",false,"That moves the wrong way."],["LS = LF − duration",true,"Subtract going backward."],["LS = LF",false,"Only true for a zero-duration milestone."],["LS = ES",false,"Only true on the critical path. It's a result, not the formula."]]},
   {q:"Why do you take the SMALLEST at a burst in the backward pass?",o:[["Smaller numbers are safer",false,"Close, but the real reason is time."],["The activity must be done in time for the earliest of the things that follow it",true,"Each successor needs it by its latest start; the earliest of those wins."],["It's a P6 convention only",false,"It's the logic, not a software quirk."],["To make float bigger",false,"It does the opposite: it gives the true, tighter latest date."]]},
   {q:"The backward pass on a correct schedule ends at the first activity with LS = …",o:[["0, if that first activity is critical",true,"Coming back to 0 confirms your arithmetic for critical paths."],["The project finish",false,"That's where you started."],["Always a negative number",false,"Only if a required finish date is earlier than possible (negative float)."],["Its duration",false,"No."]]},
   {q:"D has LF 11 and a duration of 2. What is its LS?",o:[["9",true,"11 − 2 = 9."],["13",false,"Subtract, don't add."],["11",false,"That's LF."],["10",false,"No −1 adjustments: LS = LF − duration."]]}]},
  {k:"explain",p:"Explain the backward pass in your own words: where do you start, what do you do at a burst, and why?"},
  {k:"done"}]},

 {id:"U6",day:6,title:"Float and the critical path",mins:25,
  card:{id:"c-float",title:"Float = LS − ES; zero float = critical",rule:"Total float = how many days an activity can slip before the project finish moves (LS − ES). The zero-float chain is the critical path. Report the float trend, not just the number.",example:"Cable tray: ES 3, LS 5 → 2 days of float. A 3-day slip moves handover by 1 day.",trap:"Treating float as spare time anyone can spend; ignoring a near-critical path whose float is falling fast."},
  screens:[
  {k:"read",t:`**Why it matters.** Not every delay matters. If the cable tray slips 1 day and handover doesn't move, you don't need to escalate. If the pressure test slips 1 day, handover moves 1 day. The difference is **float**.

**Total float = LS − ES** (or LF − EF): how many days an activity can slip before the project finish moves.

**Critical path** = the chain of activities with **zero float**. Any slip on it moves the finish, day for day.`},
  {k:"explainer",from:11,to:12},
  {k:"read",t:`**Using float like a manager**
- Float **can** be used: you can move a crew off a path with float onto critical work. That's a valid recovery move.
- Float **isn't** banked time. It belongs to the whole chain, and if one activity uses it, the ones after it lose it.
- **Watch the trend:** float 14 → 4 in one month means 10 days lost per update. At that rate it becomes critical next month. Report the rate as well as the level.
- **Near-critical** = a small float, roughly 10 working days or less. Watch these as closely as critical ones.

**Impact of a slip** = slip − float (if positive). Cable tray float 2, slips 3 → handover moves **1 day**.`},
  {k:"guided",level:2,fwd:false,t:"Full pass with lags, then pick the critical path at the end."},
  {k:"quiz",bank:[
   {q:"The cable tray has ES 3 and LS 5. What is its total float?",o:[["2",true,"LS − ES = 5 − 3 = 2."],["8",false,"Subtract, don't add."],["5",false,"That's LS."],["0",false,"0 would mean it's critical."]]},
   {q:"An activity with 2 days of float slips 3 days. How much does the project finish move?",o:[["3 days",false,"The float absorbs the first 2 days."],["1 day",true,"3 − 2 = 1 day beyond the float."],["0 days",false,"The slip is bigger than the float."],["5 days",false,"Subtract the float."]]},
   {q:"What is the critical path?",o:[["The most expensive activities",false,"Critical is about time, not cost."],["The chain of activities with zero float, where any slip moves the finish",true,"It's the longest path through the network."],["The activities the client cares about",false,"Important, but not the definition."],["Every MEP activity",false,"Trade doesn't decide criticality; the logic and durations do."]]},
   {q:"Drainage float went 14 → 4 in one monthly update. What do you report?",o:[["Drainage has 4 days of float. Fine.",false,"That misses the trend: 10 days were lost in a single month."],["Drainage float 4 days, falling about 10 a month: likely critical next month",true,"Report both the level and the rate. That's the early warning."],["Drainage is critical",false,"It isn't yet. Say what the trend implies."],["Nothing until it hits 0",false,"By then it's too late to act cheaply."]]},
   {q:"Can a planner use float to recover a delay?",o:[["Never, float is sacred",false,"Too strict."],["Yes: shift a crew off a float-rich path onto critical work",true,"A legitimate recovery move. The float absorbs the shift."],["Yes, by deleting the float",false,"Float isn't something you delete; it comes out of the logic."],["Only the client can",false,"Planning decides how to use it, within the contract."]]},
   {q:"Which activities should a weekly review watch most closely?",o:[["Only zero-float ones",false,"Near-critical ones can become critical very quickly."],["Critical, plus near-critical activities (small or fast-falling float)",true,"That's where the next delay will come from."],["The longest-duration ones",false,"Long isn't the same as critical."],["Whichever the contractor mentions",false,"Let the float data decide, not who speaks loudest."]]}]},
  {k:"explain",p:"Explain to your COO in two sentences why a 3-day slip on the cable tray only moves handover by 1 day, while a 1-day slip on the pressure test moves it by 1 day."},
  {k:"done"}]},

 {id:"U7",day:7,title:"Saying it like a manager: impact statements",mins:20,
  card:{id:"c-impact",title:"Impact statement: event → days → money → options → decision",rule:"State what happened, what it moves (in days, naming what the date is the date OF), the cost exposure, 2–3 costed options, and who must decide by when.",example:"'AHU delivery slips 26 days (now 5 Feb). It drives HVAC installation start; handover at risk +26 days, LD exposure ₹X. Options: re-sequence zones, add a second gang, or accept. Director to decide by 15 Dec.'",trap:"Giving only money, or only the event; writing it as a letter; no decision request."},
  screens:[
  {k:"read",t:`**Why it matters.** Calculating float is half the job. The other half is **telling management** in a way that gets a decision. Your COO reads one line per project.

**The pattern, always in this order:**
1. **What happened**: the event, with what the date is the date OF
2. **What it moves**: days of slip, on the critical path or not
3. **Money**: cost or LD exposure
4. **Options**: 2–3, each with its cost and the days it recovers
5. **Decision**: who decides, by when`},
  {k:"read",t:`**The five options for any at-risk milestone:**
- **Expedite**: push the vendor or crew (depends on someone else agreeing)
- **Substitute**: an alternative make, supplier or method
- **Re-sequence**: change the order so other work fills the gap
- **Absorb**: add resources downstream to catch up
- **Accept**: take the slip and its cost. This is the benchmark the other four are priced against.

**Example:**
> *"AHU delivery slips 26 days (now 5 Feb), driving HVAC installation start. Handover at risk by up to 26 days; LD exposure ₹X. Options: install zone-wise as units arrive (recovers ~10 days, ₹0); second HVAC gang (recovers ~14 days, ₹Y); accept. Director to decide by 15 Dec."*`},
  {k:"quiz",bank:[
   {q:"Which line is the best impact statement?",o:[["HVAC is delayed, cost will increase.",false,"No days, no event date, no options, no decision."],["AHU delivery slips 26 days (now 5 Feb), driving HVAC installation start; handover at risk +26 days; options A/B/C costed; Director to decide by 15 Dec.",true,"Event, days, what the date is OF, options, decision."],["Dear Sir, kindly note the AHU is delayed.",false,"Letter style, with no impact or decision."],["LD exposure ₹40 lakh.",false,"Money with no cause and no time impact."]]},
   {q:"What comes first in an impact statement?",o:[["The money",false,"Money is the symptom. Say what moved first."],["The event and how many days it moves",true,"Schedule first, then cost."],["The options",false,"Options come after the impact is clear."],["An apology",false,"Not needed."]]},
   {q:"Why is 'Accept' always one of the options?",o:[["To look complete",false,"It has a real purpose."],["It's the benchmark: the other options are only worth paying for if they beat accepting the slip",true,"Accepting has a cost (LDs, lost revenue). That's the price to beat."],["Clients prefer it",false,"Not necessarily."],["It's the cheapest",false,"Not always: LDs can cost more than recovery."]]},
   {q:"The only option you've listed is 'push the vendor'. What's wrong?",o:[["Nothing",false,"It depends entirely on someone else agreeing."],["It's one lever that relies on someone else; add substitute, re-sequence, absorb, accept",true,"Never hand over a single option outside your control."],["Pushing vendors isn't allowed",false,"It is, it just isn't enough on its own."],["You should list ten options",false,"Two or three costed options is right."]]},
   {q:"The pressure test (critical) slips 4 days; the cable tray (float 6) slips 4 days. What do you escalate?",o:[["Both equally",false,"The cable tray's float absorbs its slip."],["The pressure test: it moves handover 4 days; the cable tray doesn't move it",true,"Escalate by impact on the finish, not by the size of the slip."],["Only the cable tray",false,"Reversed."],["Neither",false,"The critical slip needs a decision."]]}]},
  {k:"explain",p:"Write a two-line impact statement for this: the medical gas manifold delivery slips 12 days; manifold installation is on the critical path; LD is ₹3 lakh/day. Include at least two options and who decides."},
  {k:"done"}]},

 {id:"U8",day:8,title:"Breaking a hospital into a WBS",mins:25,
  card:{id:"c-wbs",title:"WBS = deliverables, 100% of the scope",rule:"A WBS breaks the project into deliverables (things that exist when finished), level by level, covering 100% of the scope and nothing extra. Give a separate branch to anything with its own money, its own delivering party and its own progress.",example:"Hospital → Block B → MEP → HVAC, Electrical, Plumbing, Fire, Medical gas → (medical gas) pipeline, bed-head drops, MGPS plant, alarm panels.",trap:"Process words ('connection to MGPS'); leaving out a whole trade such as medical gas."},
  screens:[
  {k:"read",t:`**Why it matters.** Before you schedule anything, you need a complete list of *what* is being delivered. If medical gas is missing from your breakdown, it has no budget, no activities and no owner. It goes uncontrolled until the OT can't open.

**WBS (Work Breakdown Structure)** = the project broken into **deliverables**, level by level.
- A deliverable is a **thing that exists when finished**: "Medical gas pipeline, Block B". Not an action like "connect gases".
- **100% rule:** together, the branches cover the whole scope, and nothing outside it.`},
  {k:"read",t:`**A hospital WBS, three levels down:**
\`\`\`
Hospital project
├ Block A (OPD & diagnostics)
├ Block B (IPD & OT)
│ ├ Civil & structure
│ ├ MEP
│ │ ├ HVAC
│ │ ├ Electrical
│ │ ├ Plumbing
│ │ ├ Fire
│ │ └ Medical gas
│ ├ Interiors & finishes
│ └ Modular OT
├ Medical equipment (client-procured)
└ Approvals & handover
\`\`\`
**Separate branch test:** give something its own branch if it has its **own money**, its **own delivering party** and its **own progress story**. That's why client-procured medical equipment sits on its own branch, not inside MEP.`},
  {k:"quiz",bank:[
   {q:"A commercial building's WBS lists Civil, MEP and Interiors. What's commonly missing?",o:[["External works (roads, drainage, STP, landscaping) and Approvals/handover",true,"They gate occupancy and are often left out."],["The canteen menu",false,"Not scope."],["Daily reports",false,"Not deliverables."],["Nothing",false,"External works and approvals are missing."]]},
   {q:"Which is a proper WBS element?",o:[["Connect oxygen lines to the MGPS",false,"That's an action (a process), not a deliverable."],["Medical gas pipeline, Block B",true,"A thing that exists when finished."],["Coordinate with the vendor",false,"An admin activity, not a deliverable."],["Putty and paint",false,"Process words. Say 'Wall finishes'."]]},
   {q:"The 100% rule means…",o:[["Every activity must be 100% complete",false,"It's about scope coverage, not progress."],["The WBS covers all of the scope and nothing outside it",true,"Missing scope goes uncontrolled; extra scope wastes effort."],["Budgets add up to 100 lakh",false,"No."],["Only 100 elements are allowed",false,"No."]]},
   {q:"Why does client-procured medical equipment get its own branch?",o:[["It's expensive",false,"Cost alone isn't the test."],["Its money, delivering party and progress are all different from the MEP contractor's",true,"Mixing it into MEP would hide who's accountable."],["NABH requires it",false,"Not a NABH rule."],["P6 needs it",false,"Software doesn't decide this."]]},
   {q:"Your MEP branch has HVAC, Electrical, Plumbing and Fire. What's missing for a hospital?",o:[["Painting",false,"That's interiors and finishes."],["Medical gas",true,"A hospital-critical system that gates OT and ICU readiness."],["Excavation",false,"That's civil."],["Landscaping",false,"External works."]]},
   {q:"What happens to scope that's left out of the WBS?",o:[["Nothing, it gets done anyway",false,"It often gets discovered late."],["It has no budget, no schedule and no owner, so it goes uncontrolled",true,"That's why the 100% rule matters."],["The client pays extra automatically",false,"Not automatically."],["P6 adds it",false,"P6 only schedules what you enter."]]}]},
  {k:"explain",p:"In your own words: what makes a good WBS element, and give one example from a hospital you're working on now."},
  {k:"done"}]},

 {id:"U9",day:9,title:"Baseline, update, forecast and data date",mins:25,
  card:{id:"c-baseline",title:"Variance = forecast vs baseline, at a data date",rule:"Baseline = the approved plan, frozen. Update = actuals entered up to the data date, with the remaining work re-forecast. Variance = forecast − baseline. Change the baseline only through change control.",example:"OT block baseline handover 15 Mar; the September update forecasts 2 Apr → +18 days. The baseline stays at 15 Mar.",trap:"Overwriting the baseline every month, so the project is never late on paper."},
  screens:[
  {k:"read",t:`**Why it matters.** "Are we late?" only means something compared with a fixed plan. If you move the plan every month, you're never late on paper and always late on site.

- **Baseline**: the approved schedule, **frozen**. It's the yardstick.
- **Data date**: the cut-off for an update (e.g. 30 Sep). Before it everything is **actual**; after it everything is **forecast**.
- **Update**: enter what actually happened up to the data date, then re-forecast the remaining work.
- **Variance** = forecast − baseline. Positive = late.`},
  {k:"read",t:`**Example: OT block**
- Baseline: OT handover **15 Mar**
- September update (data date 30 Sep): the structure is 2 weeks behind → forecast handover **2 Apr**
- Variance = 2 Apr − 15 Mar = **+18 days**

The baseline **stays** 15 Mar. If a recovery plan is approved (say, a night shift to reach 6 Mar), that's a **recovery schedule** you track against, but the baseline only changes through formal change control (an approved re-baseline).

**Every update, check:** no forecast dates before the data date, and no actual dates after it.`},
  {k:"quiz",bank:[
   {q:"What is the baseline?",o:[["The latest updated schedule",false,"That's the current schedule."],["The approved plan, frozen as the yardstick",true,"Variance is measured against it."],["The contractor's wish list",false,"No."],["The recovery plan",false,"That's separate."]]},
   {q:"Data date 30 Sep. An activity shows a forecast start of 20 Sep but hasn't started. What's wrong?",o:[["Nothing",false,"A forecast can't be in the past."],["Forecast dates can't be before the data date; reschedule so it starts after 30 Sep",true,"Before the data date is actual; after it is forecast."],["It should be marked complete",false,"Only if it actually happened."],["Change the data date",false,"The cut-off is fixed for the update."]]},
   {q:"Baseline handover 15 Mar, forecast 2 Apr. Variance?",o:[["−18 days",false,"Later than baseline is positive (late)."],["+18 days (late)",true,"16 days to the end of March + 2 = 18."],["+2 days",false,"Count the days from 15 Mar to 2 Apr."],["0, if the recovery plan is approved",false,"The variance to baseline stays; recovery is tracked separately."]]},
   {q:"When can the baseline be changed?",o:[["Every month",false,"Then variance means nothing."],["Only through formal change control (an approved re-baseline)",true,"For example, after an approved scope change or EOT."],["Whenever the contractor asks",false,"No."],["Never, under any circumstances",false,"Re-baselining is allowed through change control."]]},
   {q:"What does the data date separate?",o:[["Cost from schedule",false,"No."],["Actuals (before) from forecast (after)",true,"It's the update's cut-off."],["Civil from MEP",false,"No."],["Baseline from recovery",false,"No."]]}]},
  {k:"explain",p:"Explain to a site engineer why we never overwrite the baseline when the project slips."},
  {k:"done"}]},

 {id:"U10",day:10,title:"Planning durations from quantities",mins:30,
  card:{id:"c-duration",title:"Duration = quantity ÷ (output × crews), rounded up",rule:"Effort (crew-days) = quantity ÷ output per crew-day; duration = effort ÷ crews, rounded UP; then check the workface, and convert on the calendar.",example:"Blockwork 1,800 m² at 10 m²/crew-day = 180 crew-days; 3 crews → 60 working days ≈ 10 weeks on a Mon–Sat site.",trap:"Accepting the contractor's duration without the quantity × output check; adding crews without checking there's room for them."},
  screens:[
  {k:"read",t:`**Why it matters.** A schedule is only as good as its durations. If the contractor says "blockwork 30 days", a planner checks it: *is that even possible?*

**Three numbers you need:**
- **Quantity**: from the BOQ or drawings (e.g. 1,800 m² of blockwork)
- **Output**: what one crew does per working day (e.g. 10 m² per crew, one mason and two helpers)
- **Crews**: how many crews will work at once`},
  {k:"read",t:`**Worked example, with every hop:**
1. Effort = 1,800 ÷ 10 = **180 crew-days**
2. With 3 crews: 180 ÷ 3 = **60 working days**
3. To finish in 40 days instead: 180 ÷ 40 = 4.5 → **5 crews** (always round **up**: you can't hire half a crew)
4. Calendar: 60 working days on a Mon–Sat site = 10 weeks ≈ **70 calendar days**

**Then check reality:** is there room (workface) for 5 crews on one floor? Is there enough material and supervision? Crowding drops output, so more crews isn't always faster.

**So "blockwork 30 days" needs 180 ÷ 30 = 6 crews.** Ask the contractor whether they have 6.`},
  {k:"drill",id:"duration",t:"Practise with new numbers each time. Show the hops in your head before you type."},
  {k:"quiz",bank:[
   {q:"Interlocking paver blocks 4,800 m², 80 m² per crew-day, 3 crews. Working days?",o:[["20",true,"4,800 ÷ 80 = 60 crew-days ÷ 3 = 20."],["60",false,"That's crew-days. Divide by 3."],["16",false,"Recheck: 60 ÷ 3."],["240",false,"Divide, don't multiply."]]},
   {q:"Ceiling 2,400 m², 30 m² per crew per day, 4 crews. How many working days?",o:[["20",true,"2,400 ÷ 30 = 80 crew-days; 80 ÷ 4 = 20."],["80",false,"That's the crew-days. Divide by the 4 crews."],["320",false,"Divide, don't multiply."],["10",false,"Recheck: 80 ÷ 4."]]},
   {q:"You need 4.2 crews to hit the date. How many do you plan?",o:[["4",false,"4 crews would miss the date."],["5",true,"Always round crews up."],["4.2",false,"You can't hire part of a crew."],["6",false,"5 is enough."]]},
   {q:"The contractor says 'blockwork 1,800 m² in 30 days' at 10 m² per crew-day. What do you ask?",o:[["Nothing, accept it",false,"Check it first."],["Do you have 6 crews, and room for them on the floor?",true,"180 crew-days ÷ 30 days = 6 crews."],["Can you do it in 20?",false,"First check whether 30 is even possible."],["What is your rate?",false,"That's commercial, not the duration check."]]},
   {q:"Why doesn't doubling the crews always halve the duration?",o:[["It always does",false,"Not on a real site."],["Crowding, shared access and supervision reduce each crew's output",true,"Check the workface before adding crews."],["P6 limits crews",false,"No."],["Labour law",false,"Not the main reason."]]},
   {q:"About how many calendar days is 60 working days on a Mon–Sat site?",o:[["60",false,"That ignores the Sundays."],["70",true,"60 ÷ 6 = 10 weeks = 70 calendar days."],["84",false,"That's for a 5-day week."],["50",false,"Calendar days are never fewer than working days."]]}]},
  {k:"explain",p:"Pick one real activity from your current project. Estimate its duration from quantity, output and crews, showing each step."},
  {k:"done"}]},
];

// ================= LEARN TAB ENGINE =================
let lv={unit:null};
function cst(uid){ state.course=state.course||{}; return state.course[uid]||(state.course[uid]={screen:0,ok:{},score:null,tries:0,done:false,missed:[]}); }
function unitIdx(uid){ return UNITS.findIndex(u=>u.id===uid); }
function unitOpen(i){ const u=UNITS[i]; if(u.track){ const tr=UNITS.filter(x=>x.track===u.track), k=tr.indexOf(u); return cst("U1").done && tr.slice(0,k).every(x=>cst(x.id).done); }
  const main=UNITS.filter(x=>!x.track), k=main.indexOf(u); return k===0 || main.slice(0,k).every(x=>cst(x.id).done); }
function currentUnit(){ return UNITS.find((u,i)=>!u.track&&unitOpen(i)&&!cst(u.id).done)||null; }
function renderLearn(){
  const w=$("learnwrap"); if(!w) return;
  if(lv.mixed&&mx) return renderMixed(w);
  if(lv.unit) return renderUnit(w);
  const cur=currentUnit(), MAIN=UNITS.filter(u=>!u.track), doneN=MAIN.filter(u=>cst(u.id).done).length;
  const pct=Math.round(doneN/MAIN.length*100);
  const streak=(()=>{ let s=0, d=today(); for(let i=0;i<90;i++){ const prev=new Date(d); prev.setDate(prev.getDate()-1); d=prev.toISOString().slice(0,10); if(MAIN.some(u=>cst(u.id).doneAt===d)) s++; else break; } if(MAIN.some(u=>cst(u.id).doneAt===today())) s++; return s; })();
  let h=`<div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><b style="font-stretch:80%">Day ${state.day} / 90</b>${streak>1?`<span style="font-size:.82rem">🔥 ${streak}-day streak</span>`:""}</div>
    <div style="height:8px;background:var(--barSoft);border-radius:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--bar);border-radius:4px;transition:width .3s"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:4px"><span>${doneN} units passed</span><span>${dueCards().length} cards due</span><span>${pct}%</span></div></div>`;
  h+=`<p class="lead">One unit a day. Each one teaches, shows, lets you try, then checks. You move on when you pass the check (4 out of 5).</p>`;
  if(cur) h+=`<div class="drill" style="border-color:var(--bar);border-width:2px"><small style="color:var(--muted)">${cur.day===0?"Start here":"Today"} · about ${cur.mins} min</small><div class="q">Day ${cur.day}: ${esc(cur.title.replace(/^Day 0: /,""))}</div>
    ${cst(cur.id).screen>0?`<p style="margin:0 0 8px;color:var(--muted)">You're on step ${cst(cur.id).screen+1} of ${cur.screens.length}.</p>`:""}
    <div class="btnrow"><button class="send" data-u="${cur.id}" style="flex:1">${cst(cur.id).screen>0?"Continue":"Start"}</button></div></div>`;
  else h+=`<div class="note"><b>Gate 1 passed: Block 1 complete.</b> Block 2 (P6, progress, cost, EVM) gets written next. Meanwhile, mixed review, Practice and your real-work portfolio carry on.</div>`;
  const passedN=UNITS.filter(u=>cst(u.id).done&&u.screens.some(x=>x.k==="quiz")).length, applied=UNITS.filter(u=>cst(u.id).apply?.sent).length, applyTotal=UNITS.filter(u=>APPLY[u.id]).length;
  if(passedN>=2) h+=`<div class="rt"><div><b>Mixed review</b> · 8 questions from ${UNITS.filter(u=>cst(u.id).done&&(u.track||u.day>0)).map(u=>u.track?u.id:"Day "+u.day).join(", ")}<br><small>Do it 2–3 times a week. Shuffling topics is what makes them stick.</small></div><button class="btn" id="mx-start">Start</button></div>`;
  h+=`<div class="rt ${applied<UNITS.filter(u=>cst(u.id).done&&APPLY[u.id]).length?"due":""}"><div><b>Real-work portfolio</b> · ${applied} of ${applyTotal} tasks submitted<br><small>${UNITS.filter(u=>cst(u.id).done&&APPLY[u.id]&&!cst(u.id).apply?.sent).map(u=>u.track?u.id:"Day "+u.day).join(", ")||"Each day from 1 to 10 has one task on your own hospitals."}${UNITS.some(u=>cst(u.id).done&&APPLY[u.id]&&!cst(u.id).apply?.sent)?" still to do. Open the day → 'Apply it at work'.":""}</small></div></div>`;
  h+=`<div class="score"><div><b>${doneN}/${MAIN.length}</b><span>Block 1 days passed</span></div><div><b>${(()=>{const d=dueCards().length; return d;})()}</b><span>cards due for review (Notes)</span></div></div>`;
  h+=`<h2 class="sec">Block 1: Foundation (Days 0–20)</h2><p class="lead">Planning and scheduling in depth, with examples from hospitals, commercial buildings, residential towers and external works.</p>`;
  UNITS.forEach((u,i)=>{ if(u.track) return; const s=cst(u.id), open=unitOpen(i);
    h+=`<div class="rt ${u===cur?"due":""}"><div><b>Day ${u.day}</b>${u.gate?" 🏁":""} · ${esc(u.title.replace(/^Day 0: /,""))}<br><small>${s.done?`✓ passed${s.score!=null?` · ${s.score}%`:""} · tap to revise`:open?`about ${u.mins} min`:"Unlocks when the previous unit is passed"}</small></div>${open?`<button class="btn" data-u="${u.id}">${s.done?"Revise":"Open"}</button>`:`<small>🔒</small>`}</div>`; });
  const MT=UNITS.filter(u=>u.track==="M");
  h+=`<h2 class="sec">Site measurement track (alongside the days)</h2><p class="lead">How quantities are measured on site and how bills are checked: MB and joint measurement, civil, finishes, MEP and external works, RA bills. Opens after Day 1. Do one whenever you have a spare 25 minutes; it doesn't hold up the main days.</p>`;
  MT.forEach(u=>{ const i=UNITS.indexOf(u), s=cst(u.id), open=unitOpen(i);
    h+=`<div class="rt"><div><b>${u.id}</b> · ${esc(u.title)}<br><small>${s.done?`✓ passed${s.score!=null?` · ${s.score}%`:""} · tap to revise`:open?`about ${u.mins} min`:(cst("U1").done?"Unlocks after the previous measurement unit":"Opens after Day 1")}</small></div>${open?`<button class="btn" data-u="${u.id}">${s.done?"Revise":"Open"}</button>`:`<small>🔒</small>`}</div>`; });
  ROADMAP.forEach(r=>{ h+=`<h2 class="sec">${esc(r.title)} (Days ${r.days})</h2><div class="rt"><div><small>${esc(r.items)}</small><br><small style="color:var(--muted)">Written to the same standard once the previous gate is passed.</small></div><small>🔒</small></div>`; });
  w.innerHTML=h;
  w.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ lv={unit:b.dataset.u}; const s=cst(b.dataset.u); if(s.done) s.screen=0; renderLearn(); w.parentElement.scrollTop=0; });
  $("mx-start")&&($("mx-start").onclick=startMixed);
}
function renderUnit(w){
  const u=UNITS.find(x=>x.id===lv.unit), s=cst(u.id), sc=u.screens[s.screen];
  const dots=u.screens.map((x,i)=>`<i style="flex:1;height:5px;border-radius:3px;background:${i<s.screen?"var(--bar)":i===s.screen?"var(--crit)":"var(--barSoft)"}"></i>`).join("");
  let h=`<div class="btnrow" style="margin:0 0 8px"><button class="btn" id="u-list">← All units</button></div>
   <small style="color:var(--muted)">${u.track?"Measurement "+u.id:"Day "+u.day} · step ${s.screen+1} of ${u.screens.length}</small>
   <h2 class="sec" style="margin-top:2px">${esc(u.title.replace(/^Day 0: /,""))}</h2><div style="display:flex;gap:3px;margin-bottom:12px">${dots}</div><div id="u-body"></div>
   <div class="btnrow" id="u-nav"><button class="btn" id="u-back" ${s.screen===0?"disabled":""}>Back</button><button class="send" id="u-next" style="flex:1">Next</button></div>`;
  w.innerHTML=h;
  $("u-list").onclick=()=>{ lv={unit:null}; renderLearn(); };
  $("u-back").onclick=()=>{ s.screen=Math.max(0,s.screen-1); save(); renderLearn(); w.parentElement.scrollTop=0; };
  const next=$("u-next"), gate=(ok,label)=>{ next.disabled=!ok; if(label) next.textContent=label; };
  next.onclick=()=>{ if(s.screen<u.screens.length-1){ s.screen++; save(); renderLearn(); w.parentElement.scrollTop=0; } };

  // Swipe support for unit navigation
  let touchStartX = null;
  w.ontouchstart = e => { if(e.touches.length === 1) touchStartX = e.touches[0].clientX; };
  w.ontouchend = e => {
    if(touchStartX == null || e.changedTouches.length === 0) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if(Math.abs(diff) > 55){
      if(diff < 0 && !next.disabled){ next.click(); }
      else if(diff > 0 && s.screen > 0){ $("u-back").click(); }
    }
  };
  const body=$("u-body"), key=String(s.screen);
  if(sc.k==="read"){ body.innerHTML=`<div class="card" style="padding:4px 14px"><div class="md">${md(sc.t)}</div></div>`; gate(true); }
  else if(sc.k==="ruler"){ const acts=sc.acts.map(a=>({...a,pred:a.pred.map(p=>({...p}))})); cpm(acts); body.innerHTML=`<div class="card" style="padding:10px 12px">${rulerHtml(acts,{})}</div><div class="card" style="padding:4px 14px"><div class="md">${md(sc.t)}</div></div>`; gate(true); }
  else if(sc.k==="explainer"){ s.ex=s.ex||{}; if(s.ex[key]==null) s.ex[key]=sc.from; const i=s.ex[key], st=GX_STEPS[i];
    const acts=GX_ACTS.map(a=>({...a,pred:a.pred.map(p=>({...p}))})); cpm(acts);
    body.innerHTML=`<p class="lead">Worked example ${i-sc.from+1} of ${sc.to-sc.from+1}. Tap through it slowly.</p><div class="card" style="padding:10px 12px">${rulerHtml(acts,{show:st.show,late:st.late||[],float:st.float})}</div>
      <div class="card" style="padding:4px 14px"><div class="md">${md(st.t)}</div></div><div class="note"><b>Rule:</b> ${esc(st.rule)}</div>
      <div class="btnrow" style="margin-bottom:6px"><button class="btn" id="ex-p" ${i===sc.from?"disabled":""}>◀ Previous step</button><button class="btn" id="ex-n" ${i===sc.to?"disabled":""} style="flex:1">Next step ▶</button></div>`;
    $("ex-p").onclick=()=>{ s.ex[key]--; renderLearn(); }; $("ex-n").onclick=()=>{ s.ex[key]++; renderLearn(); };
    gate(i===sc.to||s.ok[key], i===sc.to||s.ok[key]?"Next":"Finish the example first"); if(i===sc.to) s.ok[key]=true; }
  else if(sc.k==="guided"){
    body.innerHTML=`<p class="lead">${esc(sc.t)}</p><div id="u-g"></div>`;
    if(!gp||gp.host!=="unit"||gp.ukey!==u.id+"|"+key) startGuided(sc.level,{host:"unit",ukey:u.id+"|"+key,fwd:sc.fwd,noRender:true});
    renderGuided($("u-g")); gate(!!s.ok[key], s.ok[key]?"Next":"Finish one run first"); }
  else if(sc.k==="drill"){
    body.innerHTML=`<p class="lead">${esc(sc.t)}</p><div id="u-d"></div>`;
    const mk=()=>{ const d=DRILLS.find(x=>x.id===sc.id); pr={view:"drill",drill:sc.id,q:d.gen()}; renderDrill($("u-d")); $("pr-back")&&$("pr-back").remove(); $("pr-les")&&$("pr-les").remove();
      $("pr-new").onclick=()=>mk(); $("pr-check").addEventListener("click",()=>{ if($("pr-res").querySelector("h2")){ s.ok[key]=true; gate(true,"Next"); } }); };
    mk(); gate(!!s.ok[key], s.ok[key]?"Next":"Check one problem first"); }
  else if(sc.k==="cal") renderCal(body,s,key,gate);
