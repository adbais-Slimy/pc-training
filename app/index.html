<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Controls — 90-Day Programme</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="shim.js?v=6"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#E9ECE8; --surface:#FFFFFF; --ink:#1B2433; --muted:#5B6776; --line:#CDD3CF;
  --bar:#2F5BD3; --barSoft:#DCE5FA; --crit:#C23A2E; --ok:#1F8A4C; --warn:#C77A12;
  --me:#1B2433; --meInk:#F3F5F7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1B2129; --ink:#E6EAEF; --muted:#98A3B1; --line:#2E3742;
  --bar:#6F93F2; --barSoft:#23304F; --crit:#EE6A5E; --ok:#4CC282; --warn:#E3A240; --me:#E6EAEF; --meInk:#12161C; }}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B2129; --ink:#E6EAEF; --muted:#98A3B1; --line:#2E3742;
  --bar:#6F93F2; --barSoft:#23304F; --crit:#EE6A5E; --ok:#4CC282; --warn:#E3A240; --me:#E6EAEF; --meInk:#12161C; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--bar);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;max-width:860px;margin:0 auto}
.title{font-stretch:75%;font-weight:800;font-size:1.05rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daytag{font-stretch:75%;font-weight:700;color:var(--crit);white-space:nowrap;font-size:.9rem}
/* step tracker: the session drawn as one activity bar */
.steps{display:none !important;max-width:860px;margin:6px auto 2px;gap:2px}
.steps div{flex:1;text-align:center;font-size:.68rem;font-stretch:80%;font-weight:600;color:var(--muted)}
.steps div i{display:block;height:6px;border-radius:2px;background:var(--barSoft);margin-bottom:3px}
.steps div.done i{background:var(--bar)}
.steps div.now{color:var(--ink)}
.steps div.now i{background:var(--crit)}
nav{display:flex;max-width:860px;margin:2px auto 0}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:6px 2px;font-weight:600;font-size:.84rem;color:var(--muted);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bar)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;overflow-y:auto}
.view.on{display:flex;flex-direction:column}
.wrap{max-width:860px;width:100%;margin:0 auto;padding:14px}
#log{flex:1;overflow-y:auto;padding:14px 0}
.msg{max-width:860px;margin:0 auto 12px;padding:0 12px}
.msg .b{padding:11px 13px;border-radius:14px;overflow-wrap:anywhere}
.msg.dir .b{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{display:flex;flex-direction:column;align-items:flex-end}
.msg.me .b{background:var(--me);color:var(--meInk);border-top-right-radius:4px;max-width:88%;white-space:pre-wrap}
.msg .meta{font-size:.72rem;color:var(--muted);margin-top:3px}
.daysep{max-width:860px;margin:6px auto 14px;padding:0 12px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;font-weight:600}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.md h1,.md h2,.md h3{font-stretch:80%;line-height:1.2;margin:.8em 0 .35em}
.md h1{font-size:1.15rem}.md h2{font-size:1.05rem}.md h3{font-size:.98rem}
.md p{margin:.45em 0}.md ul,.md ol{padding-left:1.25em;margin:.4em 0}
.md .tw{overflow-x:auto;margin:.5em 0}
.md table{border-collapse:collapse;font-size:.86rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.md th{background:var(--barSoft)}
.md code{font-size:.9em;background:var(--barSoft);padding:1px 4px;border-radius:4px}
.md blockquote{margin:.5em 0;padding:.3em .8em;border-left:3px solid var(--bar);background:var(--barSoft);border-radius:0 6px 6px 0}
.thinking{color:var(--muted);font-style:italic}
.banked{margin-top:8px;font-size:.8rem;color:var(--ok);font-weight:600}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:8px 10px}
.cin{max-width:860px;margin:0 auto}
.wide{display:none;width:100%;margin-bottom:8px;height:42px;border-radius:10px;border:0;background:var(--bar);color:#fff;font-weight:700}
.wide.on{display:block}
.conf{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:.78rem;color:var(--muted);overflow-x:auto}
.conf.req .lbl{color:var(--crit);font-weight:600}
.conf button{flex:none;width:30px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.conf button[aria-pressed="true"]{background:var(--bar);color:#fff;border-color:var(--bar)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:42px;max-height:40vh;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.send{height:42px;padding:0 16px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:700}
.quick{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
.quick button{white-space:nowrap;border:1px solid var(--line);background:none;border-radius:99px;padding:4px 10px;font-size:.8rem}
.status{font-size:.78rem;color:var(--muted);margin-top:4px}
.status:empty{display:none}
.budget{font-size:.72rem;color:var(--muted);text-align:right;margin-top:2px}
/* shared cards */
h2.sec{font-stretch:80%;font-size:1.05rem;margin:16px 0 8px}
h2.sec:first-child{margin-top:0}
.lead{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.card>summary{padding:10px 12px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
.card>summary::-webkit-details-marker{display:none}
.card>summary b{flex:1}
.card>summary small{color:var(--muted);white-space:nowrap;font-size:.75rem}
.card .in{padding:0 12px 12px;border-top:1px solid var(--line)}
.card .in h4{margin:10px 0 2px;font-size:.78rem;color:var(--muted);font-weight:600}
.card .in p{margin:2px 0}
.rule{font-weight:600}
.trap{color:var(--crit)}
.pill{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:2px 4px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.84rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.danger{color:var(--crit)}
.filter{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.filter button{white-space:nowrap;border:1px solid var(--line);background:none;border-radius:99px;padding:4px 11px;font-size:.82rem}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);padding:12px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;font-size:.9rem}
/* progress */
#gantt{display:block;width:100%;height:46px;margin:0 0 14px}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.score div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.score b{display:block;font-stretch:75%;font-size:1.55rem;line-height:1.1}
.score span{font-size:.76rem;color:var(--muted)}
.wt{width:100%;border-collapse:collapse;font-size:.84rem;margin-bottom:6px}
.wt td{padding:4px 0;border-bottom:1px solid var(--line)}
.wt td:last-child{text-align:right;font-variant-numeric:tabular-nums;width:3.5em}
.wt .m{height:6px;background:var(--barSoft);border-radius:3px;overflow:hidden;margin-top:3px}
.wt .m i{display:block;height:100%;background:var(--bar)}
.note{background:var(--barSoft);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-bottom:12px}
details.dom{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.dom summary{padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
details.dom summary::-webkit-details-marker{display:none}
.meter{height:6px;background:var(--barSoft);border-radius:3px;margin:0 12px 10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.item{border-top:1px solid var(--line);padding:7px 12px;font-size:.88rem}
.item .h{display:flex;gap:8px;align-items:baseline}
.item .h em{margin-left:auto;font-style:normal;font-size:.74rem;color:var(--muted);white-space:nowrap}
.item .d{color:var(--muted);font-size:.8rem;margin:2px 0 0 26px}
.rt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.9rem}
.rt small{color:var(--muted)}
.rt.due{border-color:var(--crit)}
/* answer sheet */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on{display:flex}
.sh-top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-top b{font-stretch:80%;font-size:1.02rem}
.sh-body{flex:1;overflow-y:auto;padding:12px 12px 24px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 auto 12px;max-width:860px}
.qa.done{border-left:4px solid var(--ok)}
.qa textarea{width:100%;min-height:84px;margin-top:8px;display:block}
.qa .conf{margin:8px 0 0}
.qa .dk{flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:.76rem;margin-left:auto}
.sh-foot{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center}
.sh-foot span{flex:1;font-size:.8rem;color:var(--muted)}
.offline{display:none;background:var(--barSoft);border-radius:10px;padding:9px 12px;font-size:.84rem;margin-bottom:8px}
.offline.on{display:block}
.offline button{margin-top:6px}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.drill .q{font-stretch:85%;font-weight:700;font-size:1.05rem;margin:4px 0 8px}
.drill .ans{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.drill .ans.on{display:block}
.drill .ans h4{margin:8px 0 2px;font-size:.78rem;color:var(--muted);font-weight:600}
.drill .ans p{margin:2px 0}
.rate{display:flex;gap:8px;margin-top:12px}
.rate button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
body.exam header{border-bottom:3px solid var(--crit)}
.pat{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crit);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:.88rem}
.pat small{color:var(--muted)}
.dl{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.dl b{font-stretch:80%}
.dl em{font-style:normal;font-size:.74rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.dl em.accepted{color:var(--ok);border-color:var(--ok)}.dl em.rework{color:var(--crit);border-color:var(--crit)}.dl em.submitted,.dl em.in_progress{color:var(--bar);border-color:var(--bar)}
.older{display:block;margin:0 auto 12px;max-width:860px}
.rul{position:relative;font-size:.78rem}
.rul-scale{position:relative;height:18px;margin-left:38%;border-bottom:1px solid var(--line)}
.rul-scale span{position:absolute;transform:translateX(-50%);color:var(--muted);font-size:.68rem}
.rul-row{display:flex;align-items:center;min-height:28px;border-bottom:1px dashed var(--line)}
.rul-lab{width:38%;padding-right:6px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rul-lab small{color:var(--muted)}
.rul-track{position:relative;flex:1;height:26px}
.rul-bar{position:absolute;top:4px;height:12px;background:var(--bar);border-radius:3px}
.rul-bar.crit{background:var(--crit)}
.rul-bar em{position:absolute;top:12px;left:0;font-style:normal;font-size:.62rem;color:var(--muted);white-space:nowrap}
.rul-late{position:absolute;top:2px;height:16px;border:2px dashed var(--ink);border-radius:3px;box-sizing:border-box;opacity:.55}
.rul-float{position:absolute;top:6px;height:8px;background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);border-radius:2px}
.rul-float em{position:absolute;top:8px;left:0;font-style:normal;font-size:.62rem;color:var(--warn);white-space:nowrap}
#startbtn,#shortbtn{display:none !important}
nav button{font-size:.8rem}
@media (prefers-reduced-motion:no-preference){ .msg.new{animation:rise .22s ease-out} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<header>
  <div class="top"><h1 class="title" id="title">Project Controls, 90 days</h1><span class="daytag" id="daytag">Diagnostic</span></div>
  <div class="steps" id="steps" aria-label="Session steps"></div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-v="learn">Learn</button>
    <button role="tab" aria-selected="false" data-v="chat">Tutor</button>
    <button role="tab" aria-selected="false" data-v="prac">Practice</button>
    <button role="tab" aria-selected="false" data-v="book">Notes</button>
    <button role="tab" aria-selected="false" data-v="prog">More</button>
  </nav>
</header>
<main>
  <section class="view on" id="v-learn"><div class="wrap" id="learnwrap"></div></section>
  <section class="view" id="v-chat">
    <div id="log" aria-live="polite"></div>
    <div class="composer"><div class="cin">
      <div class="offline" id="offline" style="position:relative">
        <button id="off-close" style="position:absolute;top:6px;right:8px;background:none;border:none;font-size:18px;line-height:1;cursor:pointer;color:inherit;opacity:.7" aria-label="Dismiss">&times;</button>
        <b id="offline-msg">AI Tutor usage limit or quota reached.</b>
        <p style="margin:4px 0 8px;font-size:.82rem;opacity:.9">Notebook drills, the Library and your progress still work without AI. Tap ⚙ to update your key or model.</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn" id="goprac">Lessons &amp; drills</button>
          <button class="btn" id="godrill">Drill my notes</button>
          <button class="btn" id="off-retry">Dismiss &amp; Retry</button>
        </div>
      </div>
      <button class="wide" id="sheetbtn">Open answer sheet</button>
      <button class="wide" id="startbtn">Start next day</button>
      <button class="btn" id="shortbtn" style="display:none;width:100%;margin:-2px 0 8px">Packed day? Short session (about 20 min)</button>
      <div class="conf" id="conf"></div>
      <div class="row">
        <textarea id="box" rows="1" placeholder="Message the Director"></textarea>
        <button class="send" id="send">Send</button>
      </div>
      <div class="quick" id="quick">
        <button data-q="[TEACH] I don't understand this. Explain it from zero in plain words with one small hospital example: ">Explain simply</button>
        <button data-q="[EXPLAIN-BACK] Make me explain the last concept back in my own words, then give me one twist scenario.">Make me explain it</button>
        <button data-q="[CHALLENGE] One cold viva question on something in my notebook. No hints.">Challenge me</button>
        <button data-q="[REAL] Apply today's module to a real situation on my project: ">My project</button>
        <button data-q="[STATUS] Where am I: weighted score, gate status, weakest 3 items, and what comes next.">Where am I?</button>
      </div>
      <div class="status" id="status"></div>
      <div class="budget" id="budget"></div>
    </div></div>
  </section>
  <section class="view" id="v-prac"><div class="wrap" id="pracwrap"></div></section>
  <section class="view" id="v-book"><div class="wrap" id="bookwrap"></div></section>
  <section class="view" id="v-prog"><div class="wrap"><div class="btnrow" style="margin:0 0 12px"><button class="btn" id="go-lib" style="flex:1">📚 Standards library &amp; videos</button></div><svg id="gantt" viewBox="0 0 900 46" preserveAspectRatio="none" aria-label="90-day timeline"></svg><div id="progwrap"></div></div></section>
  <section class="view" id="v-lib"><div class="wrap" id="libwrap"></div></section>
</main>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Answer sheet">
  <div class="sh-top"><b id="sh-title">Answer sheet</b><button class="btn" id="sh-close">Close</button></div>
  <div class="sh-body" id="sh-body"></div>
  <div class="sh-foot"><span id="sh-count"></span><button class="send" id="sh-send">Send all</button></div>
</div>

<script type="text/plain" id="rules">
PROJECT CONTROLS MANAGER — 90-DAY LOCKED LEARNING SYSTEM

ROLE: You are my Project Controls Manager Training Director, Technical Mentor, Examiner, and Progress Auditor. Take me from my current level to a practically competent Project Controls Manager within 90 days. I am a Civil Engineer in construction/PMC/project coordination (hospital projects, India), moving into Manager – Planning & Project Controls. Practical exposure: construction coordination, procurement, tendering, vendor coordination, BOQ, project reporting, cash-flow tracking, QA/QC coordination, documentation, multiple parallel hospital projects, Google Sheets/Apps Script, AI-assisted development. Do NOT assume coordination experience means technical Project Controls knowledge. Weaknesses: formal planning methodology, P6 depth, CPM, baseline management, progress measurement, cost control, EVM, forecasting, delay analysis, risk integration, schedule/cost/procurement integration, management-level controls thinking. Objective is NOT software development; it is technical credibility as a Project Controls Manager using digital/AI tools as leverage.

1. NON-NEGOTIABLE RULES (override everything else)
RULE 1 — DO NOT LET ME DEVIATE. I jump between subjects, get distracted by AI tools, start business ideas, build software before validating the problem, ask about certifications prematurely, jump to advanced topics, consume without demonstrating competence. Prevent this. If I jump ahead respond: "LOCKED CURRICULUM: You are currently on [MODULE]. We will not move to [REQUESTED MODULE] until the required gate is passed." then say what I must complete first.
2. NO RANDOM LEARNING. Everything belongs to the curriculum. Useful-but-later topics go to PARKING LOT.
3. NO FALSE CONFIDENCE. Understanding requires: explanation, worked example, practical construction scenario, calculation where applicable, interpretation, decision-making, management scenario.
4. NO PASSING BASED ON MEMORY. Levels: AWARE, UNDERSTANDING, APPLIED, COMPETENT, MANAGER LEVEL. One correct theoretical answer is never COMPETENT.
5. TEACH → DEMONSTRATE → TEST → APPLY → AUDIT → RETEST → GATE.
6. USE MY REAL WORK CONTEXT: hospital construction, PMC, civil, MEP, HVAC, electrical, medical equipment, interiors, procurement, vendors, approvals, PO cycles, deliveries, billing, cash flow, T&C, handover. Not highways/oil & gas.
7. DO NOT EXPOSE ANSWERS BEFORE TESTS. Wait for my attempt, then evaluate.
8. FORCE MANAGER THINKING: what happened, why, impact, critical path?, time impact, cost impact, owner, risk, recovery, decision required, what management is told.
9. CHECKLISTS ARE THE CONTROL SYSTEM. You are the only authority. I never self-certify. Require evidence. ⬜ Not started 🟡 Learning 🟠 Needs improvement 🟢 Competent 🔵 Manager-level. Never green without evidence.

10. MASTER PROGRESS CHECKLIST

FOUNDATION
⬜ Project Controls purpose
⬜ Project lifecycle
⬜ Project Controls vs Planning vs Project Management
⬜ WBS
⬜ CBS
⬜ OBS
⬜ RAM
⬜ Work packages
⬜ Control accounts
⬜ Baselines
⬜ Data date
⬜ Control cycle
⬜ KPIs
⬜ Governance
⬜ Change control

PLANNING & SCHEDULING
⬜ Activity definition
⬜ Activity types
⬜ Milestones
⬜ FS relationship
⬜ SS relationship
⬜ FF relationship
⬜ SF relationship
⬜ Leads
⬜ Lags
⬜ Constraints
⬜ Calendars
⬜ CPM
⬜ Forward pass
⬜ Backward pass
⬜ Total Float
⬜ Free Float
⬜ Critical Path
⬜ Near-critical path
⬜ Negative float
⬜ Open ends
⬜ Schedule hierarchy
⬜ Master schedule
⬜ Detailed schedule
⬜ Look-ahead schedule
⬜ Recovery schedule
⬜ Baseline schedule
⬜ Schedule quality

PLANNING — STRATEGY & METHOD
⬜ Planning basis & assumptions
⬜ Construction methodology & sequencing
⬜ Duration estimation
⬜ Phasing & zoning
⬜ Flow-line / repetitive planning
⬜ Approvals & statutory planning
⬜ Design deliverables planning
⬜ Pre-construction & mobilisation planning
⬜ Site logistics planning
⬜ Live-hospital interface planning
⬜ Last Planner / weekly work planning
⬜ Constraint log
⬜ Commissioning & handover planning
⬜ Portfolio planning
⬜ Planning standards & templates

PRIMAVERA P6
⬜ EPS

11. 90-DAY CURRICULUM
PLANNING THREAD (added: he is the Planning AND Project Controls manager): every week carries one planning-thinking topic alongside the controls topic — W2 planning basis, duration estimation, hospital sequencing & flow-line; W3 approvals & statutory planning (and the P6 build must come from his own planning basis); W4 look-ahead, constraint log, Last Planner/PPC; W7 resource histograms & levelling; W9 recovery planning; W11 T&C and handover planning; W12 portfolio planning across hospitals. The Phase 1 gate must include a planning-method question, not only CPM mechanics.
PHASE 1 (Days 1–30) Foundation + Planning + P6.
 Week 1 Project Controls foundation (architecture, WBS, CBS, OBS, RAM, baselines, control accounts, KPIs, control cycle, governance). Deliverable: Project Controls Framework for a hospital project.
 Week 2 Planning fundamentals (planning basis, construction method & sequencing, duration estimation, activities, relationships, CPM, float, critical path, constraints, calendars, schedule hierarchy, master, look-ahead, recovery). Deliverable: planning basis + schedule logic for a hospital block.
 Week 3 Primavera P6 (setup, EPS, OBS, WBS, activities, relationships, calendars, baselines, scheduling, data date, updating, progress). Deliverable: build and update a complete sample schedule.
 Week 4 Schedule quality + progress (health, baseline comparison, CP analysis, physical/weighted progress, S-curves, look-ahead, recovery). Deliverable: Baseline vs Current Schedule Analysis.
 PHASE 1 GATE: technical questions, schedule exercise, P6 exercise, critical-path exercise, progress exercise, manager scenario. Minimum 80% overall and no critical weakness in CPM/P6/progress.
PHASE 2 (Days 31–60) Week 5 cost control; Week 6 EVM; Week 7 procurement controls + schedule integration; Week 8 cash flow + risk. Deliverables: cost-control model, EVM analysis, procurement control dashboard, cash-flow forecast, risk register. GATE 80%: must explain what happened → why → financial impact → schedule impact → forecast → corrective action.
PHASE 3 (Days 61–90) Week 9 delay analysis + recovery; Week 10 change + commercial; Week 11 integrated controls; Week 12 management reporting + leadership + digital. Deliverables: delay analysis, recovery programme, change register, integrated dashboard, monthly report, executive presentation, digital automation concept.

12. FINAL EXAM (Day 90): fictional hospital project with budget, baseline, current schedule, progress, procurement, cost, cash flow, risks, changes, delays, vendor issues. No conclusions given. I produce: executive status, schedule analysis, CP analysis, progress, cost, EVM, procurement impact, cash-flow forecast, risk, delay, recovery strategy, management actions, executive dashboard, management presentation. Then a viva. No help during the exam.

13. FINAL RATING weights: Planning & Scheduling 20, Primavera P6 15, Progress Measurement 10, Cost Control 10, EVM 10, Procurement Controls 10, Risk & Delay 10, Reporting 5, Integrated Controls 5, Management 5. <60 Not ready; 60–69 Foundation; 70–79 Working level; 80–89 Project Controls professional; 90+ Strong PCM capability. Do not inflate.

14. DAILY SESSION FORMAT: begin with DAY X / 90, CURRENT MODULE, CURRENT OBJECTIVE, CURRICULUM POSITION, PREVIOUS STATUS, TODAY'S CHECKLIST. Teach. End with TODAY'S TEST. After answers: ASSESSMENT (score each), WEAKNESSES IDENTIFIED, CHECKLIST UPDATE, GATE STATUS, exactly what comes next.
15. UNRELATED QUESTIONS: "CURRICULUM LOCK: This is outside today's training objective. I have added it to the PARKING LOT. We will return to it after the current gate is completed." Continue.
16. SKIP REQUESTS: test first; if competent mark "EXEMPT — demonstrated competency", else stay locked.
17. BUSINESS/AI/STARTUP: record under PARKING LOT — BUSINESS / DIGITAL; discuss only if it relates to the current module.
18. AI/SOFTWARE is an accelerator, not the curriculum. I must be able to explain every output myself.
19. REAL-WORLD SITUATIONS: apply the current module but don't solve it for me. Ask: what's happening, what data, what analysis, what conclusion, what action. Then critique.
20. MASTER OBJECTIVE: I can sit in a PCM review and answer: where are we, where should we be, why different, impact, what next, forecast, risks, recovery, management decision. Optimise for competence and judgment, not lesson completion.

STARTING INSTRUCTION: Diagnostic first (Planning, Scheduling, P6, Progress, Cost, EVM, Procurement, Risk, Delay, Reporting, Management). No teaching during the diagnostic. Score honestly, identify gaps, map to curriculum, create the 90-Day Competency Baseline Checklist, then begin DAY 1 and enforce the lock. Never ask me what I want to learn next.

// ---- Feedback utilities: Haptics & Audio ----
function haptic(ok){
  try {
    if(navigator.vibrate) navigator.vibrate(ok ? 40 : [50, 40, 50]);
  } catch(e){}
}

let sharedAudioCtx = null;
function getAudioCtx(){
  try {
    if(!sharedAudioCtx && (window.AudioContext || window.webkitAudioContext)){
      sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(sharedAudioCtx && sharedAudioCtx.state === 'suspended'){
      sharedAudioCtx.resume();
    }
    return sharedAudioCtx;
  } catch(e){ return null; }
}

function playTone(type){
  try {
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    const now = ctx.currentTime;
    if(type === "pass" || type === "correct"){
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
      osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now); osc.stop(now + 0.45);
    } else if(type === "done"){
      osc.frequency.setValueAtTime(440, now); // A4
      osc.frequency.setValueAtTime(554.37, now + 0.12); // C#5
      osc.frequency.setValueAtTime(659.25, now + 0.24); // E5
      osc.frequency.setValueAtTime(880, now + 0.36); // A5
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
    } else if(type === "miss"){
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(196, now + 0.1);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e){}
}

function md(s){
  let html;
  if(window.marked&&window.DOMPurify) html=DOMPurify.sanitize(marked.parse(s,{breaks:true}));
  else { const d=document.createElement("div"); d.textContent=s; html=`<div style="white-space:pre-wrap">${d.innerHTML}</div>`; }
  const w=document.createElement("div"); w.innerHTML=html;
  w.querySelectorAll("table").forEach(t=>{ const d=document.createElement("div"); d.className="tw"; t.replaceWith(d); d.appendChild(t); });
  return w.innerHTML;
}

// ---------- applying the Director's update ----------
function applyUpdate(u, msg){
  if(!u||typeof u!=="object") return;
  const prevQ=state.question_id;
  ["day","phase","module","objective","gate"].forEach(k=>{ if(u[k]!=null&&u[k]!=="") state[k]=u[k]; });
  if(typeof u.awaiting_answers==="boolean") state.awaiting_answers=u.awaiting_answers;
  if(u.step&&STEPS.some(s=>s[0]===u.step)) state.step=u.step;
  if(u.question_id!=null){ state.question_id=String(u.question_id); if(state.question_id!==prevQ) state.attempts=0; }
  if(["teach","example","close"].includes(u.step)) state.attempts=0;
  if(u.note_to_self) state.note=String(u.note_to_self).slice(0,4000);
  (u.checklist||[]).forEach(c=>{
    if(!c.item) return;
    const dom=MASTER.find(d=>d.domain.toLowerCase()===String(c.domain||"").toLowerCase())||MASTER.find(d=>d.items.some(i=>i.toLowerCase()===String(c.item).toLowerCase()));
    if(!dom) return;
    const real=dom.items.find(i=>i.toLowerCase()===String(c.item).toLowerCase())||c.item;
    const k=key(dom.domain,real); state.items[k]={...(state.items[k]||{}),...c,domain:dom.domain,item:real};
  });
  if(u.domain_scores) Object.entries(u.domain_scores).forEach(([k,v])=>{ if(WEIGHTS[k]!=null&&typeof v==="number") state.domain_scores[k]=Math.max(0,Math.min(100,v)); });
  (u.answer_scores||[]).forEach(a=>{ if(typeof a.score==="number"&&typeof a.confidence==="number") state.calib.push({q:a.q,score:a.score,confidence:a.confidence}); });
  state.calib=state.calib.slice(-300);
  const banked=[];
  (u.bank||[]).forEach(e=>{ if(!e||!e.title||!e.rule) return; const id=String(e.id||e.title).toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,60);
    state.bank[id]={...(state.bank[id]||{}),...e,id,day:state.bank[id]?.day??state.day}; banked.push(e.title); });
  if(banked.length&&msg) msg.banked=banked;
  (u.reviews_done||[]).forEach(i=>delete state.reviews[i]);
  (u.reviews||[]).forEach(r=>{ if(r.item&&typeof r.due_in_days==="number") state.reviews[r.item]=addDays(r.due_in_days); });
  (u.parking_lot_add||[]).forEach(p=>{ if(p&&!state.parking.includes(p)) state.parking.push(p); });
  (u.patterns||[]).forEach(x=>{ if(!x||!x.id) return; const id=String(x.id).toLowerCase().replace(/[^a-z0-9]+/g,"-"); const cur=state.patterns[id]||{name:x.name||id,fix:x.fix||"",count:0};
    state.patterns[id]={...cur, name:x.name||cur.name, fix:x.fix||cur.fix, count:cur.count+(x.seen?1:0), last:x.seen?state.day:cur.last}; });
  (u.deliverables||[]).forEach(x=>{ if(x&&x.week) state.deliverables[x.week]={status:x.status||"in_progress",note:x.note||"",day:state.day}; });
  if(u.weekly_report){ state.weekly=(state.weekly||[]).filter(w=>w.day!==state.day); state.weekly.push({day:state.day,week:weekOf(state.day),text:String(u.weekly_report),t:Date.now()}); }
  if(typeof u.exam==="boolean") state.exam=u.exam;
  if(u.close_day){ state.closed=true; state.close_summary=String(u.close_day); state.step="close"; state.awaiting_answers=false; }
}

async function save(){
  if(!db) return;
  try{
    await db.doc(paths().s).set({state:JSON.stringify(state)});
    let keep=chat, body=JSON.stringify(keep);
    while(body.length>200000&&keep.length>10){ keep=keep.slice(10); body=JSON.stringify(keep); }
    const overflow=chat.slice(0,chat.length-keep.length);
    if(overflow.length){ await db.doc(`${paths().base}/archive_${Date.now()}`).set({chat:JSON.stringify(overflow)}); chat=keep; }
    await db.doc(paths().c).set({chat:body});
  }catch(e){ setStatus("Progress didn't save this turn. It will retry on your next message."); }
}
function migrate(s){
  const wasV2=s&&s.v>=2;
  const m={...fresh(),...s};
  if(!m.bank||typeof m.bank!=="object") m.bank={};
  if((!m.patterns||!Object.keys(m.patterns).length) && (s.v||0)<3){ if(m.day>=1) m.patterns={
    "milestone-semantics":{name:"Milestone semantics",fix:"Before any date, say what it is the date OF: delivery, start, finish, handover.",count:3,last:3},
    "mechanism-omission":{name:"Mechanism omission (drops the why)",fix:"Every answer gets a 'because' clause. Two-part question = two answers.",count:4,last:3},
    "retrieval-over-computation":{name:"Retrieval over computation",fix:"Show the hops. A bare number counts as a guess.",count:4,last:3},
    "overconfidence-judgment":{name:"Overconfident on judgment questions",fix:"On sentences and decisions, rate one point lower than you feel.",count:6,last:3}}; else m.patterns={}; }
  if(!wasV2){
    if(m.day>=1) SEED_BANK.forEach(e=>{ if(!m.bank[e.id]) m.bank[e.id]={...e}; });
    if(m.day>=3 && !m.closed && !m.awaiting_answers){ m.closed=true; m.step="close"; }
    m.v=2;
  }
  return m;
}
async function load(){
  if(!db) return;
  try{
    const [a,b]=await Promise.all([db.doc(paths().s).get(),db.doc(paths().c).get()]);
    const rawS=a.exists?a.data().state:null, rawC=b.exists?b.data().chat:null;
    const parsed=rawS?JSON.parse(rawS):null;
    if(parsed && (parsed.v||0)<3){
      await db.doc(`${paths().base}/backup_before_restart_${Date.now()}`).set({state:rawS, chat:rawC||"[]", note:"Full progress before the Day 0 restart"});
      state=fresh(); chat=[{role:"assistant",content:SEED,t:Date.now(),day:0}]; await save();
      setStatus("Restarted at Day 0. Your earlier progress is backed up.");
      return;
    }
    if(parsed) state=migrate(parsed);
    if(rawC){ const c=JSON.parse(rawC); if(Array.isArray(c)&&c.length) chat=c; }
  }catch(e){ setStatus("Couldn't load saved progress. Showing what's on screen."); }
}

// ---------- prompt ----------
function stateForPrompt(){
  return JSON.stringify({day:state.day, week:weekOf(state.day), phase:state.phase, module:state.module, objective:state.objective, gate:state.gate,
    step:state.step, question_id:state.question_id, awaiting_answers:state.awaiting_answers, day_closed:state.closed, close_summary:state.closed?state.close_summary:"",
    domain_scores:state.domain_scores,
    checklist_touched:Object.values(state.items).map(i=>({d:i.domain,i:i.item,s:i.status,l:i.level,sc:i.score,w:i.weakness})),
    notebook:Object.values(state.bank).map(e=>({id:e.id,title:e.title,rule:e.rule,day:e.day})),
    parking_lot:state.parking, note_to_self:state.note, today:today()});
}
function guardrails(isNew){
  const r=readiness(), gap=calibration(), due=dueList(), n=state.turns_date===today()?state.turns_today:0, wk=weekOf(state.day);
  const lines=[`AUTHORITATIVE SCORE: ${r.overall}/100 weighted (${band(r.overall)}); ${r.coverage}% of weight assessed. Quote only this figure.`,
    `CALIBRATION GAP: ${gap==null?"not enough data":(gap>0?"+":"")+gap+" points (confidence minus score)"}`,
    `RETESTS DUE: ${due.length?due.map(d=>state.bank[d]?.title?`${d} (${state.bank[d].title})`:d).join("; "):"none"}`,
    `LIBRARY FOR THIS WEEK (W${wk}): ${LIBRARY.filter(l=>l.week<=wk).map(l=>l.name).join("; ")||"none"}`,
    `SESSION BUDGET: ${n+1} of ${SESSION_BUDGET} messages today.${n+1>=SESSION_BUDGET?" Budget reached: finish the current point briefly and CLOSE THE DAY in this reply.":""}`];
  if(state.awaiting_answers && state.question_id && !isNew){
    lines.push(`ATTEMPTS ON CURRENT QUESTION (${state.question_id}): ${state.attempts+1}.${state.attempts+1>=3?" LIMIT REACHED: assess this attempt, then teach the full answer with a worked example, bank it, schedule a 2-day retest, and move on. Do not ask it again.":""}`);
  }
  const sd=Object.entries(state.selfdrill||{}).filter(([,v])=>!v.reported);
  if(sd.length){ const miss=sd.filter(([,v])=>v.r==="missed").map(([k])=>state.bank[k]?.title||k), shaky=sd.filter(([,v])=>v.r==="shaky").map(([k])=>state.bank[k]?.title||k), got=sd.filter(([,v])=>v.r==="got").length;
    lines.push(`SELF-DRILL since last session (his own rating, NOT evidence; never change checklist status from it): missed: ${miss.join("; ")||"none"} | shaky: ${shaky.join("; ")||"none"} | rated got it: ${got}. Prioritise a short cold retest of the missed ones within today's session.`); }
  lines.push(courseReport());
  const prp=practiceReport(); if(prp) lines.push(prp);
  const leech=Object.entries(state.sr||{}).filter(([,s])=>s.lapses>=2).map(([k])=>state.bank[k]?.title||k);
  if(leech.length) lines.push(`FORGOTTEN REPEATEDLY in spaced review (2+ lapses): ${leech.join("; ")}. Re-teach these from a different angle with a new example, then bank an updated card (same id).`);
  const pts=Object.entries(state.patterns||{}).map(([k,v])=>`${k} (${v.count}×)`); if(pts.length) lines.push(`ERROR PATTERNS ON FILE: ${pts.join(", ")}`);
  const dv=state.deliverables?.[wk]; lines.push(`THIS WEEK'S DELIVERABLE (W${wk}): ${dv?dv.status+(dv.note?" — "+dv.note:""):"not started"}`);
  if(state.day>0 && state.day%7===6) lines.push("Tomorrow's close is a week end: prepare the weekly_report.");
  if(state.day>0 && state.day%7===0 && !state.weekly?.some(w=>w.day===state.day)) lines.push("This session closes a week: include weekly_report when you close.");
  if(state.exam) lines.push("EXAM MODE IS ON: no hints, no teaching, no partial scoring until the exam ends.");
  if(state.closed) lines.push("The previous day is CLOSED. If this message is not [START DAY], answer briefly and point him to Start next day.");
  return lines.join("\n");
}
function decorate(m){ return `${m.conf?`[CONFIDENCE ${m.conf}/5] `:""}${m.pasted?"[PASTED] ":""}${m.content}`; }
function buildTurns(userMsg,isNew){
  const head=RULES+"\n\n"+PROTOCOL+"\n\nCURRENT STATE:\n"+stateForPrompt()+"\n\n"+guardrails(isNew)+"\n\nThe conversation follows. Stay in role.";
  const hist=chat.slice(-16).map(m=>({role:m.role,content:m.role==="assistant"?visible(m.content):decorate(m)}));
  hist.push({role:"user",content:decorate(userMsg)});
  const turns=[{role:"user",content:head}];
  hist.forEach(m=>{ const last=turns[turns.length-1]; if(last.role===m.role) last.content+="\n\n"+m.content; else turns.push({role:m.role,content:m.content}); });
  while(JSON.stringify(turns).length>62000&&turns.length>3){ turns.splice(1,2); if(turns[1]&&turns[1].role==="user"){ turns[0].content+="\n\n"+turns[1].content; turns.splice(1,1); } }
  return turns;
}

const TAG=/^\[(TEACH|EXPLAIN-BACK[^\]]*|APPLY[^\]]*|CHALLENGE|STATUS|RETEST|START DAY|REAL)\]/;
async function send(override){
  const text=(override??$("box").value).trim();
  if(!text||busy) return false;
  const isButton=TAG.test(text), isNew=isButton&&/^\[(TEACH|START DAY|STATUS|CHALLENGE|RETEST)\]/.test(text);
  if(state.awaiting_answers&&!conf&&!isButton){ setStatus("Pick how sure you are (1–5) before sending an answer."); $("conf").querySelector("button")?.focus(); return false; }
  if(!sample){ setStatus("No AI key set. Tap ⚙ (bottom right) to add one."); return false; }
  if(state.turns_date!==today()){ state.turns_date=today(); state.turns_today=0; }
  const um={role:"user",content:text,conf:isButton?null:conf,pasted,t:Date.now(),day:state.day};
  const turns=buildTurns(um,isNew);
  chat.push(um); $("log").appendChild(bubble(um,"new"));
  if(!override){ $("box").value=""; try{ localStorage.removeItem("pc:box"); }catch{} } conf=null; pasted=false; autoGrow(); renderConf();
  const pend=bubble({role:"assistant",content:""},"new"); pend.querySelector(".b").innerHTML=`<span class="thinking">The Director is working on it…</span>`;
  $("log").appendChild(pend); $("log").scrollTop=$("log").scrollHeight;
  busy=true; updateSend(); setStatus("");
  try{
    const tier = (state.awaiting_answers&&!isButton) ? "complex" : "default";
    const {text:reply,truncated}=await sample(turns,{modelTier:tier,cache:false,
      onText:({text})=>{ const v=visible(text); if(v){ const b=pend.querySelector(".b"); b.classList.add("md"); b.innerHTML=md(v); } }});
    const am={role:"assistant",content:reply,t:Date.now(),day:state.day};
    if(text.startsWith("[START DAY]")){ state.closed=false; }
    if(state.awaiting_answers&&!isButton) state.attempts++;
    state.turns_today++;
    Object.values(state.selfdrill||{}).forEach(v=>v.reported=true);
    (state.practice||[]).forEach(v=>v.reported=true);
    setOffline(false);
    const u=parseState(reply);
    const dayBefore=um.day;
    if(u){ applyUpdate(u,am); am.day=state.day; if(text.startsWith("[START DAY]")) um.day=state.day; }
    else setStatus(truncated?"Reply was cut short, so progress didn't update. Tap “Where am I?” to resync.":"Progress didn't update this turn. Tap “Where am I?” to resync.");
    chat.push(am); pend.replaceWith(bubble(am));
    renderAll(); if(state.day!==dayBefore){ showAllDays=false; renderChat(); } await save(); return true;
  }catch(e){
    pend.remove(); chat.pop(); $("log").lastChild?.remove(); if(!override){ $("box").value=text; autoGrow(); }
    if(e?.code==="rate_limited"){
      const prov = (window.localStorage ? JSON.parse(localStorage.getItem("pc:llm")||"{}").provider : "") || "AI";
      if($("offline-msg")) $("offline-msg").textContent = `${prov.toUpperCase()} quota or rate limit reached: ${e?.message || "Check your credit balance."}`;
      setOffline(true); saveBoxDraft();
    }
    setStatus(e?.message || {not_granted:"API key rejected or missing. Tap ⚙ to verify.",rate_limited:"Usage limit or insufficient credits."}[e?.code]||"The Tutor couldn't reply. Your message is back in the box.");
    return false;
  }finally{ busy=false; updateSend(); }
}
function setStatus(s){ $("status").textContent=s; }
function updateSend(){ const b=$("send"); b.disabled=busy||!$("box").value.trim(); b.textContent=busy?"Waiting…":"Send"; $("startbtn").disabled=busy; if($("sh-send")) $("sh-send").disabled=busy||$("sh-send").disabled; }
function autoGrow(){ const t=$("box"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,window.innerHeight*.4)+"px"; }
function prefill(t){ tab("chat"); $("box").value=t; autoGrow(); updateSend(); $("box").focus(); }

const QRE=/^[ \t>#*_-]*\**\s*((?:[A-H]|Q)\d{1,2})\s*[.):]/gm;
function parseQuestions(m){
  if(!m) return [];
  const t=visible(m.content), hits=[...t.matchAll(QRE)], seen=new Set(), qs=[];
  hits.forEach((h,i)=>{ const id=h[1]; if(seen.has(id)) return; seen.add(id);
    let chunk=t.slice(h.index,i+1<hits.length?hits[i+1].index:t.length).split("\n");
    while(chunk.length>1&&/^\s*(\*\*[^*]+\*\*|#{1,6}\s.*|-{3,}|)\s*$/.test(chunk[chunk.length-1])) chunk.pop();
    qs.push({id,text:chunk.join("\n").trim()}); });
  return qs.length>=2?qs:[];
}
let sheetQs=[], sheet={}, sheetKey="";
function loadDraft(){ try{ sheet=JSON.parse(localStorage.getItem(sheetKey)||"{}"); }catch{ sheet={}; } }
function saveDraft(){ try{ localStorage.setItem(sheetKey,JSON.stringify(sheet)); }catch{} }
function refreshSheetBtn(){
  let m=null; sheetQs=[];
  if(state.awaiting_answers&&!state.closed){ for(let i=chat.length-1;i>=0&&i>=chat.length-8;i--){ if(chat[i].role!=="assistant") continue; const q=parseQuestions(chat[i]); if(q.length){ m=chat[i]; sheetQs=q; break; } } }
  sheetKey="pcsheet:"+(m?.t||0); loadDraft();
  const b=$("sheetbtn"); b.classList.toggle("on",sheetQs.length>0);
  const done=sheetQs.filter(q=>sheet[q.id]?.a?.trim()).length;
  b.textContent=done?`Continue answer sheet (${done}/${sheetQs.length})`:`Open answer sheet (${sheetQs.length} questions)`;
}
function openSheet(){
  $("sh-title").textContent=`Answer sheet · ${sheetQs.length} questions`;
  const body=$("sh-body"); body.innerHTML="";
  sheetQs.forEach(q=>{
    const s=sheet[q.id]||(sheet[q.id]={a:"",c:null,p:false});
    const card=document.createElement("div"); card.className="qa"; card.innerHTML=`<div class="md">${md(q.text)}</div>`;
    const ta=document.createElement("textarea"); ta.value=s.a; ta.placeholder=`Your answer to ${q.id}. Show the hops for any number.`;
    ta.addEventListener("input",()=>{ s.a=ta.value; saveDraft(); mark(); });
    ta.addEventListener("paste",e=>{ if((e.clipboardData?.getData("text")||"").length>150){ s.p=true; saveDraft(); } });
    const cf=document.createElement("div"); cf.className="conf";
    const draw=()=>{ cf.innerHTML=`<span class="lbl">Sure?</span>`;
      [1,2,3,4,5].forEach(n=>{ const b=document.createElement("button"); b.textContent=n; b.setAttribute("aria-pressed",s.c===n); b.setAttribute("aria-label",`${q.id} confidence ${n}`); b.onclick=()=>{ s.c=s.c===n?null:n; saveDraft(); draw(); mark(); }; cf.appendChild(b); });
      const dk=document.createElement("button"); dk.className="dk"; dk.textContent="Don't know"; dk.onclick=()=>{ s.a="Don't know."; s.c=1; ta.value=s.a; saveDraft(); draw(); mark(); }; cf.appendChild(dk); };
    const mark=()=>{ card.classList.toggle("done",!!(s.a.trim()&&s.c)); count(); };
    draw(); card.appendChild(ta); card.appendChild(cf); body.appendChild(card); mark();
  });
  count(); $("sheet").classList.add("on"); body.scrollTop=0;
}
function count(){
  const ans=sheetQs.filter(q=>sheet[q.id]?.a?.trim()).length, nc=sheetQs.filter(q=>sheet[q.id]?.a?.trim()&&!sheet[q.id]?.c).length;
  $("sh-count").textContent=nc?`${ans}/${sheetQs.length} answered · ${nc} need a confidence rating`:`${ans}/${sheetQs.length} answered · blanks go as not answered`;
  $("sh-send").disabled=busy||!ans||nc>0;
}
function closeSheet(){ $("sheet").classList.remove("on"); refreshSheetBtn(); }
async function sendSheet(){
  const parts=[], cs=[]; let p=false;
  sheetQs.forEach(q=>{ const s=sheet[q.id]||{}, a=(s.a||"").trim();
    if(a){ parts.push(`${q.id} [CONFIDENCE ${s.c}/5]${s.p?" [PASTED]":""}\n${a}`); cs.push(s.c); p=p||!!s.p; } else parts.push(`${q.id}\n(not answered)`); });
  const key0=sheetKey; closeSheet();
  conf=Math.round(cs.reduce((a,b)=>a+b,0)/cs.length); pasted=p;
  if(await send("ANSWER SHEET\n\n"+parts.join("\n\n"))){ try{ localStorage.removeItem(key0); }catch{} }
}

const LESSONS = [
 {id:"L1", card:{rule:'Project Controls output = a decision request. Cycle: plan → baseline → measure → compare → forecast → act. Data date = actual before, forecast after.', example:'Planned 46%, actual 41% at data date 30 Sep → −5 pts → structure 2 weeks late → handover forecast +18 days → Director to choose second shuttering gang vs accept slip by 15 Oct.', trap:'Reporting facts with no decision request. Comparing figures "as of" different dates.'}, week:1, title:"What Project Controls actually is", drill:null, body:`**Project Management** decides and directs. **Planning** builds the plan: the activities, logic and durations. **Project Controls** runs the measurement system: it sets the baseline, measures progress against it, explains the variance, forecasts the outcome, and tells management what decision is needed.

**The control cycle** repeats every update period:
1. **Plan**: scope, schedule, budget.
2. **Baseline**: freeze the approved plan as the yardstick.
3. **Measure**: actual progress and cost up to the data date.
4. **Compare**: actual vs baseline gives the variance.
5. **Forecast**: where it finishes if nothing changes.
6. **Act**: recovery options and a decision request.

**Data date (status date):** the cut-off for an update. Everything before it is actual; everything after it is forecast. Two people reporting progress "as of" different dates are not comparing the same thing.

**Hospital example:** the monthly update for a 300-bed hospital uses a data date of 30 Sep. Planned progress was 46% and actual is 41%: the variance is −5 points. The structure is 2 weeks behind, which pushes the MEP first fix, so the forecast handover moves 18 days. The decision needed: the Director chooses between a second shuttering gang (₹X) and accepting the slip (LD ₹Y) by 15 Oct.

**PC's output is always a decision request,** not a report of facts.`},
 {id:"L2", card:{rule:'Control account = one WBS element × one OBS owner, with its own budget, schedule and measurement. Variance is explained there.', example:'WBS "MEP › HVAC" × "HVAC contractor" = CA-HVAC, ₹14 Cr, measured on installed + tested quantity. Medical equipment (client/biomedical vendor) is a separate control account.', trap:"Variance nobody owns because it can't be traced to a single control account."}, week:1, title:"WBS, CBS, OBS, RAM, control accounts", drill:null, body:`- **WBS** (Work Breakdown Structure): *what* is delivered, broken into deliverables. It must cover 100% of scope.
- **CBS** (Cost Breakdown Structure): *how the money is coded*: cost codes, often mapped to BOQ sections.
- **OBS** (Organisation Breakdown Structure): *who* is responsible: PMC, contractor, biomedical vendor, client.
- **RAM** (Responsibility Assignment Matrix): WBS × OBS. Each cell names who owns that deliverable.
- **Control account**: where one WBS element meets one OBS owner. It carries its own budget, schedule and progress measurement, and it is the level at which variance is explained.
- **Work package**: the lowest WBS level, where the work is planned and measured.

**Hospital example:** WBS "MEP › HVAC" × OBS "HVAC contractor" = control account **CA-HVAC**, budget ₹14 Cr, measured on installed-and-tested quantities, owned by the contractor's PM and verified by the PMC MEP engineer. "Medical equipment" × "client / biomedical vendor" is a *separate* control account, because it has different money, a different party and a different progress story.

**Why it matters:** if a variance can't be traced to one control account, nobody owns it, and nothing gets fixed.`},
 {id:"L3", card:{rule:'Variance = forecast vs BASELINE. The baseline moves only by change control; a recovery schedule is a proposal until approved.', example:'OT block baseline 15 Mar, forecast 2 Apr = 18 days late. Recovery plan with a night shift gives 6 Mar. The baseline stays 15 Mar.', trap:'Overwriting the baseline every month, so the project is never late on paper.'}, week:1, title:"Baseline, current, forecast, recovery", drill:null, body:`- **Baseline schedule**: the approved plan, frozen. It never moves except through formal change control (a re-baseline).
- **Current schedule / update**: the baseline with actuals entered up to the data date, and remaining work re-forecast.
- **Forecast**: the dates the current schedule now predicts.
- **Recovery schedule**: a revised plan showing *how* you'll close a gap: added resources, re-sequencing, overtime. It's a proposal until approved.

**Rule:** variance is always **forecast vs baseline**. If people overwrite the baseline every month, the project is never late on paper and always late on site.

**Hospital example:** the baseline has OT block handover on 15 Mar. The September update forecasts 2 Apr, a 18-day variance. The recovery schedule shows 6 Mar if a night shift is added to the modular OT panels. Management approves the recovery. The baseline stays at 15 Mar; the recovery becomes the target you track.`},
 {id:"L4", card:{rule:'FS for ≥ 90% of logic; SS/FF with positive lags for overlaps; no leads; constraints ≤ 5%. Durations in working days on a named calendar.', example:'Ceiling grid SS+5 after ducting starts; painting FF+3 after ceiling finishes; slab curing FS+7. 25 working days on a 6-day week ≈ 29 calendar days.', trap:'Not saying working vs calendar days. Not saying what a date is the date OF.'}, week:2, title:"Activities, relationships, lags, constraints, calendars", drill:null, body:`**Relationships** (predecessor → successor):
- **FS (finish-to-start)**: B starts after A finishes. Most logic (aim ≥ 90%).
- **SS (start-to-start)**: B starts after A starts. "Start ceiling grid 5 days after ducting starts" = SS+5.
- **FF (finish-to-finish)**: B finishes after A finishes. "Painting finishes 3 days after ceiling finishes" = FF+3.
- **SF (start-to-finish)**: rare; avoid.

**Lag** = a forced wait, e.g. 7 days of slab curing (FS+7). **Lead** = a negative lag; avoid it (the DCMA check expects 0), and use SS with a positive lag instead.

**Constraints** override logic. *Soft* constraints ("start no earlier than") limit how early an activity can go. *Hard* ones ("must finish on") can create negative float. Keep them under 5% of activities.

**Calendars:** durations count working days on the activity's calendar. A 6-day site week makes 25 working days ≈ 29 calendar days. Always say which you mean, and what a date is the date **of**: delivery, start, finish or handover.

**Milestone:** zero duration. It marks an event, such as "AHU delivered to site" or "OT handed over".`},
 {id:"L5", card:{rule:'Forward pass: ES = latest of the predecessor constraints (FS: EF+lag; SS: ES+lag; FF: EF+lag−own dur); EF = ES + dur.', example:'A 0→4; B 4→10; C 10→15; D ES = 4+2 = 6 → 13; E ES = max(15, 13) = 15 → 18. Duration 18.', trap:'Taking the min instead of the max at a merge in the forward pass.'}, week:2, title:"CPM forward pass", drill:"cpm", body:`**Forward pass** = earliest dates. It moves left to right.
- **ES** (early start) = the latest of the constraints from all predecessors. Start activities have ES = 0.
  - FS: ES ≥ pred EF + lag
  - SS: ES ≥ pred ES + lag
  - FF: ES ≥ pred EF + lag − own duration
- **EF** (early finish) = ES + duration

Convention: day numbers count from 0. ES = 0 means "starts at the beginning of day 1"; EF = 4 means "finishes at the end of day 4".

**Worked example** (foundation package, working days):

| ID | Activity | Dur | Pred |
|---|---|---|---|
| A | Excavation | 4 | — |
| B | PCC & footings | 6 | A FS |
| C | Plinth beam | 5 | B FS |
| D | Underground drainage | 7 | A FS+2 |
| E | Backfilling | 3 | C FS, D FS |

Hops:
- A: ES 0 → EF 0+4 = **4**
- B: ES = A.EF 4 → EF 4+6 = **10**
- C: ES = B.EF 10 → EF 10+5 = **15**
- D: ES = A.EF 4 + lag 2 = 6 → EF 6+7 = **13**
- E: ES = max(C.EF 15, D.EF 13) = 15 → EF 15+3 = **18**

**Project duration = 18 working days.** E waited for C, not D: that's the first clue to the critical path.`},
 {id:"L6", card:{rule:'Backward pass: LF = earliest of the successor constraints; LS = LF − dur; TF = LS − ES. Take the MIN at a burst.', example:'E LF 18 → LS 15; C LF 15 → LS 10; D LF 15 → LS 8; B LF 10 → LS 4; A LF = min(4, 8−2 = 6) = 4. TF of D = 2; critical path A–B–C–E.', trap:'Taking the max at a burst. Forgetting to subtract the lag going backward.'}, week:2, title:"Backward pass and total float", drill:"cpm", body:`**Backward pass** = latest dates without moving the project finish. It moves right to left.
- Last activity: **LF** (late finish) = project finish.
- **LF** = the earliest of the constraints from all successors:
  - FS: LF ≤ succ LS − lag
  - SS: LF ≤ succ LS − lag + own duration
  - FF: LF ≤ succ LF − lag
- **LS** (late start) = LF − duration
- **Total float (TF)** = LS − ES = LF − EF

**Same example:**
- E: LF 18 → LS 15
- C: LF = E.LS 15 → LS 10
- D: LF = E.LS 15 → LS 8
- B: LF = C.LS 10 → LS 4
- A: LF = min(B.LS 4, D.LS 8 − lag 2 = 6) = **4** → LS 0

| | A | B | C | D | E |
|---|---|---|---|---|---|
| TF | 0 | 0 | 0 | **2** | 0 |

**Critical path: A–B–C–E** (TF = 0, the longest path). Drainage can slip 2 days before the end date moves.

**Trap:** at a merge (A has two successors), take the **minimum**. Taking the max is the most common backward-pass error.`},
 {id:"L7", card:{rule:"TF = slip before the PROJECT FINISH moves; FF = slip before any SUCCESSOR's early start moves; FF ≤ TF. Negative float = forecast later than a required date.", example:"D: EF 13, E ES 15 → FF 2 = TF 2. Add waterproofing after D and D's FF becomes 0 while its TF stays 2: the float is shared.", trap:'Treating float as banked time. (Redeploying crews off float-rich work IS valid.)'}, week:2, title:"Free float, critical, near-critical, negative float", drill:"cpm", body:`- **Total float**: how far an activity can slip before the **project finish** moves.
- **Free float (FF)**: how far it can slip before **any successor's early start** moves. FF = successor ES − lag − own EF, taking the minimum over all successors.
- FF ≤ TF always. If FF = 0 but TF > 0, the float belongs to the whole path: using it here takes it from the activities after.

**Example:** D (drainage) has EF 13 and E has ES 15, so FF = 2 = TF. But if D were followed by "Waterproofing" (2 days) before E, D's free float would be 0 while its TF stays 2. The two activities *share* those 2 days.

- **Critical path**: the longest path; with no constraints, TF = 0.
- **Near-critical**: a small TF (say ≤ 10 working days) or float falling fast. Watch the **rate**, not just the level.
- **Negative float**: the forecast finish is later than a required date (a contractual handover constraint). TF = −12 means 12 days must be recovered.

**Using float is not a crime:** moving a crew off a float-rich path onto critical work is a valid recovery move. What you cannot do is bank float or transfer it as time.`},
 {id:"L8", card:{rule:'L1–L3 master (against the baseline); L4 three-week look-ahead whose job is constraint removal; recovery schedule = costed options.', example:'Look-ahead: OT-2 ceiling closure in week 3, medical gas pressure test not booked = a constraint. Remove it this week.', trap:'Using the look-ahead as a forecast instead of a commitment-and-constraint tool.'}, week:2, title:"Schedule levels and the look-ahead", drill:null, body:`**Levels** (AACE 37R-06):
- **L1**: one-page milestone summary (board, client).
- **L2**: area or system summary (COO, client PM).
- **L3**: the CPM control schedule (planning).
- **L4**: execution detail per trade (site).
- **L5**: day-by-day task detail.

**Master schedule** = L1–L3, held against the baseline. **3-week look-ahead** = L4, rolling. Its job is **constraint removal**: before work starts, confirm drawings approved, material on site, manpower mobilised, permits in place, and the area handed over. It is owned by site execution and the contractors, and checked by planning.

**Recovery schedule** = the specific plan to close a gap, with costed options (expedite, substitute, re-sequence, absorb, accept).

**Hospital example:** the look-ahead shows OT-2 ceiling closure in week 3, but the medical gas pressure test isn't booked. That's a constraint. Remove it this week, or the ceiling date is fiction.`},

const ACT_POOL=["Site mobilisation","Excavation","PCC & footings","Plinth beam","Underground drainage","Backfilling","Ground-floor slab","Columns GF","First-floor slab","Blockwork","Electrical conduiting","HVAC ducting","Sprinkler piping","Plumbing rough-in","Medical gas piping","Gypsum ceiling","Flooring","Painting","AHU installation","OT modular panels","Testing & commissioning"];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

function cpm(acts){
  const n=acts.length, by={}; acts.forEach(a=>by[a.id]=a);
  acts.forEach(a=>a.succ=[]); acts.forEach(a=>a.pred.forEach(p=>by[p.id].succ.push({id:a.id,type:p.type,lag:p.lag})));
  const fwd=[], bwd=[];
  acts.forEach(a=>{
    let es=0, parts=[];
    a.pred.forEach(p=>{ const P=by[p.id]; let v,txt;
      if(p.type==="FS"){ v=P.ef+p.lag; txt=`${P.id}.EF ${P.ef}${p.lag?` + ${p.lag}`:""}`; }
      else if(p.type==="SS"){ v=P.es+p.lag; txt=`${P.id}.ES ${P.es} + ${p.lag} (SS)`; }
      else { v=P.ef+p.lag-a.dur; txt=`${P.id}.EF ${P.ef}${p.lag?` + ${p.lag}`:""} − ${a.dur} (FF)`; }
      parts.push({v,txt}); es=Math.max(es,v); });
    a.es=Math.max(0,es); a.ef=a.es+a.dur;
    fwd.push(`**${a.id}**: ES = ${parts.length?(parts.length>1?`max(${parts.map(x=>`${x.txt} = ${x.v}`).join(", ")})`:`${parts[0].txt} = ${parts[0].v}`):"0 (start)"}${parts.length&&a.es!==es?" → 0":""} → EF ${a.es} + ${a.dur} = **${a.ef}**`);
  });
  const pf=Math.max(...acts.map(a=>a.ef));
  [...acts].reverse().forEach(a=>{
    let lf=pf, parts=[];
    a.succ.forEach(s=>{ const S=by[s.id]; let v,txt;
      if(s.type==="FS"){ v=S.ls-s.lag; txt=`${S.id}.LS ${S.ls}${s.lag?` − ${s.lag}`:""}`; }
      else if(s.type==="SS"){ v=S.ls-s.lag+a.dur; txt=`${S.id}.LS ${S.ls} − ${s.lag} + ${a.dur} (SS)`; }
      else { v=S.lf-s.lag; txt=`${S.id}.LF ${S.lf}${s.lag?` − ${s.lag}`:""} (FF)`; }
      parts.push({v,txt}); lf=Math.min(lf,v); });
    a.lf=lf; a.ls=a.lf-a.dur; a.tf=a.lf-a.ef;
    bwd.push(`**${a.id}**: LF = ${parts.length?(parts.length>1?`min(${parts.map(x=>`${x.txt} = ${x.v}`).join(", ")})`:`${parts[0].txt} = ${parts[0].v}`):`project finish ${pf}`} → LS ${a.lf} − ${a.dur} = **${a.ls}** · TF ${a.ls} − ${a.es} = **${a.tf}**`);
  });
  acts.forEach(a=>{
    if(!a.succ.length){ a.ff=pf-a.ef; return; }
    a.ff=Math.min(pf-a.ef, ...a.succ.map(s=>{ const S=by[s.id]; return s.type==="FS"?S.es-s.lag-a.ef : s.type==="SS"?S.es-s.lag-a.es : S.ef-s.lag-a.ef; }));
    a.ff=Math.max(0,a.ff);
  });
  return {pf, fwd, bwd:bwd.reverse(), crit:acts.filter(a=>a.tf===0).map(a=>a.id)};
}
function genCPM(level){
  const n=level===1?6:level===2?7:8;
  let idx=[...ACT_POOL.keys()].sort(()=>Math.random()-.5).slice(0,n-1).sort((a,b)=>a-b);
  const names=[...idx.map(i=>ACT_POOL[i]).filter(x=>x!=="Testing & commissioning")];
  while(names.length<n-1) names.push(pick(["Snagging","Signage","Façade glazing"]));
  names.push("Testing & commissioning");
  const acts=names.map((nm,i)=>({id:String.fromCharCode(65+i),name:nm,dur:i===n-1?rnd(3,6):rnd(2,14),pred:[]}));
  const rel=()=>{ if(level<3) return {type:"FS",lag:level===2&&Math.random()<.35?rnd(1,4):0};
    const r=Math.random(); return r<.3?{type:"SS",lag:rnd(2,5)}:r<.45?{type:"FF",lag:rnd(0,3)}:{type:"FS",lag:Math.random()<.3?rnd(1,3):0}; };
  for(let j=1;j<n-1;j++){
    const k=Math.random()<.4&&j>1?2:1, cand=[...Array(j).keys()].sort((a,b)=>(b-a)+Math.random()*2-1).slice(0,Math.min(j,3));
    [...new Set(cand.slice(0,k))].forEach(i=>acts[j].pred.push({id:acts[i].id,...rel()}));
  }
  const hasSucc=new Set(); acts.forEach(a=>a.pred.forEach(p=>hasSucc.add(p.id)));
  acts.slice(0,n-1).forEach(a=>{ if(!hasSucc.has(a.id)) acts[n-1].pred.push({id:a.id,type:"FS",lag:0}); });
  if(!acts[n-1].pred.length) acts[n-1].pred.push({id:acts[n-2].id,type:"FS",lag:0});
  const sol=cpm(acts);
  if(!acts.some(a=>a.tf>0) && Math.random()<.85) return genCPM(level);
  const nonCrit=acts.filter(a=>a.tf>0), others=acts.filter(a=>a.tf===0&&a.pred.length);
  const ask=[...(nonCrit.length?[pick(nonCrit)]:[]), ...others.sort(()=>Math.random()-.5)].filter((v,i,s)=>s.indexOf(v)===i).slice(0,3).sort((a,b)=>a.id.localeCompare(b.id));
  return {type:"cpm", level, acts, sol, ask:ask.map(a=>a.id)};
}

const D0=d=>{ const x=new Date(d); return new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate())); };
const iso=d=>d.toISOString().slice(0,10);

function subWorking(d,n){ let x=d, c=0; while(c<n){ x=addC(x,-1); if(x.getUTCDay()!==0) c++; } return x; }
function genProc(){
  const t=D0(new Date()); let need=addC(t,rnd(85,150)); if(need.getUTCDay()===0) need=addC(need,1);
  const item=pick([["AHU (air handling unit)",[60,80]],["Chiller",[75,100]],["Modular OT panels",[45,65]],["DG set",[50,70]],["Medical gas manifold",[40,60]],["Transformer",[70,95]]]);
  const T=rnd(5,12), M=rnd(...item[1]), N=rnd(12,24);
  const ex=addC(need,-T), po=addC(ex,-M), ind=subWorking(po,N), margin=Math.round((ind-t)/864e5);
  return {type:"proc", item:item[0], today:iso(t), need:iso(need), T, M, N, ans:{ex:iso(ex),po:iso(po),ind:iso(ind),margin}};
}
function genFloat(){
  const t0=rnd(20,34), l1=rnd(2,4), acc=Math.random()<.65, l2=l1+(acc?rnd(1,2):0), l3=l2+(acc?rnd(1,3):rnd(-1,0));
  const s=[t0,t0-l1,t0-l1-l2,t0-l1-l2-l3];
  if(s[3]<=2) return genFloat();
  return {type:"float", act:pick(["External drainage","Façade glazing","STP civil works","Landscape & roads","Lift installation","Fire tank & pump room"]), series:s,
    ans:{last:l3, avg:+((t0-s[3])/3).toFixed(1), left:Math.ceil(s[3]/l3), acc:(l3>l2&&l2>l1)?"yes":"no"}};
}
function genWeighted(){
  let w=[rnd(25,45),rnd(25,45),rnd(8,20)]; w.push(100-w[0]-w[1]-w[2]); if(w[3]<5) return genWeighted();
  const names=["Civil & structure","MEP services","Interiors & finishes","Medical gas & OT"], p=[rnd(55,95),rnd(10,60),rnd(0,35),rnd(0,40)];
  const overall=+(w.reduce((a,x,i)=>a+x*p[i]/100,0)).toFixed(1), best=names[w.indexOf(Math.max(...w))];
  return {type:"weighted", names, w, p, ans:{overall, best}};
}
function genQty(){
  const boq=rnd(15,40)*100, iss=Math.round(boq*rnd(60,85)/100/10)*10, ins=Math.round(iss*rnd(70,90)/100/10)*10, tst=Math.round(ins*rnd(40,80)/100/10)*10;

}

     <p style="color:var(--muted);font-size:.84rem">To subtract working days, step back one day at a time and count only Mon–Sat.</p>
