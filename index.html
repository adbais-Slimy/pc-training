 {id:"U12",day:12,title:"Required dates and negative float",mins:25,
  card:{id:"c-negfloat",title:"Negative float = days to recover to meet a required date",rule:"If the required finish (the contract date) is earlier than the forward-pass finish, run the backward pass from the required date. Critical activities then show negative float equal to the gap. Recover by crashing, fast-tracking, re-sequencing or scope, or by agreeing an EOT.",example:"Office fit-out: forward finish at mark 60, contract handover at mark 52 → TF −8 on the critical path. An activity that had 6 days of float now has −2.",trap:"Deleting the required date to make the negative float disappear; reporting 'on track' while the TF is negative."},
  screens:[
  {k:"read",t:`**Why it matters.** The client's contract for an office fit-out says *handover 31 Mar*. Your schedule's forward pass says *12 Apr*. The gap doesn't go away by ignoring it. It shows up as **negative float**, and it tells you exactly how many days you have to find.`},
  {k:"read",t:`**How it works, with marks:**
- Forward pass: the earliest finish is at **mark 60**.
- Contract handover is at **mark 52**.
- Run the backward pass from **52** instead of 60. Every LF and LS comes out 8 lower.
- Critical activities: TF = LS − ES = **−8**. You need to recover 8 working days.
- An activity that had **+6** float now has 6 − 8 = **−2**. It also needs 2 days, unless the critical path is fixed first.

**Read negative float as a to-do list:** it's how many days each path is short.`},
  {k:"read",t:`**Recovery options** (each costs something, so price them):
- **Crash**: add resources to shorten critical activities (overtime, a second gang). Costs money.
- **Fast-track**: overlap activities that were sequential (FS → SS). Costs risk: rework if the earlier work changes.
- **Re-sequence**: do things in a different order, or split zones.
- **Scope / phasing**: hand over in phases (floors 1–4 first).
- **EOT**: if the delay is the client's, request an extension of time, with the evidence.

**Never** delete the required date to make the red disappear. That's hiding, not planning.`},
  {k:"quiz",bank:[
   {q:"Forward-pass finish at mark 60; contract handover at mark 52. What is the total float on the critical path?",o:[["−8",true,"52 − 60 = −8: eight days to recover."],["+8",false,"The required date is EARLIER than possible, so the float is negative."],["0",false,"Only if the required date equals the forward finish."],["52",false,"That's the required mark, not the float."]]},
   {q:"An activity had +6 float. The required date is 8 days earlier than the forward finish. Its new float?",o:[["−2",true,"6 − 8 = −2."],["+6",false,"The required date pulls every late date earlier by 8."],["−8",false,"Only the zero-float path goes to −8."],["+14",false,"Subtract, don't add."]]},
   {q:"What is 'fast-tracking'?",o:[["Overlapping activities that were in sequence (e.g. FS → SS)",true,"It saves time but risks rework."],["Adding more crews",false,"That's crashing."],["Cutting scope",false,"That's a scope change."],["Asking for an EOT",false,"That's contractual."]]},
   {q:"What is 'crashing'?",o:[["Adding resources to shorten critical activities, at extra cost",true,"Overtime, extra gangs, more equipment."],["Overlapping activities",false,"That's fast-tracking."],["Removing the constraint",false,"That hides the problem."],["Splitting the project",false,"That's phasing."]]},
   {q:"The schedule shows TF −8. A site engineer suggests deleting the contract date 'to clean up the red'. What do you say?",o:[["Fine, the red is distracting",false,"That hides an 8-day problem from management."],["No: the −8 is real; we price recovery options or build an EOT case",true,"Negative float is information. Act on it."],["Change the durations until it's 0",false,"Fiddling durations without a method is fiction."],["Report 'on track'",false,"Untrue."]]},
   {q:"A residential tower is 8 days short of handover. Which option recovers time with the least risk of rework?",o:[["Crashing the critical finishing trades with extra gangs (if there's room for them)",true,"It costs money, but it doesn't overlap dependent work."],["Fast-tracking waterproofing over unfinished slabs",false,"High rework risk."],["Deleting snagging",false,"That just moves the problem to after handover."],["Ignore it, things usually catch up",false,"Hope isn't a plan."]]}]},
  {k:"explain",p:"In two sentences to your COO: what does 'TF −8 on the critical path' mean, and what are the two recovery options you'd price first?"},
  {k:"done"}]},

 {id:"U13",day:13,title:"Near-critical paths and float erosion",mins:25,
  card:{id:"c-nearcrit",title:"Watch near-critical paths and the float trend",rule:"Near-critical = small float (about 10 working days or less) or float falling fast. Report the level AND the rate; external works often turn critical late because they gate occupancy.",example:"STP & external drainage: float 22 → 15 → 9 over three updates → falling 6–7 a month → critical within about 2 months. Occupancy needs the STP.",trap:"Watching only zero-float activities; letting external works drift because 'they're at the end'."},
  screens:[
  {k:"read",t:`**Why it matters.** Most surprises don't come from the critical path. Everyone watches that one. They come from the path **next to it**.

**Classic case:** on hospitals, commercial buildings and residential towers alike, the **external works** (STP, external drainage, roads, compound wall, landscaping) sit at the end with lots of float. Nobody watches them. Then the occupancy certificate needs the STP and fire tender access roads, and they've quietly become critical.`},
  {k:"read",t:`**Near-critical:** float of about **10 working days or less** (scale this to the project length), **or** float falling fast.

**Float erosion:** compare float update by update.
- STP and external drainage: TF **22 → 15 → 9** working days over three monthly updates
- Lost 7, then 6: about **6–7 a month**
- At 6 a month, 9 lasts about **1.5 months**, so it's critical in the update after next

**Report it like this:** *"STP/external drainage: TF 9 WD, falling about 6/month. Critical in about 2 months. Gates occupancy (OC). Action: mobilise the drainage contractor now."*`},
  {k:"drill",id:"float",t:"Read float trends. New numbers every time."},
  {k:"quiz",bank:[
   {q:"Which counts as near-critical?",o:[["Float 7 WD, or float falling fast",true,"Small float, or a fast-falling trend."],["Only float 0",false,"That's critical, not near-critical."],["Float 60 WD, steady",false,"Plenty of buffer."],["Any MEP activity",false,"Trade doesn't decide it; float does."]]},
   {q:"External drainage float: 22 → 15 → 9 over three monthly updates. Roughly when does it go critical if the trend holds?",o:[["In about 1–2 months",true,"Losing 6–7 a month, 9 days lasts about 1.5 months."],["Never, it still has float",false,"The trend says it soon won't."],["In 9 months",false,"It's losing several days a month, not one."],["It's already critical",false,"Not yet: TF is 9."]]},
   {q:"Why do external works often become critical late?",o:[["They sit at the end with apparent float, nobody watches them, and occupancy depends on them",true,"OC needs the STP, fire access and drainage."],["They're always slow",false,"Not the reason."],["Clients don't care about them",false,"Clients can't occupy without them."],["P6 can't schedule them",false,"It can."]]},
   {q:"What is the best weekly report line for a near-critical path?",o:[["'STP fine, has float.'",false,"No trend, no action."],["'STP/drainage: TF 9 WD, falling ~6/month; critical in ~2 months; gates OC; mobilise the drainage contractor now.'",true,"Level, rate, consequence, action."],["'Drainage delayed.'",false,"How much? So what?"],["'Float 9.'",false,"Missing the trend and the action."]]},
   {q:"Two paths: A has TF 4, steady for 3 months. B has TF 12, falling 5 a month. Which needs attention first?",o:[["B: it'll pass A in about 2 months, and it's heading for critical",true,"The trend matters as much as the level."],["A, because 4 < 12",false,"A is stable; B is collapsing."],["Neither",false,"Both need watching."],["Only the critical path matters",false,"The near-critical one is where the surprise comes from."]]}]},
  {k:"explain",p:"Explain why 'float 9 days' is not enough information on its own, using an external-works example."},
  {k:"done"}]},

 {id:"U14",day:14,title:"Schedule levels and the look-ahead",mins:30,
  card:{id:"c-lookahead",title:"Master for control, look-ahead for constraint removal",rule:"L1–L3 master = control against the baseline. A 3–6 week look-ahead (L4) screens every task for its constraints (drawings, material, manpower, access, permits, predecessor work). Only constraint-free work enters the weekly plan. PPC measures how reliable the plan is.",example:"Residential tower, floor 12 flooring next week: tiles approved? on site? the waterproofing test done? lift slot booked? Only then commit it.",trap:"Copying the master schedule into the look-ahead without screening constraints."},
  screens:[
  {k:"read",t:`**Why it matters.** The master schedule says *"Floor 12 flooring: weeks 30–32"*. On Monday of week 30, the crew arrives and the tiles aren't approved. The master schedule was right about **when**; nobody checked **whether the work was ready**.

**Levels:** L1 one-page milestones (board) → L2 summary (COO) → L3 CPM control (planning) → **L4 look-ahead** (site, 3–6 weeks) → L5 daily tasks.`},
  {k:"read",t:`**The look-ahead's real job: constraint removal**

For each task coming up in the next 3–6 weeks, check:
1. **Drawings** approved (the right revision)?
2. **Material** approved and on site?
3. **Manpower** and **equipment** booked?
4. **Access / area** handed over? **Permits** (hot work, shutdowns)?
5. **Predecessor** work finished and inspected?

Any "no" goes in the **constraint log** with an owner and a removal date. Only constraint-free tasks go into the **weekly work plan**.

**PPC (percent plan complete)** = tasks completed ÷ tasks committed. Below about 80% means the near-term dates aren't believable.`},
  {k:"drill",id:"ppc",t:"Weekly plan reliability. Work out PPC and pick the reason to fix first."},
  {k:"quiz",bank:[
   {q:"What is the 3-week look-ahead mainly for?",o:[["Removing constraints so the work is actually ready to start",true,"Drawings, material, manpower, access, permits, predecessors."],["Re-baselining",false,"That's change control."],["Reporting to the board",false,"That's L1."],["Copying the master",false,"Copying without screening is the usual failure."]]},
   {q:"30 tasks committed, 21 completed. What's the PPC?",o:[["70%",true,"21 ÷ 30 = 70%."],["30%",false,"That's the share missed."],["21%",false,"Divide by 30."],["90%",false,"Recount: 21 ÷ 30."]]},
   {q:"The top reason for misses is 'drawings not approved'. Where's the fix?",o:[["Upstream: design coordination and the look-ahead screening, 2–3 weeks earlier",true,"It's a constraint that should have been caught before the week."],["Push the site crew harder",false,"The crew couldn't work without drawings."],["Lower the PPC target",false,"That hides it."],["Add manpower",false,"Manpower wasn't the constraint."]]},
   {q:"Which level does the COO usually need?",o:[["L1–L2 summary with key milestones",true,"Management needs the summary and the decisions."],["L5 daily tasks",false,"Far too detailed."],["The raw P6 file",false,"Not readable at that level."],["Only the look-ahead",false,"That's for the site."]]},
   {q:"Floor 12 flooring is in next week's plan. Which check comes FIRST?",o:[["Are the tiles approved and on site, and is the waterproofing test signed off?",true,"Material and predecessor work are the classic constraints."],["Is the painter booked?",false,"Not relevant to flooring."],["Is the board meeting scheduled?",false,"Not relevant."],["Is the baseline frozen?",false,"Important, but not a constraint on this task."]]}]},
  {k:"explain",p:"Explain the difference between the master schedule and the look-ahead to a site engineer, in two sentences."},
  {k:"done"}]},

 {id:"U15",day:15,title:"Repetitive and linear work: floors and road chainages",mins:30,
  card:{id:"c-flow",title:"Flow-line: the slowest trade sets the pace",rule:"For repeated units (floors, flats, road sections) each trade moves unit by unit. Trade j in unit f starts when it has finished unit f−1 AND the previous trade has finished unit f (+ buffer). The slowest trade sets the pace; balance crews to it.",example:"Road in 200 m sections: excavation 3 d/section, sub-base 4, base 4, kerbs 2, asphalt 2. Sub-base/base set the pace; asphalt crews idle unless sized down or batched.",trap:"Planning each floor or section as an isolated lump, so trades collide or sit idle."},
  screens:[
  {k:"read",t:`**Why it matters.** A lot of work repeats:
- **Residential tower**: 20 identical floors
- **Hospital ward block**: repeated ward floors
- **Road / external works**: the same sequence every 200 m (chainage sections)

A normal bar chart hides the real problem here: **trades running into each other or waiting**. A flow-line shows it.`},
  {k:"read",t:`**Road example, 5 sections of 200 m each:**

| Trade | Days per section |
|---|---|
| Excavation | 3 |
| Sub-base | 4 |
| Base course | 4 |
| Kerbs | 2 |
| Asphalt | 2 |

**Rule:** a trade starts a section when (a) it has finished the previous section, **and** (b) the trade before it has finished this section (plus any buffer).

Sub-base and base, at 4 days each, are the **bottleneck**. Excavation races ahead; kerbs and asphalt catch up and wait. **Fix:** a second sub-base crew, or fewer kerb and asphalt crews so they don't sit idle (asphalt is often done in one batch at the end).`},
  {k:"drill",id:"flowline",t:"Floors and buffers. Find the overall finish and the bottleneck."},
  {k:"quiz",bank:[
   {q:"In flow-line planning, what sets the overall pace?",o:[["The slowest trade",true,"The others either wait behind it or race ahead and stop."],["The fastest trade",false,"Fast trades end up idle."],["The first trade",false,"Only if it's the slowest."],["The number of floors only",false,"Floors multiply the bottleneck's rate."]]},
   {q:"Road sections: excavation 3 d/section, sub-base 4, kerbs 2. Where do you add a crew first?",o:[["Sub-base",true,"It's the slowest and gates everything after it."],["Kerbs",false,"Already the fastest. It'll just wait."],["Excavation",false,"Running further ahead doesn't help."],["None",false,"The bottleneck needs help."]]},
   {q:"Why add a buffer (e.g. 1 day) between trades on the same floor?",o:[["To absorb small slips, so one trade's delay doesn't stop the next",true,"Buffers protect the flow."],["To make the schedule longer",false,"That's a side-effect, not the purpose."],["Because software needs it",false,"No."],["For the client's approval",false,"No."]]},
   {q:"The kerb crew keeps waiting for base-course sections. Best fix?",o:[["Slow the kerb crew down (fewer men) or start it later, so it flows without waiting",true,"Match it to the bottleneck's pace and cut idle cost."],["Add more kerb crews",false,"That makes the waiting worse."],["Ignore it",false,"Idle crews cost money."],["Remove the base course",false,"Not possible."]]},
   {q:"Which projects suit flow-line planning best?",o:[["Towers with identical floors, repeated ward floors, roads and pipelines by section",true,"Repetitive units."],["A one-off substation",false,"Not repetitive."],["A single-room fit-out",false,"Too small."],["Design approvals",false,"Not physical repetition."]]}]},
  {k:"explain",p:"Explain the bottleneck idea using a road or a residential tower, and say what you'd do about the fast trades."},
  {k:"done"}]},

 {id:"U16",day:16,title:"Resources: histograms and levelling",mins:25,
  card:{id:"c-histogram",title:"Add crews day by day; level with float",rule:"Daily crew = man-days ÷ duration. Add overlapping activities day by day to get the histogram; the peak drives camp, supervision and safety. Level by moving activities that have float, which flattens the peak without moving the finish.",example:"External works: paving 6/day d0–9, kerbing 4/day d4–13, drainage 5/day d6–15 → peak 15 on d6–9. Move kerbing (float 6) to start after paving → peak 11.",trap:"Planning each trade's manpower alone; levelling critical activities (which moves the finish)."},
  screens:[
  {k:"read",t:`**Why it matters.** Your schedule can be perfectly logical and still impossible, because on day 40 it needs **95 workers** and your labour camp holds 60. The **histogram** shows that before it happens.

**Method:**
- Daily crew for each activity = man-days ÷ duration
- Add up every activity working on each day = the **histogram**
- The **peak** drives camp size, supervisors (often 1 per 15–20 workers), safety staff, toilets, hoists and workface`},
  {k:"read",t:`**External works example** (working days):
- Paving: 60 man-days over 10 days = **6/day**, days 0–9
- Kerbing: 40 over 10 = **4/day**, days 4–13 (float 6)
- Drainage: 50 over 10 = **5/day**, days 6–15

Days 6–9 carry all three: **6 + 4 + 5 = 15 workers**.

**Levelling:** move kerbing, which has float, to start at day 10, after paving. Days 6–9 now carry 6 + 5 = **11**, days 10–15 carry 4 + 5 = 9. The peak drops to **11**, and the finish doesn't move because kerbing used its own float.

**Never level critical activities to flatten a peak.** That moves the finish.`},
  {k:"drill",id:"manpower",t:"Find the peak and when it happens."},
  {k:"quiz",bank:[
   {q:"An activity is 48 man-days over 8 days. What's the daily crew?",o:[["6",true,"48 ÷ 8 = 6."],["384",false,"Divide, don't multiply."],["8",false,"That's the duration."],["40",false,"48 − 8 isn't the method."]]},
   {q:"Day 7 has paving 6, kerbing 4 and drainage 5 all working. What's the headcount that day?",o:[["15",true,"6 + 4 + 5."],["6",false,"Add up everything working that day."],["5",false,"Add them up."],["10",false,"Recount."]]},
   {q:"Which activity do you move to flatten a peak?",o:[["One with float, moved within its float",true,"The peak flattens and the finish stays."],["A critical one",false,"That moves the finish."],["The longest one",false,"Length isn't the test; float is."],["Any of them",false,"Only float-carrying ones are safe to move."]]},
   {q:"Why does the PEAK matter more than the average?",o:[["Camp, supervision, safety, hoists and workface must handle the busiest day",true,"Capacity is sized for the peak."],["Clients pay by the peak",false,"Not usually."],["P6 reports only peaks",false,"No."],["The average is always wrong",false,"It's just not what limits capacity."]]},
   {q:"The histogram peaks at 95 and the camp holds 60. First move?",o:[["Level non-critical work within its float; if that's not enough, re-sequence or plan extra accommodation",true,"Fix it in the plan before it becomes a problem on site."],["Ignore it",false,"It'll become a site problem."],["Cut the durations",false,"That raises the peak."],["Delete activities",false,"The work still exists."]]}]},
  {k:"explain",p:"Explain levelling in two sentences: what you move, and why the finish date doesn't change."},
  {k:"done"}]},

 {id:"U17",day:17,title:"Procurement planning inside the schedule",mins:30,
  card:{id:"c-ros",title:"Required-on-site date → back-calculate → procurement float",rule:"Take the ROS date from the installation's late start; back-calculate dispatch, PO and indent (vendor time in calendar days, your TAT in working days). Procurement float = ROS − forecast delivery. Link the delivery as the installation's predecessor.",example:"Commercial building DG set: ROS 10 Mar; transit 7 cd, manufacture 60 cd, TAT 15 wd → PO by about 2 Jan, indent by about mid-Dec. Forecast delivery 2 Mar → +8 days of procurement float.",trap:"Tracking only PO dates; forgetting that the ROS comes from the schedule's LATE start, not the early start."},
  screens:[
  {k:"read",t:`**Why it matters.** Most delays on your projects start in procurement: a late indent, slow approvals, the vendor's lead time. If deliveries aren't **in** the schedule, the schedule can't warn you.

Examples across project types:
- **Hospital**: chiller, medical gas manifold, modular OT panels
- **Commercial**: DG set, transformer, façade glazing
- **External works**: precast compound-wall panels, STP equipment, street lights`},
  {k:"read",t:`**Method, for each long-lead item:**
1. **ROS (required on site)** = the installation's **late start** (from the backward pass), minus a small buffer
2. Back-calculate: ROS − transit (calendar days) = dispatch; − manufacture (calendar days) = **PO by**; − your TAT (**working** days) = **indent by**
3. **Procurement float** = ROS − forecast delivery. Positive = buffer; negative = installation will start late
4. Link **delivery** as the installation's **predecessor**, so a vendor slip shows up automatically

**Example: DG set, commercial building.** ROS 10 Mar; transit 7 cd; manufacture 60 cd; TAT 15 wd.
- Dispatch by 3 Mar → PO by about 2 Jan → indent 15 working days earlier, about mid-December
- Forecast delivery 2 Mar → **+8 days** of procurement float`},
  {k:"drill",id:"proc",t:"Back-calculation on a Mon–Sat office calendar. New items each time."},
  {k:"quiz",bank:[
   {q:"Where does the ROS (required-on-site) date come from?",o:[["The installation activity's late start (minus a small buffer)",true,"That's the latest it can arrive without delaying the work."],["The vendor's quotation",false,"That's the forecast delivery, not the requirement."],["The PO date",false,"The PO is worked backward from the ROS."],["The early start",false,"The early start is the earliest it COULD be used; the ROS is the latest it MUST be there."]]},
   {q:"ROS 10 Mar, forecast delivery 2 Mar. What's the procurement float?",o:[["+8 days",true,"10 − 2 = 8 days of buffer."],["−8 days",false,"Delivery is before the ROS: positive."],["0",false,"There's a gap."],["2 days",false,"Compare the two dates."]]},
   {q:"Vendor manufacture time should usually be counted in…",o:[["Calendar days",true,"Factories and transit run regardless of your site calendar."],["Site working days",false,"Your site calendar doesn't govern the vendor's factory."],["Weeks only",false,"Any unit is fine; the point is calendar time."],["Your office TAT days",false,"That's a different clock."]]},
   {q:"Why link the delivery milestone as the installation's predecessor?",o:[["A vendor slip then moves the installation and shows its impact automatically",true,"Procurement becomes part of the CPM."],["To make the schedule longer",false,"No."],["P6 requires it",false,"It's good practice, not a software rule."],["For billing",false,"Not the reason."]]},
   {q:"Precast compound-wall panels: ROS 15 Apr, manufacture 40 cd, transit 5 cd. When is the PO due?",o:[["About 1 Mar (15 Apr − 5 − 40 days)",true,"15 Apr − 5 = 10 Apr dispatch; − 40 days ≈ 1 Mar."],["15 Apr",false,"That's the ROS."],["10 Apr",false,"That's the dispatch date. Manufacture comes before it."],["15 Feb",false,"Recount: 45 calendar days before 15 Apr ≈ 1 Mar."]]}]},
  {k:"explain",p:"Explain ROS and procurement float to your procurement team in two sentences, with one item from a non-hospital project."},
  {k:"done"}]},

 {id:"U18",day:18,title:"Reading a contractor's schedule critically",mins:30,
  card:{id:"c-quality",title:"Six checks before you accept a schedule",rule:"Before accepting any programme: 1) open ends (missing logic), 2) leads and excessive lags, 3) hard constraints, 4) very long durations (> ~44 WD), 5) missing procurement, approvals and T&C, 6) the critical path makes sense (continuous, starts at the start, ends at handover).",example:"Contractor's 250-activity commercial building programme: 31 activities with no successor, 12 'must finish on' dates, a single 120-day 'MEP works' bar, no fire NOC or DG delivery → returned with comments.",trap:"Accepting a nice-looking Gantt chart without checking the logic underneath."},
  screens:[
  {k:"read",t:`**Why it matters.** Contractors submit programmes that **look** good: coloured bars, a handover date that matches the contract. As the PMC, you're the one who checks whether it's a real plan or a drawing of hope. Once you accept it, it becomes the baseline you'll measure everything against.`},
  {k:"read",t:`**Six checks (a simplified version of the industry-standard DCMA checks):**
1. **Open ends**: activities with no predecessor or no successor (other than the start and finish). Delays on them don't flow through.
2. **Leads and big lags**: negative lags, or long lags hiding real work.
3. **Hard constraints**: fixed dates overriding logic.
4. **Long durations**: bars over about 44 working days ("MEP works, 120 days") can't be measured.
5. **Missing scope**: procurement, approvals (fire NOC, OC), testing and commissioning, external works.
6. **Critical path sense**: is it continuous from start to handover? Is it the work you'd expect (structure, MEP, T&C) and not, say, signage?

Send it back with **specific comments**, not "please revise".`},
  {k:"quiz",bank:[
   {q:"31 activities have no successor. Why is that a problem?",o:[["Delays on them don't flow to later work or the finish, so the critical path and float are wrong",true,"Open ends break the CPM."],["It makes the file large",false,"Not the issue."],["Contractors like it",false,"Irrelevant."],["It's fine for MEP",false,"No trade is exempt."]]},
   {q:"The programme has one bar: 'MEP works, 120 days'. What do you ask for?",o:[["Break it down by system and zone into measurable activities (each under ~44 WD)",true,"You can't measure or control one 120-day bar."],["Nothing, the duration looks fine",false,"You can't tell what's late inside it."],["Make it 90 days",false,"Shorter isn't the fix; detail is."],["Add a constraint",false,"No."]]},
   {q:"Which missing item would you flag on a commercial building programme?",o:[["Fire NOC and DG set delivery/installation",true,"Approvals and long-lead items gate occupancy and power."],["Office party",false,"Not scope."],["Daily attendance",false,"Not a schedule activity."],["Weather forecast",false,"Not an activity."]]},
   {q:"The critical path runs through 'signage installation'. What does that suggest?",o:[["Something's wrong with the logic (missing links or constraints), so investigate",true,"Signage is rarely what really drives handover."],["Signage is the most important work",false,"Unlikely; check the logic."],["Accept it",false,"Investigate first."],["Ask the client",false,"It's a schedule logic issue."]]},
   {q:"How do you return a weak contractor programme?",o:[["With specific, numbered comments (e.g. '31 open ends, list attached; split MEP into systems/zones; add fire NOC')",true,"Specific comments get specific fixes."],["'Please revise'",false,"Too vague: you'll get the same thing back."],["Reject it with no reason",false,"Unhelpful."],["Fix it yourself silently",false,"Then it's your programme, not theirs."]]}]},
  {k:"explain",p:"List, in your own words, the six checks you'd run on a contractor's programme, and say which one you think is most often missed on your projects."},
  {k:"done"}]},

 {id:"U19",day:19,title:"Updating the schedule and planning recovery",mins:30,
  card:{id:"c-update",title:"Honest update, then costed recovery",rule:"Update: set the data date; enter actual starts and finishes; set remaining durations from site (not from the plan); reschedule; check for out-of-sequence work. Then compare against the baseline and propose costed recovery (crash / fast-track / re-sequence / scope / EOT).",example:"External works update, data date 30 Sep: kerbing started 10 Sep, 40% done by quantity, site says 9 days left → remaining duration 9, not the planned 6. The forecast moves; recovery: second kerbing crew (₹X, recovers 4 days).",trap:"Updating by '% of planned duration' instead of the site's remaining estimate; re-sequencing on paper without telling site."},
  screens:[
  {k:"read",t:`**Why it matters.** A schedule is only useful if it's updated **honestly** every cycle. A bad update looks on track until the month it suddenly isn't.

**Update steps:**
1. Set the **data date** (e.g. 30 Sep)
2. Finished work: enter **actual start and finish**
3. Work in progress: **actual start** + **remaining duration**, as estimated by site from the quantity left, not by "planned minus elapsed"
4. Reschedule. Check for **out-of-sequence** work (started before its predecessor finished)
5. Compare against the **baseline**: what moved, and why`},
  {k:"read",t:`**Example: external works, data date 30 Sep**
- Kerbing: started 10 Sep, 40% done by length, planned 15 WD
- "Planned minus elapsed" says 6 days left
- Site says **9 days** (the rate is slower than planned) → enter **9**

The forecast moves 3 days. If kerbing is critical, handover moves 3 days.

**Recovery, priced:**
- Second kerbing crew: ₹X, recovers 4 days (if there's front available)
- Re-sequence: start asphalt on finished sections (needs the base course done there)
- Accept: 3 days, LD ₹Y

Choose, then **tell site**. A recovery that exists only on paper isn't a recovery.`},
  {k:"guided",level:2,fwd:false,t:"A full pass with lags: the arithmetic behind every update."},
  {k:"quiz",bank:[
   {q:"Kerbing is 40% done; planned 15 WD; site says 9 days left. What remaining duration do you enter?",o:[["9",true,"Use the site's estimate from the work left."],["6",false,"That's 'planned minus elapsed', which hides the slower rate."],["15",false,"That ignores the progress made."],["0",false,"It's not finished."]]},
   {q:"What does 'out-of-sequence progress' mean?",o:[["Work started before its predecessor finished",true,"Check whether the logic is wrong or the site took a risk."],["Work finished early",false,"Not the definition."],["A missing data date",false,"No."],["A negative lag",false,"No."]]},
   {q:"After the update the forecast is 3 days late on the critical path. First thing to do?",o:[["Explain why (which activity, which rate) and price the recovery options",true,"Cause, impact, options."],["Change the baseline",false,"That hides the variance."],["Wait for next month",false,"It's cheaper to act early."],["Reduce the durations on paper",false,"Fiction."]]},
   {q:"Why must a recovery plan be communicated to site?",o:[["Otherwise the schedule shows a recovery that nobody is executing",true,"A plan on paper isn't progress."],["For formality",false,"It's execution, not formality."],["The client insists",false,"It's about delivery."],["P6 needs approval",false,"No."]]},
   {q:"Which recovery fits 'asphalt can start on sections whose base course is finished'?",o:[["Re-sequencing (working section by section instead of all at the end)",true,"Changing the order to use the available front."],["Crashing",false,"That's adding resources."],["Scope reduction",false,"Nothing is removed."],["EOT",false,"That's contractual."]]}]},
  {k:"explain",p:"Explain why 'planned minus elapsed' gives a dishonest update, with a real example from your site."},
  {k:"done"}]},

 {id:"U20",day:20,title:"Day 20: Schedule Mechanics Checkpoint",mins:30,milestone:true,
  card:{id:"c-sched-check",title:"Schedule Mechanics: Logic, Float & Critical Paths",rule:"Schedule = activities + durations + logic; calculate in marks, convert once; forward = largest + add once; backward = smallest + subtract; float = LS − ES; report the level AND the rate; price recovery options; check the ROS for long-lead items.",example:"From any project (hospital, commercial or external works) you can build a small network, find the critical path, read the float trend, and write an impact statement with options.",trap:"Thinking the gate is the end. It's the base for P6, progress and cost."},
  screens:[
  {k:"read",t:`**Day 20 Checkpoint checks everything from Days 1–19 together**, consolidating your CPM scheduling foundations before proceeding to site measurement, quantity control, and commercial audits.

1. A full guided CPM pass with SS links (one run)
2. A duration check and a procurement back-calculation
3. **10 questions** mixed from every topic. Pass = **8 of 10**.

If you don't pass, it shows exactly which days to revisit, and you try fresh questions after revising. No rush: the foundation is what everything after it stands on.`},
  {k:"guided",level:3,fwd:false,t:"Full pass with SS links and lags. No candidates shown until a mistake."},
  {k:"drill",id:"duration",t:"Duration from quantities."},
  {k:"drill",id:"proc",t:"Procurement back-calculation."},
  {k:"quiz",n:10,bank:[
   {q:"B is SS+3 from A. A has ES 4, EF 10. B's ES?",o:[["7",true,"A's start 4 + 3."],["13",false,"That counts from A's finish."],["10",false,"That's FS with no lag."],["3",false,"Add the lag to A's start."]]},
   {q:"D needs B (EF 12) and C (EF 15), both FS. D's ES?",o:[["15",true,"Largest."],["12",false,"Smallest is the backward rule."],["27",false,"Don't add candidates."],["13.5",false,"No averages."]]},
   {q:"A must finish before B (LS 6) and C (LS 9). A's LF?",o:[["6",true,"Smallest going backward."],["9",false,"Then B would be late."],["15",false,"Don't add."],["7.5",false,"No averages."]]},
   {q:"Activity ES 5, LS 9. Total float?",o:[["4",true,"9 − 5."],["14",false,"Subtract."],["9",false,"That's LS."],["0",false,"0 would be critical."]]},
   {q:"Forward finish at mark 80, contract finish at mark 74. Critical-path TF?",o:[["−6",true,"74 − 80."],["+6",false,"The required date is earlier, so it's negative."],["0",false,"There's a gap."],["74",false,"That's the date mark."]]},
   {q:"External drainage float 18 → 12 → 7 over monthly updates. Report line?",o:[["TF 7 WD, falling ~5–6/month, critical in ~1–2 months; it gates OC; act now",true,"Level, rate, consequence, action."],["Drainage has float, fine",false,"It misses the trend."],["Drainage critical",false,"Not yet."],["Nothing to report",false,"The trend is the warning."]]},
   {q:"Paving 3,000 m², 60 m² per crew-day, 5 crews. Working days?",o:[["10",true,"3,000 ÷ 60 = 50 crew-days ÷ 5 = 10."],["50",false,"That's crew-days."],["250",false,"Divide."],["12",false,"Recheck."]]},
   {q:"The vendor says 'delivery 5 Feb'. Correct report wording?",o:[["Delivered to site 5 Feb; installation starts after receipt and inspection",true,"It names the event."],["Installed 5 Feb",false,"Delivery isn't installation."],["Complete 5 Feb",false,"The date-OF mistake."],["Feb",false,"Too vague."]]},
   {q:"The client hands over the area from 1 Dec. Best model?",o:[["A milestone predecessor 'Area handed over'",true,"Logic, not a fixed date."],["Must finish on",false,"Hard constraint."],["Lengthen the duration",false,"Hides the reason."],["Ignore it",false,"Wrong dates."]]},
   {q:"A contractor's programme has a 140-day 'Finishing works' bar. Your comment?",o:[["Split it by area/trade into measurable activities under ~44 WD",true,"You can't control one huge bar."],["Accept it",false,"Not measurable."],["Ask for 100 days",false,"Detail is the fix, not a shorter bar."],["Add a constraint",false,"No."]]},
   {q:"Peak headcount 80, camp capacity 55. First move?",o:[["Level non-critical work within its float, then re-sequence or add accommodation if needed",true,"Fix it in the plan first."],["Ignore it",false,"It becomes a site problem."],["Shorten the durations",false,"That raises the peak."],["Delete activities",false,"The work remains."]]},
   {q:"PPC this week is 58%; the top reason is 'material not on site'. The fix?",o:[["Screen material in the look-ahead 2–3 weeks earlier, and chase POs and deliveries",true,"Constraint removal upstream."],["Push the crew harder",false,"There was no material."],["Lower the target",false,"That hides it."],["Add manpower",false,"Not the constraint."]]},
   {q:"Which recovery overlaps activities that were in sequence?",o:[["Fast-tracking",true,"FS → SS overlap, with rework risk."],["Crashing",false,"That adds resources."],["EOT",false,"Contractual."],["Levelling",false,"That flattens resources."]]},
   {q:"Curing for 7 days on a Mon–Sat site. Lag calendar?",o:[["Calendar days (7-day)",true,"Concrete cures on Sundays too."],["6-day site",false,"That adds an unnecessary day."],["Hard constraint",false,"Use a lag."],["None",false,"Curing is real."]]}]},
  {k:"explain",p:"Gate reflection: which three ideas from Days 1–19 will change how you run your Monday review, and how?"},
  {k:"done"}]},
];

        k: "read",
        t: `**Mathematical Standards & IS 1786 Rolling Margins**

1. **Theoretical Weight Derivation**:
   Based on steel density $\\rho = 7,850\\text{ kg/m}^3$:
   $$W = \\frac{\\pi \\times (d/1000)^2}{4} \\times 7,850 = \\frac{d^2}{162.28} \\approx \\frac{d^2}{162}\\text{ kg/m}$$
   - 8 mm: $0.395\\text{ kg/m}$
   - 12 mm: $0.888\\text{ kg/m}$
   - 16 mm: $1.578\\text{ kg/m}$
   - 20 mm: $2.466\\text{ kg/m}$
   - 25 mm: $3.853\\text{ kg/m}$
   - 32 mm: $6.313\\text{ kg/m}$

function genSteel(){
  const rows=[]; const dias=[8,10,12,16,20,25];
  const n=rnd(2,3); [...dias].sort(()=>Math.random()-.5).slice(0,n).forEach(d=>{ rows.push({d,nos:rnd(8,60),len:rnd(20,120)/10}); });
  rows.forEach(r=>{ r.uw=+(r.d*r.d/162).toFixed(3); r.tl=+(r.nos*r.len).toFixed(1); r.kg=+(r.tl*r.uw).toFixed(1); });
  return {type:"steel", el:pick(["Beam B12, 3rd floor","Footing F4","Slab panel S2, Ch 0+100 culvert","Column C7, ground to first"]), rows, ans:{total:+rows.reduce((a,r)=>a+r.kg,0).toFixed(1), uw0:rows[0].uw}};
}
function genPlaster(){
  const L=rnd(40,90)/10, H=rnd(28,36)/10, gross=+(2*L*H).toFixed(2);
  const pool=[["Ventilator",0.6,0.6],["Window",1.2,1.5],["Door",1.0,2.1],["Window",1.5,1.2],["Opening",2.4,2.0],["Shaft opening",1.8,2.1],["Pass box",0.45,0.45]];
  const ops=[...pool].sort(()=>Math.random()-.5).slice(0,rnd(2,4)).map(([n,w,h])=>({n,w,h,a:+(w*h).toFixed(2)}));
  let ded=0; ops.forEach(o=>{ o.rule=o.a<=0.5?0:o.a<=3?1:2; ded+=o.a*o.rule; });
  return {type:"plaster", L,H,gross,ops, ans:{gross, ded:+ded.toFixed(2), net:+(gross-ded).toFixed(2)}};
}
function genEndArea(){
  const n=rnd(3,4), step=pick([20,25,50]); const ch=[], A=[];
  for(let i=0;i<=n;i++){ ch.push(i*step); A.push(rnd(18,60)/10); }
  const parts=A.slice(1).map((a,i)=>+(((A[i]+a)/2)*step).toFixed(2)); const total=+parts.reduce((x,y)=>x+y,0).toFixed(2);
  return {type:"endarea", ch, A, step, parts, ans:{first:parts[0], total}};
}
function genRABill(){
  const items=[["Brick masonry 230 mm","m³",rnd(55,75)*100],["Internal plaster 12 mm","m²",rnd(22,32)*10],["Vitrified tile flooring","m²",rnd(95,125)*10],["CPVC pipe 25 mm","rm",rnd(30,50)*10]];
  const sel=[...items].sort(()=>Math.random()-.5).slice(0,3).map(([n,u,rate])=>{ const boq=rnd(40,120)*10, prev=Math.round(boq*rnd(20,50)/100), cum=Math.round(boq*rnd(55,95)/100); return {n,u,rate,boq,prev,cum}; });
  const x=rnd(0,2); sel[x].cum=Math.round(sel[x].boq*rnd(104,115)/100);
  let cert=0, held=0; sel.forEach(it=>{ const ok=Math.min(it.cum,it.boq)-it.prev, ex=Math.max(0,it.cum-it.boq); it.ok=ok; it.ex=ex; cert+=ok*it.rate; held+=ex*it.rate; });
  const ret=pick([5,10]);
  return {type:"rabill", sel, x, ret, ans:{over:String(x), cert:Math.round(cert), held:Math.round(held), net:Math.round(cert*(1-ret/100))}};
}
function genRecon(){
  const extraItems=[
    {n:"Lead-lined drywall 2.0 mm Pb (CT room)",u:"m²",mat:rnd(2800,3400),lab:rnd(350,500),mach:rnd(100,200)},
    {n:"Conductive vinyl flooring (OT complex)",u:"m²",mat:rnd(1400,1800),lab:rnd(220,320),mach:rnd(80,150)},
    {n:"Heavy duty epoxy screed 4 mm",u:"m²",mat:rnd(900,1200),lab:rnd(180,260),mach:rnd(50,100)},
    {n:"Precast RCC drain cover slab with angle frame",u:"rm",mat:rnd(1600,2200),lab:rnd(300,420),mach:rnd(150,250)}
  ];
  const item=pick(extraItems);
  const prime=item.mat+item.lab+item.mach;
  const cpoh=Math.round(prime*0.15);
  const extraRate=prime+cpoh;
  const isCement=Math.random()<.5;
  const matType=isCement?"Cement (bags)":"Reinforcement steel (MT)";
  const theo=isCement?rnd(3500,5500):rnd(120,250);
  const permPct=isCement?2:3;
  const maxAllow=+(theo*(1+permPct/100)).toFixed(1);
  const isExcess=Math.random()<.65;
  const actual=isExcess?+(theo*(1+(permPct+rnd(15,35)/10)/100)).toFixed(1):+(theo*(1+(permPct-rnd(5,15)/10)/100)).toFixed(1);
  const excess=Math.max(0,+(actual-maxAllow).toFixed(1));
  const penalRate=isCement?450:75000;
  const penalty=Math.round(excess*penalRate);
  return {type:"recon",item,prime,cpoh,extraRate,matType,theo,permPct,maxAllow,actual,excess,penalRate,penalty,
    ans:{rate:extraRate,allow:Math.round(maxAllow),excess:Math.round(excess),pen:penalty}};
}

const _gr3=grade;
grade=function(q,vals){
  const out=[]; const num=(k,exp,tol=0)=>{ const v=parseFloat(vals[k]); out.push({k,ok:!isNaN(v)&&Math.abs(v-exp)<=tol+1e-9,exp,got:vals[k]??""}); };
  const str=(k,exp)=>out.push({k,ok:String(vals[k]||"")===String(exp),exp,got:vals[k]??""}); const a=q.ans;
  if(q.type==="steel"){ num("uw0",a.uw0,.002); num("total",a.total,Math.max(1,a.total*.005)); return out; }
  if(q.type==="plaster"){ num("gross",a.gross,.02); num("ded",a.ded,.02); num("net",a.net,.03); return out; }
  if(q.type==="endarea"){ num("first",a.first,.05); num("total",a.total,.1); return out; }
  if(q.type==="rabill"){ str("over",a.over); num("cert",a.cert,1); num("held",a.held,1); num("net",a.net,2); return out; }
  if(q.type==="recon"){ num("rate",a.rate,2); num("allow",a.allow,1); num("excess",a.excess,1); num("pen",a.pen,10); return out; }
  return _gr3(q,vals);
};
const _so3=solution;
solution=function(q){
  const a=q.ans;
  if(q.type==="steel") return q.rows.map(r=>`- ${r.d} mm: unit weight ${r.d}² ÷ 162 = ${r.uw} kg/m · length ${r.nos} × ${r.len} = ${r.tl} m · weight ${r.tl} × ${r.uw} = **${r.kg} kg**`).join("\n")+`\n- **Total = ${a.total} kg**\n\nOn site: count the bars and check the lengths against the bar schedule **before the pour**, jointly signed. After concreting, nobody can check.`;
  if(q.type==="plaster") return `- Gross = 2 faces × ${q.L} × ${q.H} = **${a.gross} m²**\n`+q.ops.map(o=>`- ${o.n} ${o.w}×${o.h} = ${o.a} m² → ${o.rule===0?"≤ 0.5: no deduction":o.rule===1?"0.5–3: deduct one face → "+o.a:"> 3: deduct both faces → "+(+(o.a*2).toFixed(2))}`).join("\n")+`\n- Deductions = **${a.ded} m²** → net = ${a.gross} − ${a.ded} = **${a.net} m²**\n\nAlways check the deduction rule in **your** contract's BOQ preamble. It can differ.`;
  if(q.type==="endarea") return q.parts.map((v,i)=>`- Ch ${q.ch[i]}–${q.ch[i+1]}: (${q.A[i]} + ${q.A[i+1]}) ÷ 2 × ${q.step} = **${v} m³**`).join("\n")+`\n- **Total = ${a.total} m³**\n\nThe cross-sections are taken jointly on site (ground levels before and after) and signed. The volume is in the original, undisturbed position, not the loose volume.`;
  if(q.type==="rabill") return q.sel.map((it,i)=>`- #${i+1} ${it.n}: certifiable cum = min(${it.cum}, BOQ ${it.boq}) = ${Math.min(it.cum,it.boq)} → this bill ${Math.min(it.cum,it.boq)} − ${it.prev} = ${it.ok} × ₹${it.rate} = ₹${(it.ok*it.rate).toLocaleString("en-IN")}${it.ex?` · **excess ${it.ex} ${it.u} held** (₹${(it.ex*it.rate).toLocaleString("en-IN")}) until a variation is approved`:""}`).join("\n")+`\n- Certified = **₹${a.cert.toLocaleString("en-IN")}**; held = **₹${a.held.toLocaleString("en-IN")}**\n- Net = certified × (1 − ${q.ret}%) = **₹${a.net.toLocaleString("en-IN")}**\n\nThen check that every quantity traces to a jointly signed MB entry.`;
  if(q.type==="recon") return `**Part A: Extra Item Rate Analysis**\n- Prime Cost = Material ₹${q.item.mat} + Labor ₹${q.item.lab} + Machinery ₹${q.item.mach} = **₹${q.prime}**\n- CP & OH @ 15% = ₹${q.prime} × 0.15 = **₹${q.cpoh}**\n- **Derived Rate = ₹${a.rate} per ${q.item.u}**\n\n**Part B: Material Reconciliation**\n- Max Allowable = ${q.theo} × (1 + ${q.permPct}%) = **${q.maxAllow}**\n- Actual Consumed = **${q.actual}**\n- Excess Wastage = ${q.actual} − ${q.maxAllow} = **${q.excess}**\n- **Penal Recovery = ${q.excess} × ₹${q.penalRate.toLocaleString("en-IN")} = ₹${a.pen.toLocaleString("en-IN")}**\n\nAlways ensure non-BOQ rates are backed by verified market invoices and standard labor constants. Material reconciliation must be executed before certifying final bills.`;
  return _so3(q);
};

  card:{id:"c-mb",title:"Measure jointly, record in the MB, measure hidden work before it's covered",rule:"Every billed quantity traces to a measurement-book (MB) entry: date, BOQ item, location, Nos × L × B × D, quantity, unit, signed jointly by the contractor and PMC. Hidden work (reinforcement, foundations, embedded conduits, underground pipes) is measured and photographed before it's covered. RA bill = cumulative to date − previous cumulative.",example:"Slab S2, 4th floor: reinforcement checked against the bar schedule and signed on the pour card before concreting; concrete measured from drawing dimensions after the pour.",trap:"Certifying a bill from the contractor's Excel with no jointly signed measurement behind it."},
  screens:[
  {k:"read",t:`**Why it matters.** Every rupee the client pays a contractor is paid against a **measured quantity**. If the measurement is wrong, the client overpays (and auditors find it), or the contractor's cash flow chokes. Measurement is also how progress is *proven*: "58% installed" must be backed by measured quantities.

As the PMC, your team **certifies** bills, so how measurement is done on your sites is your responsibility, even if site engineers do the measuring.`},
  {k:"read",t:`**How it's done**

- **Method of measurement:** the contract says how each item is measured, usually in the BOQ item description and preamble. Indian contracts often follow **IS 1200** and CPWD practice. The item description decides what's included (e.g. whether pipe fittings are separate).
- **Joint measurement:** the contractor's engineer and the PMC site engineer measure **together** and **both sign**.
- **Measurement Book (MB):** a numbered, page-wise record (paper or controlled digital). Each entry has: date · BOQ item no. · location (floor, grid, chainage) · Nos × L × B × D · quantity · unit · signatures.
- **RA (running account) bill:** each month, quantities are cumulative to date. This bill = cumulative now − cumulative last bill. The **final bill** closes it all at the end.`},
  {k:"read",t:`**Hidden work: measure it before it's covered**

Some work disappears:
- reinforcement (inside concrete)
- foundation depths and excavation levels
- conduits and sleeves embedded in slabs
- underground drainage and water pipes
- waterproofing layers under tiles or screed

These are measured, checked and **photographed before covering**, usually via a **pour card or checklist** signed by both parties. Once concreted or backfilled, nobody can verify them, so a missing record means either the client pays on trust or the contractor's claim gets disputed.

**Excavation** is measured in its **original, undisturbed position** (before digging), not as the loose heap afterwards.`},
  {k:"quiz",bank:[
   {q:"What is a 'joint measurement'?",o:[["Contractor and PMC/client engineers measure together and both sign",true,"Both parties agree the quantity at source."],["The contractor measures and emails it",false,"That's a claim, not an agreed measurement."],["Measuring two items at once",false,"No."],["Measuring at night",false,"No."]]},
   {q:"Why record reinforcement before the concrete pour?",o:[["Once it's concreted, it can't be checked or measured",true,"Hidden work must be verified before it's covered."],["Steel rusts after the pour",false,"Not the reason."],["Clients like photos",false,"Photos support it, but the reason is verifiability."],["It's cheaper",false,"No."]]},
   {q:"RA bill 5: cumulative plaster 1,800 m², bill 4 cumulative 1,350 m². Quantity this bill?",o:[["450 m²",true,"1,800 − 1,350."],["1,800 m²",false,"That's cumulative. You'd pay twice."],["3,150 m²",false,"Subtract, don't add."],["1,350 m²",false,"That's already paid."]]},
   {q:"What decides how an item is measured?",o:[["The contract's method of measurement: the BOQ item description and preamble (often IS 1200 / CPWD)",true,"The item description defines what's included and the unit."],["The contractor's usual practice",false,"Habit isn't the contract."],["Whatever's quickest on site",false,"No."],["The PMC engineer's preference",false,"The contract decides."]]},
   {q:"Excavation for a footing is measured as…",o:[["The volume in its original, undisturbed position, to the drawing dimensions",true,"Not the loose volume after digging."],["The loose volume in the heap",false,"Loose soil bulks up; that's not the measure."],["The number of truckloads",false,"Not the measure."],["Whatever the contractor claims",false,"Joint measurement decides."]]},
   {q:"Which MB entry is complete?",o:[["12 Nov · Item 4.2 · Block B, 3F, grid C-D/4-6 · 2 × 6.20 × 3.10 = 38.44 m² · signed by both",true,"Date, item, location, dimensions, quantity, unit, signatures."],["Plaster done, 38 m²",false,"No location, item, dimensions or signatures."],["Block B plaster as per site",false,"Unmeasured."],["38.44",false,"No unit, item, location or sign-off."]]}]},
  {k:"explain",p:"Explain to a new site engineer what an MB entry must contain, and why hidden work must be measured before it's covered."},
  {k:"apply",task:"Find out how measurement is actually done on one of your sites: who measures, is there an MB (paper, Excel or app), who signs, and how is hidden work recorded before covering? Write 5 lines, plus the one gap you'd fix first.",good:["Who measures and who signs, named by role","Where measurements are recorded","How hidden work is handled (pour cards, photos)","One concrete gap, with a fix, an owner and a date"],tmpl:"Site: \nWho measures: \nWhere recorded: \nWho signs: \nHidden work: \nGap + fix (owner, date): "},
  {k:"done"}]},
 {id:"M2",track:"M",title:"Measuring civil and structural work",mins:25,
  card:{id:"c-civil-meas",title:"Concrete m³ to drawing, steel kg by d²/162",rule:"Concrete: m³ from drawing dimensions (extra thickness isn't paid unless approved). Reinforcement: kg = total bar length × unit weight, with unit weight = d²/162 kg/m (d in mm); laps as per drawing; wastage normally not paid. Formwork: m² of contact area (if it's a separate item). Excavation: m³ in original ground, to drawing dimensions plus any specified working space.",example:"12 mm bars: 144 ÷ 162 = 0.889 kg/m. 40 bars × 6.5 m = 260 m → 231 kg.",trap:"Paying steel by delivery challan weight instead of the measured bar schedule; paying for over-excavation."},
  screens:[
  {k:"read",t:`**Concrete (m³)**: measured from the **drawing dimensions** of the element (L × B × D). If the contractor pours a 160 mm slab where the drawing says 150, the extra concrete isn't paid unless it was approved.

**Formwork (m²)**: if it's a separate BOQ item, it's the area of formwork **in contact** with the concrete (soffits and sides).

**Excavation (m³)**: drawing dimensions in **original ground**, plus any working space the contract specifies. Over-digging by the contractor isn't paid.

**Blockwork / brickwork**: m³ or m² as the BOQ says, with deductions for openings per the contract rule.`},
  {k:"read",t:`**Reinforcement (kg)**: weighed by calculation, not by truck challan.

**Unit weight (kg per metre) = d² ÷ 162**, with d = bar diameter in mm.
- 8 mm: 64 ÷ 162 = 0.395
- 12 mm: 144 ÷ 162 = **0.889**
- 16 mm: 256 ÷ 162 = 1.580
- 20 mm: 400 ÷ 162 = 2.469

**Steps:** from the **bar bending schedule**: number of bars × cut length = total length; × unit weight = kg.

**Example:** 40 bars of 12 mm × 6.5 m = 260 m × 0.889 = **231 kg**.

Laps are paid as shown on the drawings or as approved. Wastage and binding wire usually aren't separately paid; check your BOQ.`},
  {k:"drill",id:"steel",t:"Bar schedule to kg. New numbers each time."},
  {k:"quiz",bank:[
   {q:"Unit weight of a 16 mm bar (kg/m)?",o:[["1.580",true,"16² = 256; 256 ÷ 162 = 1.580."],["0.889",false,"That's 12 mm."],["2.469",false,"That's 20 mm."],["16.0",false,"Use d² ÷ 162."]]},
   {q:"The slab is drawn at 150 mm but poured at 165 mm without approval. Concrete paid on…",o:[["150 mm (drawing dimension)",true,"Extra thickness isn't paid unless approved."],["165 mm",false,"That's the actual pour, not the approved dimension."],["Whatever the challan says",false,"Measure, don't trust challans."],["The average",false,"No."]]},
   {q:"Steel should be measured for payment from…",o:[["The bar bending schedule (length × unit weight), verified on site before the pour",true,"Calculated weight from the measured bars."],["The truck delivery challan",false,"That's material delivered, not steel fixed in the work."],["The contractor's invoice",false,"Not a measurement."],["A visual estimate",false,"No."]]},
   {q:"30 bars of 10 mm × 4 m. Weight?",o:[["About 74 kg",true,"120 m × 0.617 (100 ÷ 162) ≈ 74 kg."],["120 kg",false,"That's the length. Multiply by the unit weight."],["617 kg",false,"Check the units: 0.617 kg/m × 120 m."],["30 kg",false,"Recount."]]},
   {q:"The contractor over-excavated 300 mm beyond the drawing's footing size. Is it paid?",o:[["No, only the drawing dimensions plus any specified working space",true,"Over-excavation is at the contractor's cost."],["Yes, everything excavated",false,"Not unless instructed or approved."],["Half",false,"No."],["Only if the soil is hard",false,"No."]]}]},
  {k:"explain",p:"Explain d² ÷ 162 to a junior: what it gives, and how you'd measure the steel in one beam."},
  {k:"apply",task:"Take one RCC element from a real drawing (a beam, footing or slab panel). Measure the concrete (m³) and the steel (kg) from its bar schedule using d² ÷ 162. Show your working.",good:["Concrete from drawing dimensions","Steel: bars × length × unit weight by diameter","Units correct","Says how you'd verify it on site before the pour"],tmpl:"Element: \nConcrete: L × B × D = \nSteel: dia | nos | length | unit wt | kg\nTotal steel: \nSite verification: "},
  {k:"done"}]},
 {id:"M3",track:"M",title:"Measuring finishes: areas and deductions",mins:25,
  card:{id:"c-deduct",title:"Areas net of openings, using the contract's deduction rule",rule:"Finishes (plaster, paint, tiling, ceiling) are measured in m² of the finished surface, net of openings per the contract's deduction rule. A typical IS 1200 Part 12 plaster rule: ≤ 0.5 m² no deduction; 0.5–3 m² deduct one face only; > 3 m² deduct both faces (and measure the reveals).",example:"Wall 6 × 3 m, both faces = 36 m². Window 1.8 m² → deduct once; door 2.1 m² → once; ventilator 0.36 → none; opening 5 m² → both faces = 10. Net = 36 − 1.8 − 2.1 − 10 = 22.1 m².",trap:"Deducting every opening on both faces, or none at all; not reading the BOQ preamble."},
  screens:[
  {k:"read",t:`**Why it matters.** Finishes are big money and big quantities: thousands of m² of plaster, paint, tiles and ceilings. Small rule errors multiply.

**The general rule:** measure the **finished surface area** (m²), then handle the **openings** (doors, windows, ventilators, shafts) using the deduction rule in **your contract**.

**A typical rule for plaster** (IS 1200 Part 12, widely used in Indian contracts; always confirm in your BOQ preamble):
- opening **≤ 0.5 m²**: no deduction
- opening **over 0.5 up to 3 m²**: deduct **one face only** (no extra for the reveals)
- opening **over 3 m²**: deduct **both faces**, and measure the reveals (jambs, sills, soffits) separately`},
  {k:"read",t:`**Worked example:** a wall 6 m × 3 m, plastered on both faces.
- Gross = 2 × 6 × 3 = **36 m²**
- Ventilator 0.6 × 0.6 = 0.36 m² → ≤ 0.5 → **no deduction**
- Window 1.2 × 1.5 = 1.8 m² → one face → **1.8**
- Door 1.0 × 2.1 = 2.1 m² → one face → **2.1**
- Opening 2.5 × 2.0 = 5.0 m² → both faces → **10.0**
- **Net = 36 − 1.8 − 2.1 − 10 = 22.1 m²**

**Other finishes:** tiling = area actually laid; skirting in rm or m², as per the BOQ; false ceiling m²; painting usually follows the plaster areas. Again, **the BOQ item and preamble decide**.`},
  {k:"drill",id:"plaster",t:"Apply the stated rule. New wall each time."},
  {k:"quiz",bank:[
   {q:"Under the typical rule, a 0.4 m² ventilator in a plastered wall is…",o:[["Not deducted",true,"≤ 0.5 m²: no deduction."],["Deducted on one face",false,"That's for 0.5–3 m²."],["Deducted on both faces",false,"That's for over 3 m²."],["Measured as extra",false,"No."]]},
   {q:"A 2.0 m² window, wall plastered on both faces. Deduction?",o:[["2.0 m² (one face)",true,"0.5–3 m²: one face only."],["4.0 m²",false,"Both faces only applies over 3 m²."],["0",false,"Over 0.5, so there is a deduction."],["1.0 m²",false,"No halving."]]},
   {q:"A 4.5 m² opening, both faces plastered. Deduction?",o:[["9.0 m² (both faces), with the reveals measured separately",true,"Over 3 m²: deduct both faces."],["4.5 m²",false,"That's the one-face rule."],["0",false,"Large openings are deducted."],["2.25 m²",false,"No."]]},
   {q:"Where do you confirm which deduction rule applies?",o:[["The BOQ preamble / method of measurement in your contract",true,"Contracts can differ from IS 1200."],["The contractor's bill",false,"That's their claim."],["Google",false,"The contract governs."],["The painter",false,"No."]]},
   {q:"Tiling is generally measured as…",o:[["The area actually laid (m²), per the BOQ item",true,"Finished area, not tiles purchased."],["The number of tile boxes delivered",false,"That's material."],["The room's floor area regardless of fixtures",false,"Measure what's laid."],["The skirting length",false,"That's usually a separate item."]]}]},
  {k:"explain",p:"Explain the three plaster deduction bands in your own words, and why the BOQ preamble matters."},
  {k:"apply",task:"On one real room or wall, measure the plaster (or paint) area with its openings using the deduction rule from YOUR contract's BOQ preamble. Note any difference from the typical rule.",good:["Gross area with dimensions","Each opening sized and banded","The deduction rule quoted from the actual contract","Net area"],tmpl:"Wall/room: \nGross: \nOpenings: \nRule from BOQ preamble: \nNet: "},
  {k:"done"}]},
 {id:"M4",track:"M",title:"Measuring MEP and external works",mins:25,
  card:{id:"c-mep-ext",title:"MEP by the item description; earthwork by average end area",rule:"MEP: pipes and cables in rm along the run, ducts in m² of surface or kg, equipment and points in Nos, with what's included (fittings, supports) set by the BOQ item. Some BOQs allow stage payments (supply / install / test). External works: earthwork by cross-sections, V = (A1 + A2) ÷ 2 × L; GSB/WMM m³ compacted; kerbs and drains rm; manholes Nos; pavers m².",example:"Road cut: Ch 0 = 3.2 m², Ch 25 = 4.0 m² → (3.2 + 4.0) ÷ 2 × 25 = 90 m³.",trap:"Paying pipe fittings twice (inside the rm rate and as a separate item); measuring loose earth."},
  screens:[
  {k:"read",t:`**MEP: read the item description first.** It decides the unit and what's included.
- **Piping**: running metres along the centreline. Fittings and supports are either included in the rate or measured separately. Never both.
- **Ductwork**: m² of sheet surface area or kg of sheet, per the BOQ. Insulation is usually a separate m² item.
- **Cables**: rm. **Cable trays**: rm. **Wiring**: often per "point".
- **Equipment** (AHUs, pumps, panels, DG sets): Nos, often with **stage payments** in the BOQ notes (e.g. a % on supply, on installation, and on testing and commissioning).

Measured MEP quantities also feed **progress**: installed rm ÷ BOQ rm, the same idea as Day 1's "installed, not store-issued".`},
  {k:"read",t:`**External works**
- **Earthwork (cutting / filling)**: cross-sections taken jointly at regular chainages, before and after. Volume between two sections = **(A1 + A2) ÷ 2 × distance** (the *average end area* method).
- **GSB / WMM** (sub-base, base): m³ compacted, to drawing dimensions.
- **Bituminous layers**: m² or tonnes, per the BOQ.
- **Kerbs, drains, pipes**: rm. **Manholes, chambers, light poles**: Nos. **Paver blocks**: m².

**Example:** cut area 3.2 m² at Ch 0 and 4.0 m² at Ch 25 → (3.2 + 4.0) ÷ 2 × 25 = **90 m³**.`},
  {k:"drill",id:"endarea",t:"Cross-sections to volume."},
  {k:"quiz",bank:[
   {q:"Cut areas 2.0 m² at Ch 0 and 3.0 m² at Ch 20. Volume?",o:[["50 m³",true,"(2 + 3) ÷ 2 × 20 = 50."],["100 m³",false,"Average the areas first: 2.5 × 20."],["5 m³",false,"Multiply by the distance."],["60 m³",false,"Recheck: 2.5 × 20."]]},
   {q:"The pipe BOQ item says 'rate inclusive of fittings'. The contractor also bills fittings separately. What do you do?",o:[["Reject the separate fittings: they're already in the rm rate",true,"That's double payment."],["Pay both",false,"Double payment."],["Pay half",false,"No basis."],["Ask the painter",false,"No."]]},
   {q:"The AHU BOQ note allows 70% on supply, 20% on installation, 10% on T&C. The AHU is delivered and installed, not tested. Payable?",o:[["90%",true,"70 + 20; the 10% waits for T&C."],["100%",false,"T&C isn't done."],["70%",false,"Installation is also done."],["0",false,"The stages are payable."]]},
   {q:"GSB sub-base is measured as…",o:[["m³ compacted, to drawing dimensions",true,"Compacted in place, not the loose material."],["Truckloads delivered",false,"That's material."],["m² only",false,"It's a thickness layer, measured in m³ unless the BOQ says otherwise."],["Nos",false,"No."]]},
   {q:"Why must cross-sections be taken jointly before the earthwork starts?",o:[["Original ground levels disappear once you dig; without agreed 'before' levels, the volume can't be verified",true,"Same principle as hidden work."],["For photos only",false,"Levels are the measurement."],["The client asks for it",false,"It's needed for verification."],["It isn't necessary",false,"It is."]]}]},
  {k:"explain",p:"Explain the average end area method to a site engineer, and why the 'before' levels must be taken jointly."},
  {k:"apply",task:"Pick one MEP item and one external-works item from a live BOQ. For each: the unit, what the item description includes or excludes, and how you'd measure it on site.",good:["The unit is correct per the BOQ","Inclusions and exclusions read from the item description","Site measurement method (joint, before covering, cross-sections)","Any stage-payment rule noted"],tmpl:"MEP item: | unit | includes | measure how\nExternal item: | unit | includes | measure how"},
  {k:"done"}]},
 {id:"M5",track:"M",title:"Checking a contractor's running bill",mins:30,
  card:{id:"c-rabill",title:"RA bill check: MB → BOQ limit → rate → deductions",rule:"For each item: the quantity traces to a jointly signed MB entry; cumulative ≤ BOQ quantity (excess is held until a variation is approved); the item exists in the BOQ; rate = BOQ rate; work done, not material at site (unless the contract pays secured advance). Then retention and advance recovery. Sample re-measure, and cross-check with progress quantities.",example:"Tiling claimed at 108% of BOQ: certify up to 100%, hold the 8% pending variation approval; net after 5% retention.",trap:"Certifying cumulative instead of this-bill quantity; paying beyond BOQ without an approved variation."},
  screens:[
  {k:"read",t:`**Why it matters.** RA bills are where measurement turns into money. Your team certifies them. A weak check means overpayment the client discovers at audit, or a contractor starved of cash because nobody checked quickly.

**The 6-point check, every item:**
1. **MB**: the quantity traces to a jointly signed measurement
2. **BOQ limit**: cumulative ≤ BOQ quantity. Any excess is held until a **variation** is approved.
3. **BOQ item**: it exists. Anything else is an extra item and needs approval and a rate.
4. **Rate** = the BOQ rate (or an approved variation rate)
5. **Work done**: not material lying at site, unless the contract pays a secured advance
6. **This bill** = cumulative now − previous cumulative`},
  {k:"read",t:`**Then the deductions** (more on these in the cash-flow days): retention %, mobilisation advance recovery, and any others the contract specifies.

**How the PMC verifies, without re-measuring everything:**
- **sample re-measurement** of high-value items
- cross-check against **progress quantities** and **photos**
- check against **drawings** (can the claimed quantity physically exist?)
- trend check: did this item's quantity jump suspiciously this month?

**Example:** tiling BOQ 1,000 m², previous 400, claimed cumulative 1,080 → certify up to 1,000 (this bill 600), **hold 80 m²** until a variation is approved.`},
  {k:"drill",id:"rabill",t:"A three-item bill with one item over BOQ. New numbers each time."},
  {k:"quiz",bank:[
   {q:"BOQ 1,000 m², previous cumulative 400, claimed cumulative 1,080. Certify this bill?",o:[["600 m², with 80 m² held pending variation",true,"Up to BOQ: 1,000 − 400 = 600; the excess of 80 waits for approval."],["680 m²",false,"That pays beyond BOQ without approval."],["1,080 m²",false,"That's cumulative, and includes the excess."],["0",false,"The work within BOQ is payable."]]},
   {q:"An item in the bill isn't in the BOQ at all. What is it?",o:[["An extra item: it needs approval and an agreed rate before payment",true,"Not payable by default."],["Payable at the contractor's rate",false,"Not without approval."],["Ignore it",false,"Respond formally."],["Pay half",false,"No basis."]]},
   {q:"The contractor bills tiles stacked on site but not laid. Under a normal item-rate contract…",o:[["Not payable as work done (only as a secured advance if the contract allows it)",true,"Work done = laid tiles."],["Payable at the full rate",false,"Material isn't work done."],["Payable at 50%",false,"Only if the contract says so."],["Payable if photos are attached",false,"Photos don't change the rule."]]},
   {q:"What's the smartest way for the PMC to verify a large bill quickly?",o:[["Sample re-measure the high-value items, cross-check progress and drawings, check for jumps",true,"Risk-based checking."],["Re-measure every item, every month",false,"Ideal, but rarely feasible. Use risk-based sampling."],["Trust it",false,"No."],["Reject it outright",false,"That starves the contractor's cash flow."]]},
   {q:"Certified this bill ₹4,00,000, retention 5%. Net?",o:[["₹3,80,000",true,"4,00,000 × 0.95."],["₹4,20,000",false,"Retention is deducted."],["₹20,000",false,"That's the retention amount."],["₹4,00,000",false,"Deduct the retention."]]}]},
  {k:"explain",p:"Explain to your billing engineer the 6-point check, and what happens to quantity claimed beyond BOQ."},
  {k:"apply",task:"Take last month's RA bill on one project. Check 3 high-value items against the 6 points. Note any item over BOQ, any extra item, and what approval each needs.",good:["MB traceability checked for each item","Cumulative vs BOQ for each item","Extra or excess items flagged with the approval needed","This-bill quantity, not cumulative, certified"],tmpl:"Project / bill no.: \nItem | MB ref | cum vs BOQ | rate ok? | work done? | finding\n\nApprovals needed: "},
  {k:"done"}]},
 {id:"M6",track:"M",title:"Rate analysis, extra items & material reconciliation",mins:30,
  card:{id:"c-star-recon",title:"Extra items by first principles; reconciliation within permissible wastage",rule:"Non-BOQ items: analyze from first principles (Material at site + Labor + Machinery/Scaffolding + 15% CP&OH). Deviation items beyond 125%: derive market rate for excess quantity. Material reconciliation: Theoretical consumption (drawings & coefficients) vs Actual consumption; allowable wastage (Cement 2%, Steel 3%); recover excess at contract penal rate.",example:"CT room lead drywall: Material ₹3,100 + Labor ₹420 + Plant ₹150 = ₹3,670 prime cost + 15% CP&OH (₹551) = ₹4,221/m². Cement reconciliation: 4,000 bags theoretical + 2% wastage = 4,080 allowable. Actual issued 4,150 bags → 70 bags excess charged at penal rate ₹450/bag = ₹31,500 recovery.",trap:"Paying extra items on supplier quotation without labor breakdown or markup check; skipping material reconciliation at final bill."},
  screens:[
  {k:"read",t:`**Why it matters.** On every construction project, two issues spark the most heated commercial disputes:
1. **Non-BOQ items (Extra items / Star items):** Scope changes or specialized items (e.g. lead lining for CT room, conductive vinyl for OT, extra deep excavation) that have no line item in the original BOQ.
2. **Material reconciliation:** Client-issued or bulk-controlled materials (cement, structural steel, rebar). Who pays for site wastage, theft, or over-break?

If the PMC doesn't master rate analysis and reconciliation, either the contractor inflates costs with arbitrary quotes, or the client loses millions in unrecovered material.`},
  {k:"read",t:`**1. Rate Analysis from First Principles (CPWD & Standard Practice)**
When an item is not in the BOQ, you build the rate from zero:
- **Material cost at site:** Invoices + loading/unloading + freight + handling + permissible material wastage (e.g. 2–5%).
- **Labour cost:** Standard labour coefficients (e.g. CPWD Analysis of Rates / DSR) × notified minimum / market wage rates.
- **Machinery & Equipment:** Hourly equipment charges (cranes, pumps, scaffolding, power).
- **Subtotal = Prime Cost**
- **Contractor's Profit & Overheads (CP & OH):** Standard **15%** added to Prime Cost (under CPWD and most Indian contracts).
- **Taxes:** GST applied as per contractual conditions.

**The 125% Deviation Rule:**
Under standard FIDIC / CPWD contracts, if a regular BOQ item exceeds its original BOQ quantity by more than **25%** (i.e. reaches > 125% of BOQ), the quantity up to 125% is paid at the BOQ rate; the quantity *beyond* 125% is subject to market rate analysis!`},
  {k:"read",t:`**2. Material Reconciliation & Penal Recovery**
On projects where material is issued by the client, or for verifying structural consumption against structural drawings:
1. **Theoretical Consumption:** Calculated strictly from approved drawings and standard consumption coefficients (e.g. 0.285 tonnes steel per m³ RCC, 0.45 bags cement per m² 12 mm plaster).
2. **Permissible Wastage:**
   - **Cement:** typically **2%**
   - **Reinforcement Steel:** typically **3%** (for cut pieces, offcuts beyond standard 12 m lengths)
   - **Structural Steel:** typically **4–5%**
3. **Allowable Consumption** = Theoretical Consumption × (1 + Permissible Wastage %)
4. **Actual Consumption** = Total material physically issued or consumed on site.
5. **Reconciliation Outcome:**
   - If Actual ≤ Allowable: **Fully in order.**
   - If Actual > Allowable: The difference is **Excess Wastage**.
   - Under standard contracts, Excess Wastage is recovered from the contractor's bill at a **Penal Rate** (often 1.5× to 2.0× the procurement rate or specified penal rate).`},
  {k:"drill",id:"recon",t:"Extra item rate derivation and material reconciliation. New numbers each time."},
  {k:"quiz",bank:[
   {q:"In CPWD and standard Indian contracts, what percentage is added for Contractor's Profit & Overheads (CP & OH) in first-principles rate analysis?",o:[["15%",true,"Standard CPWD and public sector norm is 15% on Prime Cost."],["10%",false,"10% is rarely used today; 15% is the recognized standard."],["25%",false,"25% is inflated unless agreed under special EPC risk."],["0%",false,"Contractor is entitled to overhead and profit."]]},
   {q:"A BOQ item quantity is 1,000 m². Total executed quantity reaches 1,400 m². Under the standard 25% deviation clause, how is it billed?",o:[["1,250 m² at BOQ rate; remaining 150 m² at derived market rate",true,"Deviation limit is 125% (1,000 × 1.25 = 1,250); excess 150 m² requires market rate analysis."],["All 1,400 m² at BOQ rate",false,"Deviation clause protects both parties once quantity exceeds 125%."],["All 1,400 m² at market rate",false,"Only the excess beyond 125% is re-rated."],["Hold payment for the entire item",false,"Work within limit is payable."]]},
   {q:"What is the standard permissible wastage for cement in structural works during material reconciliation?",o:[["2%",true,"CPWD / IS specifications allow 2% permissible wastage for cement."],["5%",false,"5% is too high for cement."],["0%",false,"Zero wastage is physically impossible on site."],["10%",false,"10% would represent massive negligence or pilferage."]]},

// ---- spaced repetition (SM-2 style, no Claude usage) ----
function deck(){
  const cards=Object.values(state.bank).map(e=>({id:e.id,title:e.title,rule:e.rule,example:e.example,trap:e.trap,src:"Notes"}));
  LESSONS.forEach(l=>{ if(state.sr["lesson-"+l.id]) cards.push({id:"lesson-"+l.id,title:l.title,rule:l.card.rule,example:l.card.example,trap:l.card.trap,src:"Lesson "+l.id}); });
  return cards;
}
function srOf(id){ return state.sr[id]||(state.sr[id]={interval:0,ease:2.5,reps:0,lapses:0,due:today(),added:today()}); }
function dueCards(){ const t=today(); return deck().filter(c=>srOf(c.id).due<=t).sort((a,b)=>srOf(a.id).due.localeCompare(srOf(b.id).due)||srOf(b.id).lapses-srOf(a.id).lapses); }
function srRate(id,r){
  const s=srOf(id);
  if(r==="missed"){ s.lapses++; s.reps=0; s.interval=1; s.ease=Math.max(1.3,s.ease-.2); }
  else if(r==="shaky"){ s.interval=Math.max(1,Math.round(Math.max(s.interval,1)*1.2)); s.ease=Math.max(1.3,s.ease-.15); }
  else { s.interval = s.reps===0?2 : s.reps===1?5 : Math.round(s.interval*s.ease); s.reps++; s.ease=Math.min(3,s.ease+.05); }
  s.due=addDays(s.interval); s.last=today(); s.lastRating=r;
}
function srForecast(){ const c=deck().map(x=>srOf(x.id).due); const t=today(), tm=addDays(1), wk=addDays(7);
  return {now:c.filter(d=>d<=t).length, tomorrow:c.filter(d=>d===tm).length, week:c.filter(d=>d>t&&d<=wk).length}; }
let drillQ=[], drillI=0;
function drillOrder(){
  return deck().sort((a,b)=>srOf(a.id).due.localeCompare(srOf(b.id).due));
  const t=today(), sd=state.selfdrill||{};
  const score=e=>{ const r=sd[e.id]; const due=state.reviews[e.id]&&state.reviews[e.id]<=t;
    return (r?.r==="missed"?0:r?.r==="shaky"?1:due?2:!r?3:4)*1e6 + (r?.date?Date.parse(r.date)/1e6:0); };
  return Object.values(state.bank).sort((a,b)=>score(a)-score(b));
}
function startDrill(all){ drillQ = all ? drillOrder() : dueCards(); if(!drillQ.length) drillQ=drillOrder(); drillI=0; tab("book"); renderBook(); $("bookwrap").scrollTop=0; }
function drillHtml(){
  if(!drillQ.length) return "";
  if(drillI>=drillQ.length){ const f=srForecast(); return `<div class="drill"><div class="q">Review finished</div><p>Coming up: ${f.tomorrow} tomorrow, ${f.week} within the next 7 days. Cards you missed come back tomorrow; cards you know move further out each time. Ratings go to the Director, but they don't change your checklist.</p><div class="btnrow"><button class="btn" id="dr-end">Close</button></div></div>`; }
  const e=drillQ[drillI];
  const s=srOf(e.id);
  return `<div class="drill"><small style="color:var(--muted)">Card ${drillI+1} of ${drillQ.length} · ${e.src} · ${s.reps?`seen ${s.reps}×, interval ${s.interval}d`:"new"}${s.lapses?` · forgotten ${s.lapses}×`:""} · no Claude usage</small>
    <div class="q">${esc(e.title)}</div>
    <p>Say the rule out loud, then work the example in your head${e.example&&/\d/.test(e.example)?", with the hops":""}. Only then reveal.</p>
    <div class="btnrow"><button class="btn" id="dr-show">Reveal</button><button class="btn" id="dr-end">Stop</button></div>
    <div class="ans" id="dr-ans"><h4>Rule</h4><p class="rule">${esc(e.rule)}</p>${e.example?`<h4>Worked example</h4><p>${esc(e.example)}</p>`:""}${e.trap?`<h4>Your trap</h4><p class="trap">${esc(e.trap)}</p>`:""}
      <div class="rate"><button data-r="missed">Missed<br><small>1 day</small></button><button data-r="shaky">Shaky<br><small>${Math.max(1,Math.round(Math.max(s.interval,1)*1.2))} days</small></button><button data-r="got">Got it<br><small>${s.reps===0?2:s.reps===1?5:Math.round(s.interval*s.ease)} days</small></button></div></div></div>`;
}
function wireDrill(){
  $("dr-show")&&($("dr-show").onclick=()=>$("dr-ans").classList.add("on"));
  $("dr-end")&&($("dr-end").onclick=()=>{ drillQ=[]; renderBook(); });
  const cardEl = $("bookwrap").querySelector(".drill");
  if(cardEl){
    let tX = null, tY = null;
    cardEl.ontouchstart = e => {
      if(e.touches.length === 1){
        tX = e.touches[0].clientX;
        tY = e.touches[0].clientY;
      }
    };
    cardEl.ontouchend = e => {
      if(tX == null || tY == null || e.changedTouches.length === 0) return;
      const diffX = e.changedTouches[0].clientX - tX;
      const diffY = e.changedTouches[0].clientY - tY;
      tX = null; tY = null;
      if(Math.abs(diffX) > 55 && Math.abs(diffX) > Math.abs(diffY) * 1.4){
        const ansOn = $("dr-ans") && $("dr-ans").classList.contains("on");
        if(!ansOn && $("dr-show")){ $("dr-show").click(); }
        else if(ansOn){
          const btn = diffX < 0 ? $("bookwrap").querySelector('[data-r="got"]') : $("bookwrap").querySelector('[data-r="missed"]');
          if(btn) btn.click();
        }
      }
    };
  }
  $("bookwrap").querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{
    const e=drillQ[drillI]; state.selfdrill=state.selfdrill||{}; state.selfdrill[e.id]={r:b.dataset.r,date:today(),reported:false};
    haptic(b.dataset.r === "got");
    if(b.dataset.r === "got") playTone("correct");
    srRate(e.id,b.dataset.r);
    drillI++; renderBook(); renderBadges(); await save(); });
}
function handoffPack(){
  const r=readiness(), due=dueList();
  const items=Object.values(state.items).filter(i=>i.status!=="not_started").map(i=>`- ${ST[i.status]?.[0]||""} ${i.item} (${i.domain}) ${i.score!=null?i.score:""}${i.weakness?" — weakness: "+i.weakness:""}`).join("\n");
  const book=Object.values(state.bank).map(e=>`### ${e.title}\nRule: ${e.rule}\n${e.explain?"Why: "+e.explain+"\n":""}${e.example?"Example: "+e.example+"\n":""}${e.trap?"My trap: "+e.trap+"\n":""}`).join("\n");
  return `# Project Controls 120-day mastery programme — handoff pack (${today()})

Paste this whole file into another assistant to continue a session while my Claude limit resets. When I'm back in the app, I'll paste that assistant's final summary into the Director.

## Instructions for the assistant
You are my Project Controls Training Director. Follow the programme below exactly. Session shape: TEACH → EXAMPLE → ATTEMPT → CORRECT → RETEST → CLOSE. Teach before testing. Max 3 attempts per question, then teach the answer. Always state working vs calendar days and what each date is the date OF. Score substance, not spelling. No flattery. End the session with a summary block titled "FOR THE DIRECTOR" listing what was taught, my scores per question with my stated confidence, and any weaknesses seen.

## Where I am
Day ${state.day}/90 · ${state.phase} · ${state.module}
Objective: ${state.objective}
Gate: ${state.gate}
Weighted score: ${r.overall}/100 (${band(r.overall)})
Retests due: ${due.map(d=>state.bank[d]?.title||d).join("; ")||"none"}

## Director's notes on my error patterns
${state.note||"none"}

## Checklist items started
${items||"none"}

## My notebook (already taught)
${book||"empty"}

## The programme
${RULES}`;
}
async function sendPack(){
  const text=handoffPack(); let copied=false;
  try{ await navigator.clipboard.writeText(text); copied=true; }catch{}
  const dl=await claude.use("downloads").catch(()=>null);
  if(dl){ try{ await dl.save({filename:`pc-handoff-day${state.day}-${today()}.md`, data:text}); setStatus(copied?"Handoff pack copied and offered as a download.":"Handoff pack offered as a download."); return; }catch{} }
  setStatus(copied?"Handoff pack copied. Paste it into the other app.":"Couldn't copy or download in this view.");
}

async function exportData(){
  const dl=await claude.use("downloads").catch(()=>null); if(!dl){ setStatus("Download isn't available in this view."); return false; }
  try{
    const fname = `pc-training-backup-${today()}.json`;
    await dl.save({filename: fname, data:JSON.stringify({exported:new Date().toISOString(),state,chat},null,2)});
    const totalDone = UNITS.filter(u=>cst(u.id).done).length;
    state.lastBackupUnits = totalDone;
    state.lastBackupAt = new Date().toISOString();
    state.lastBackupPromptUnits = totalDone;
    await save();
    setStatus("Backup saved to downloads (" + fname + ").");
    const m = $("backup-modal");
    if(m){
      const st = m.querySelector("#modal-backup-status");
      if(st) st.style.display = "block";
      setTimeout(() => { if($("backup-modal")) $("backup-modal").remove(); }, 1200);
    }
    return true;
  }catch(e){
    return false;
  }
}
